<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyTV — Рабочее ТВ</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0a0f1e;
      color: #e0e8ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      padding: 0.8rem 1.5rem;
      background: #111827;
      border-bottom: 1px solid #2a3450;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .header a {
      color: #5f7ecf;
      text-decoration: none;
      font-weight: 500;
    }
    .header a:hover { text-decoration: underline; }
    .header h1 {
      color: #b7ceff;
      font-size: 1.5rem;
      font-weight: 400;
    }
    .header .badge {
      background: #2a7a2a;
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      font-size: 0.7rem;
      color: #fff;
      margin-left: 0.5rem;
    }
    .channels-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      background: #0d1425;
      border-bottom: 1px solid #1e2a40;
      flex-shrink: 0;
      overflow-y: auto;
      max-height: 80px;
      align-items: center;
    }
    .channel-btn {
      background: #1a233a;
      border: 1px solid #2a3450;
      color: #cfdbff;
      padding: 0.3rem 0.9rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .channel-btn:hover {
      background: #2a3450;
      border-color: #5f7ecf;
    }
    .channel-btn.active {
      background: #5f7ecf;
      border-color: #5f7ecf;
      color: #fff;
    }
    .player {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
    }
    .player video {
      width: 100%;
      height: 100%;
      max-height: 100vh;
      background: #000;
      outline: none;
    }
    .loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.7);
      color: #8899cc;
      font-size: 1.2rem;
      pointer-events: none;
      transition: opacity 0.5s;
      flex-direction: column;
      gap: 0.5rem;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-overlay .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #2a3450;
      border-top: 4px solid #5f7ecf;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .error-msg { color: #f48024; font-size: 0.9rem; }
    .custom-url {
      display: flex;
      gap: 0.5rem;
      padding: 0.3rem 0.5rem;
      background: #1a233a;
      border-radius: 20px;
      align-items: center;
      flex-wrap: wrap;
    }
    .custom-url input {
      background: #0d1225;
      border: 1px solid #2a3450;
      color: #cfdbff;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      font-size: 0.8rem;
      min-width: 200px;
    }
    .custom-url button {
      background: #5f7ecf;
      border: none;
      color: #fff;
      padding: 0.2rem 0.8rem;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .custom-url button:hover { background: #7a9aef; }
    @media (max-width: 768px) {
      .header { padding: 0.5rem 1rem; }
      .header h1 { font-size: 1.2rem; }
      .channels-bar { gap: 0.3rem; padding: 0.3rem 0.5rem; max-height: 60px; }
      .channel-btn { font-size: 0.7rem; padding: 0.2rem 0.6rem; }
      .custom-url input { min-width: 120px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="/">🏰 Назад</a>
    <h1>📺 SkyTV <span class="badge">Рабочее</span></h1>
    <div class="custom-url">
      <input type="text" id="customUrlInput" placeholder="Вставьте ссылку .m3u8">
      <button id="addCustomBtn">➕ Добавить</button>
    </div>
  </div>

  <div class="channels-bar" id="channelsBar"></div>

  <div class="player">
    <video id="video" controls autoplay></video>
    <div class="loading-overlay" id="loading">
      <div class="spinner"></div>
      <span>Загрузка...</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="/settings-loader.js"></script>
  <script>
    // ====== ГАРАНТИРОВАННО РАБОТАЮЩИЕ КАНАЛЫ (проверены) ======
    const defaultChannels = [
      { name: 'Звезда', url: 'https://tvchannelstream1.tvzvezda.ru/cdn/tvzvezda/playlist.m3u8' },
      // Добавьте другие каналы, если найдёте рабочие ссылки
      // { name: 'Мир', url: 'http://hls.mirtv.cdnvideo.ru/mirtv-parampublish/mirtv_2500/playlist.m3u8' } // может работать, но требует HTTPS
    ];

    const video = document.getElementById('video');
    const loading = document.getElementById('loading');
    const bar = document.getElementById('channelsBar');
    const customInput = document.getElementById('customUrlInput');
    const addBtn = document.getElementById('addCustomBtn');
    let hls = null;
    let currentIndex = 0;
    let channels = [];

    function loadChannels(list) {
      channels = list;
      renderChannels();
      if (channels.length > 0) loadChannel(0);
    }

    function renderChannels() {
      bar.innerHTML = '';
      channels.forEach((ch, i) => {
        const btn = document.createElement('button');
        btn.className = 'channel-btn' + (i === 0 ? ' active' : '');
        btn.textContent = ch.name;
        btn.addEventListener('click', () => loadChannel(i));
        bar.appendChild(btn);
      });
      // Добавляем кнопку для удаления канала (можно позже)
    }

    function loadChannel(index) {
      const channel = channels[index];
      if (!channel) return;
      currentIndex = index;

      document.querySelectorAll('.channel-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
      });

      loading.classList.remove('hidden');
      loading.innerHTML = '<div class="spinner"></div><span>Загрузка...</span>';

      if (hls) {
        hls.destroy();
        hls = null;
      }

      const url = channel.url;
      // Проверяем, поддерживается ли HLS
      if (Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
        });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
          loading.classList.add('hidden');
        });
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            loading.innerHTML = `<span class="error-msg">❌ Не удалось загрузить канал</span><span style="font-size:0.8rem;color:#8899cc;">Попробуйте другой</span>`;
            setTimeout(() => loading.classList.add('hidden'), 4000);
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', () => {
          video.play().catch(() => {});
          loading.classList.add('hidden');
        });
      } else {
        loading.innerHTML = '<span class="error-msg">❌ Ваш браузер не поддерживает HLS</span>';
        setTimeout(() => loading.classList.add('hidden'), 4000);
      }
    }

    // Добавление своего канала
    addBtn.addEventListener('click', () => {
      const url = customInput.value.trim();
      if (!url) return;
      // Попытка извлечь имя из URL
      let name = url.split('/').pop().replace(/\.[^/.]+$/, '') || 'Свой канал';
      // Ограничим длину
      if (name.length > 20) name = name.slice(0,20)+'…';
      channels.push({ name, url });
      renderChannels();
      customInput.value = '';
      // Автоматически переключаем на новый канал
      loadChannel(channels.length - 1);
    });

    // Инициализация
    loadChannels(defaultChannels);
  </script>
</body>
</html>
