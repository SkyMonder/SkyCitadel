<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>SkySocial</title>
  <style>
    :root {
      --bg: #0a0f1e; --panel: #111827; --card: #1a233a;
      --border: #2a3450; --text: #e0e8ff; --accent: #5f7ecf;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }
    .login-screen { position: absolute; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 20; }
    .login-box { background: var(--card); padding: 2rem; border-radius: 20px; border: 1px solid var(--border); width: 300px; text-align: center; }
    .login-box button { width: 100%; padding: 0.7rem; background: var(--accent); border: none; color: white; border-radius: 10px; cursor: pointer; font-weight: bold; }
    .error { color: #f48024; font-size: 0.8rem; margin-top: 0.5rem; }
    .app { display: none; width: 100%; height: 100%; flex-direction: column; }
    .header { padding: 1rem; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .content { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
    .post { background: var(--card); padding: 1rem; border-radius: 12px; border: 1px solid var(--border); }
    .post-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
    .post-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; }
    .post-author { font-weight: bold; }
    .post-text { margin-bottom: 0.5rem; }
    .post-actions { display: flex; gap: 0.5rem; font-size: 0.85rem; flex-wrap: wrap; }
    .btn { background: var(--accent); border: none; color: white; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; }
    .btn-danger { background: #c44; }
    .new-post { display: flex; gap: 0.5rem; padding: 0.5rem; background: var(--card); border-radius: 12px; }
    .new-post textarea { flex: 1; padding: 0.5rem; background: #0d1225; border: 1px solid var(--border); color: white; border-radius: 8px; resize: vertical; min-height: 60px; }
    .profile-panel { background: var(--card); padding: 1rem; border-radius: 12px; }
    .comment-section { margin-top: 0.5rem; margin-left: 1rem; border-left: 2px solid #2f3b5c; padding-left: 0.8rem; }
    .comment { margin-bottom: 0.5rem; }
    .comment-actions { display: flex; gap: 0.3rem; font-size: 0.75rem; align-items: center; }
  </style>
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-box">
      <h3>Вход через SkyID</h3>
      <button id="loginBtn">Войти через SkyID</button>
      <div class="error" id="loginError"></div>
    </div>
  </div>

  <div class="app" id="app">
    <div class="header">
      <span>👥 SkySocial</span>
      <div>
        <button class="btn" id="profileBtn">Профиль</button>
        <button class="btn" id="logoutBtn">Выход</button>
      </div>
    </div>
    <div class="content" id="content">
      <div class="new-post">
        <textarea id="postText" placeholder="Что нового?"></textarea>
        <button class="btn" id="sendPost">➤</button>
      </div>
      <div id="postsContainer"></div>
    </div>
    <div class="profile-panel" id="profilePanel" style="display:none;">
      <h3>Мой профиль</h3>
      <input type="text" id="profileName" placeholder="Имя" style="width:100%; padding:0.5rem; margin-top:0.5rem; background:#0d1225; border:1px solid var(--border); color:white; border-radius:6px;">
      <input type="text" id="profileBio" placeholder="О себе" style="width:100%; padding:0.5rem; margin-top:0.5rem; background:#0d1225; border:1px solid var(--border); color:white; border-radius:6px;">
      <button class="btn" id="saveProfile" style="width:100%; margin-top:0.5rem;">Сохранить</button>
      <button class="btn" id="closeProfile" style="width:100%; margin-top:0.3rem; background:#444;">Закрыть</button>
    </div>
  </div>

  <script>
    // ====== Конфигурация ======
    const PROXY_URL = 'https://sky-proxy.onrender.com';
    const SKYID_URL = PROXY_URL + '/skymutant';
    const SOCIAL_API = PROXY_URL + '/skymutant';
    const CLIENT_ID = 'skysocial';
    const REDIRECT_URI = 'https://skycitadel.onrender.com/callback.html';

    // ====== Глобальные переменные ======
    let token = localStorage.getItem('skysocial_token') || null;
    let currentUserSkyID = null;
    let currentLogin = null;
    let isAdmin = false;

    // ====== Функции авторизации ======
    async function verifyToken() {
      if (!token) return false;
      try {
        const res = await fetch(`${SKYID_URL}/me`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (res.ok) {
          const me = await res.json();
          currentUserSkyID = me.skyid;
          currentLogin = me.login || me.skyid;
          isAdmin = (me.login === 'SkyMonder');
          return true;
        } else {
          // Токен невалидный — удаляем и выходим
          logout();
          return false;
        }
      } catch (e) {
        logout();
        return false;
      }
    }

    function loginWithSkyID() {
      const scope = 'profile social';
      const state = encodeURIComponent(window.location.href);
      const authUrl = `${SKYID_URL}/oauth/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(scope)}&state=${state}`;
      window.location.href = authUrl;
    }

    function logout() {
      token = null;
      localStorage.removeItem('skysocial_token');
      localStorage.removeItem('skysocial_scope');
      localStorage.removeItem('skysocial_skyid');
      currentUserSkyID = null;
      currentLogin = null;
      isAdmin = false;
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
    }

    function showApp() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
    }

    // ====== Инициализация при загрузке ======
    (async () => {
      // 1. Проверяем, не вернулись ли с callback с параметром code
      const params = new URLSearchParams(window.location.search);
      if (params.get('code')) {
        // Если мы попали сюда с code, значит callback.html не сработал (редкий случай).
        // Перенаправляем на callback.html, который обработает код и сохранит токен.
        window.location.href = '/callback.html' + window.location.search;
        return;
      }

      // 2. Пытаемся использовать сохранённый токен
      if (token) {
        const valid = await verifyToken();
        if (valid) {
          showApp();
          loadPosts();
          return;
        }
      }

      // 3. Токена нет или он невалидный — показываем экран входа
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
    })();

    // ====== Обработчики кнопок ======
    document.getElementById('loginBtn').addEventListener('click', loginWithSkyID);
    document.getElementById('logoutBtn').addEventListener('click', logout);

    // ====== API-запросы с автоматической обработкой 401 ======
    async function apiFetch(url, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        ...options.headers
      };
      if (token) {
        headers['Authorization'] = `Bearer ${token}`;
      }
      const res = await fetch(url, { ...options, headers });
      if (res.status === 401) {
        // Токен истёк или невалидный — выходим
        logout();
        throw new Error('Unauthorized');
      }
      return res;
    }

    // ====== Загрузка постов ======
    async function loadPosts() {
      const container = document.getElementById('postsContainer');
      try {
        const res = await apiFetch(`${SOCIAL_API}/posts`);
        const posts = await res.json();
        container.innerHTML = posts.map(post => renderPost(post)).join('');
      } catch (e) {
        if (e.message !== 'Unauthorized') {
          container.innerHTML = '<p>Ошибка загрузки постов</p>';
        }
      }
    }

    function renderPost(post) {
      const deleteBtn = (post.skyid === currentUserSkyID || isAdmin) ?
        `<button class="btn btn-danger" onclick="deletePost('${post.id}')">Удалить</button>` : '';
      const banBtn = isAdmin ? `<button class="btn btn-danger" onclick="banUser('${post.skyid}')">🔨 Бан</button>` : '';
      return `
        <div class="post">
          <div class="post-header">
            <div class="post-avatar">👤</div>
            <div class="post-author">${escapeHtml(post.author)} ${banBtn}</div>
            <span style="margin-left:auto; font-size:0.7rem; color:#8899cc;">${new Date(post.created).toLocaleString()}</span>
          </div>
          <div class="post-text">${escapeHtml(post.text)}</div>
          <div class="post-actions">
            <button class="btn" onclick="likePost('${post.id}')">👍 ${post.likes.length}</button>
            <button class="btn" onclick="dislikePost('${post.id}')">👎 ${post.dislikes.length}</button>
            <button class="btn" onclick="toggleComments('${post.id}')">💬</button>
            ${deleteBtn}
          </div>
          <div id="comments-${post.id}" class="comment-section" style="display:none;">
            <div id="comments-list-${post.id}"></div>
            <div style="display:flex; gap:0.3rem; margin-top:0.3rem;">
              <input type="text" id="comment-input-${post.id}" placeholder="Комментарий..." style="flex:1; padding:0.3rem; background:#0d1225; border:1px solid var(--border); color:white; border-radius:4px;">
              <button class="btn" onclick="addComment('${post.id}')">➤</button>
            </div>
          </div>
        </div>`;
    }

    // ====== Отправка поста ======
    document.getElementById('sendPost').addEventListener('click', async () => {
      const text = document.getElementById('postText').value.trim();
      if (!text) return;
      try {
        await apiFetch(`${SOCIAL_API}/posts`, {
          method: 'POST',
          body: JSON.stringify({ text })
        });
        document.getElementById('postText').value = '';
        loadPosts();
      } catch (e) {
        if (e.message !== 'Unauthorized') alert('Ошибка отправки поста');
      }
    });

    // ====== Лайки / дизлайки ======
    window.likePost = async (id) => {
      try {
        await apiFetch(`${SOCIAL_API}/posts/${id}/like`, { method: 'POST' });
        loadPosts();
      } catch (e) {}
    };
    window.dislikePost = async (id) => {
      try {
        await apiFetch(`${SOCIAL_API}/posts/${id}/dislike`, { method: 'POST' });
        loadPosts();
      } catch (e) {}
    };

    // ====== Удаление поста ======
    window.deletePost = async (id) => {
      if (!confirm('Удалить пост?')) return;
      try {
        await apiFetch(`${SOCIAL_API}/posts/${id}`, { method: 'DELETE' });
        loadPosts();
      } catch (e) {}
    };

    // ====== Комментарии ======
    window.toggleComments = async (postId) => {
      const block = document.getElementById('comments-' + postId);
      if (block.style.display === 'none' || !block.style.display) {
        block.style.display = 'block';
        const list = document.getElementById('comments-list-' + postId);
        try {
          const res = await apiFetch(`${SOCIAL_API}/posts/${postId}/comments`);
          const comments = await res.json();
          list.innerHTML = comments.map(c => `
            <div class="comment">
              <strong>${escapeHtml(c.author)}</strong>: ${escapeHtml(c.text)}
              <div class="comment-actions">
                <button class="btn" onclick="likeComment('${postId}','${c.id}')">👍 ${c.likes.length}</button>
                <button class="btn" onclick="dislikeComment('${postId}','${c.id}')">👎 ${c.dislikes.length}</button>
                ${(c.skyid === currentUserSkyID || isAdmin) ? `<button class="btn btn-danger" onclick="deleteComment('${postId}','${c.id}')">×</button>` : ''}
              </div>
            </div>`).join('');
        } catch (e) {}
      } else {
        block.style.display = 'none';
      }
    };

    window.addComment = async (postId) => {
      const input = document.getElementById('comment-input-' + postId);
      const text = input.value.trim();
      if (!text) return;
      try {
        await apiFetch(`${SOCIAL_API}/posts/${postId}/comments`, {
          method: 'POST',
          body: JSON.stringify({ text })
        });
        input.value = '';
        window.toggleComments(postId);
      } catch (e) {}
    };

    window.likeComment = async (postId, commentId) => {
      try {
        await apiFetch(`${SOCIAL_API}/posts/${postId}/comments/${commentId}/like`, { method: 'POST' });
        window.toggleComments(postId);
      } catch (e) {}
    };
    window.dislikeComment = async (postId, commentId) => {
      try {
        await apiFetch(`${SOCIAL_API}/posts/${postId}/comments/${commentId}/dislike`, { method: 'POST' });
        window.toggleComments(postId);
      } catch (e) {}
    };
    window.deleteComment = async (postId, commentId) => {
      if (!confirm('Удалить комментарий?')) return;
      try {
        await apiFetch(`${SOCIAL_API}/posts/${postId}/comments/${commentId}`, { method: 'DELETE' });
        window.toggleComments(postId);
      } catch (e) {}
    };

    // ====== Бан пользователя (только админ) ======
    window.banUser = async (skyid) => {
      if (!isAdmin) return;
      if (!confirm(`Забанить пользователя ${skyid}?`)) return;
      try {
        await apiFetch(`${SOCIAL_API}/admin/ban`, {
          method: 'POST',
          body: JSON.stringify({ skyid })
        });
        alert('Пользователь забанен');
        loadPosts();
      } catch (e) {}
    };

    // ====== Профиль ======
    document.getElementById('profileBtn').addEventListener('click', async () => {
      const panel = document.getElementById('profilePanel');
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
      if (panel.style.display === 'block') {
        try {
          const res = await apiFetch(`${SOCIAL_API}/profile`);
          const profile = await res.json();
          document.getElementById('profileName').value = profile.name || '';
          document.getElementById('profileBio').value = profile.bio || '';
        } catch (e) {}
      }
    });
    document.getElementById('closeProfile').addEventListener('click', () => {
      document.getElementById('profilePanel').style.display = 'none';
    });
    document.getElementById('saveProfile').addEventListener('click', async () => {
      const name = document.getElementById('profileName').value.trim();
      const bio = document.getElementById('profileBio').value.trim();
      try {
        await apiFetch(`${SOCIAL_API}/profile`, {
          method: 'PUT',
          body: JSON.stringify({ name, bio })
        });
        alert('Профиль обновлён');
      } catch (e) {}
    });

    // ====== Вспомогательные функции ======
    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
  </script>
</body>
</html>
