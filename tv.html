<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyTV — Свободное ТВ</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0a0f1e;
      color: #e0e8ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      padding: 0.8rem 1.5rem;
      background: #111827;
      border-bottom: 1px solid #2a3450;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .header a {
      color: #5f7ecf;
      text-decoration: none;
      font-weight: 500;
    }
    .header a:hover { text-decoration: underline; }
    .header h1 {
      color: #b7ceff;
      font-size: 1.5rem;
      font-weight: 400;
    }
    .header .badge {
      background: #2a7a2a;
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      font-size: 0.7rem;
      color: #fff;
      margin-left: 0.5rem;
    }
    .channels-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      background: #0d1425;
      border-bottom: 1px solid #1e2a40;
      flex-shrink: 0;
      overflow-y: auto;
      max-height: 80px;
    }
    .channel-btn {
      background: #1a233a;
      border: 1px solid #2a3450;
      color: #cfdbff;
      padding: 0.3rem 0.9rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .channel-btn:hover {
      background: #2a3450;
      border-color: #5f7ecf;
    }
    .channel-btn.active {
      background: #5f7ecf;
      border-color: #5f7ecf;
      color: #fff;
    }
    .player {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
    }
    .player video {
      width: 100%;
      height: 100%;
      max-height: 100vh;
      background: #000;
      outline: none;
    }
    .loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.7);
      color: #8899cc;
      font-size: 1.2rem;
      pointer-events: none;
      transition: opacity 0.5s;
    }
    .loading-overlay.hidden { opacity: 0; }
    @media (max-width: 768px) {
      .header { padding: 0.5rem 1rem; }
      .header h1 { font-size: 1.2rem; }
      .channels-bar { gap: 0.3rem; padding: 0.3rem 0.5rem; max-height: 60px; }
      .channel-btn { font-size: 0.7rem; padding: 0.2rem 0.6rem; }
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="/">🏰 Назад</a>
    <h1>📺 SkyTV <span class="badge">hls.js</span></h1>
  </div>

  <div class="channels-bar" id="channelsBar"></div>

  <div class="player">
    <video id="video" controls autoplay></video>
    <div class="loading-overlay" id="loading">⏳ Загрузка...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    // ====== СПИСОК КАНАЛОВ (из открытого плейлиста iptv-org) ======
    const channels = [
      { name: 'Россия 24', url: 'https://stream-ice.cdn-tvcenter.ru/stream/rt_russia24_720/playlist.m3u8' },
      { name: 'Россия 1', url: 'https://stream-ice.cdn-tvcenter.ru/stream/rt_russia1_720/playlist.m3u8' },
      { name: 'Россия-К', url: 'https://stream-ice.cdn-tvcenter.ru/stream/rt_russia_k_720/playlist.m3u8' },
      { name: 'Первый канал', url: 'https://stream-ice.cdn-tvcenter.ru/stream/rt_1tv_720/playlist.m3u8' },
      { name: 'НТВ', url: 'https://stream-ice.cdn-tvcenter.ru/stream/rt_ntv_720/playlist.m3u8' },
      { name: 'ТНТ', url: 'https://stream-ice.cdn-tvcenter.ru/stream/rt_tnt_720/playlist.m3u8' },
      { name: 'СТС', url: 'https://stream-ice.cdn-tvcenter.ru/stream/rt_ctc_720/playlist.m3u8' },
      { name: 'РЕН ТВ', url: 'https://stream-ice.cdn-tvcenter.ru/stream/rt_ren_tv_720/playlist.m3u8' },
      { name: 'Матч ТВ', url: 'https://stream-ice.cdn-tvcenter.ru/stream/rt_match_tv_720/playlist.m3u8' },
      { name: 'Пятый канал', url: 'https://stream-ice.cdn-tvcenter.ru/stream/rt_5tv_720/playlist.m3u8' }
    ];

    const video = document.getElementById('video');
    const loading = document.getElementById('loading');
    const bar = document.getElementById('channelsBar');
    let hls = null;
    let currentChannelIndex = 0;

    function loadChannel(index) {
      const channel = channels[index];
      if (!channel) return;
      currentChannelIndex = index;

      // Обновляем кнопки
      document.querySelectorAll('.channel-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
      });

      loading.classList.remove('hidden');

      // Уничтожаем старый HLS, если есть
      if (hls) {
        hls.destroy();
        hls = null;
      }

      // Проверяем поддержку HLS
      if (Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
        });
        hls.loadSource(channel.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
          loading.classList.add('hidden');
        });
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            loading.innerHTML = '❌ Ошибка загрузки канала<br><small>Попробуйте другой</small>';
            setTimeout(() => loading.classList.add('hidden'), 4000);
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Для Safari (native HLS)
        video.src = channel.url;
        video.addEventListener('loadedmetadata', () => {
          video.play().catch(() => {});
          loading.classList.add('hidden');
        });
      } else {
        loading.innerHTML = '❌ Ваш браузер не поддерживает HLS';
        loading.classList.add('hidden');
      }
    }

    // Строим кнопки
    channels.forEach((ch, i) => {
      const btn = document.createElement('button');
      btn.className = 'channel-btn';
      btn.textContent = ch.name;
      if (i === 0) btn.classList.add('active');
      btn.addEventListener('click', () => loadChannel(i));
      bar.appendChild(btn);
    });

    // Загружаем первый канал
    loadChannel(0);
  </script>
</body>
</html>
