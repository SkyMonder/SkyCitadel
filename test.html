<!DOCTYPE html>
<html>
<head>
  <title>Диагностика регистрации</title>
</head>
<body>
  <h1>Тест регистрации</h1>
  <button onclick="testRegister()">Зарегистрировать тестового пользователя</button>
  <pre id="log"></pre>
  <script>
    async function testRegister() {
      const log = document.getElementById('log');
      log.textContent = '⏳ Отправка запроса...';
      const login = 'test' + Date.now();
      const password = '123456';
      try {
        const res = await fetch('https://skymutant.cc.cd/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login, password })
        });
        const data = await res.json();
        log.textContent = '✅ Статус: ' + res.status + '\n' + JSON.stringify(data, null, 2);
      } catch (e) {
        log.textContent = '❌ Ошибка: ' + e.message;
      }
    }
  </script>
</body>
</html>
