<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Газета SkyCitadel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #2c2c2c;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Times New Roman', Times, serif;
      padding: 16px;
    }
    .newspaper-container {
      background: #f4f0eb;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      padding: 20px;
      max-width: 720px;
      width: 100%;
      max-height: 95vh;
      display: flex;
      flex-direction: column;
    }
    .newspaper-header {
      text-align: center;
      border-bottom: 3px double #333;
      padding-bottom: 10px;
      margin-bottom: 16px;
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 4px;
      color: #1a1a1a;
      flex-shrink: 0;
    }
    .newspaper-header small {
      font-size: 0.8rem;
      display: block;
      font-weight: normal;
      letter-spacing: 2px;
      color: #555;
    }
    .page-container {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }
    .page {
      background: white;
      border-radius: 8px;
      padding: 20px 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      min-height: 320px;
      max-height: 450px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: #222;
      transition: opacity 0.3s;
    }
    .page.hidden {
      display: none;
    }
    .news-title {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 0.3rem;
      line-height: 1.2;
      color: #1a1a1a;
      flex-shrink: 0;
    }
    .news-date {
      font-size: 0.8rem;
      color: #777;
      margin-bottom: 0.8rem;
      border-bottom: 1px solid #ddd;
      padding-bottom: 0.4rem;
      flex-shrink: 0;
    }
    .news-image {
      width: 100%;
      max-height: 150px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 0.8rem;
      background: #eaeaea;
      flex-shrink: 0;
    }
    .news-text {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #222;
      overflow-y: auto;
      flex: 1;
      padding-right: 4px;
    }
    .news-text::-webkit-scrollbar {
      width: 4px;
    }
    .news-text::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 2px;
    }

    .nav-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      flex-shrink: 0;
      padding-top: 12px;
      border-top: 1px solid #ddd;
    }
    .nav-btn {
      background: #333;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .nav-btn:hover:not(:disabled) {
      background: #555;
    }
    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .page-indicator {
      font-size: 0.95rem;
      color: #555;
    }

    @media (max-width: 600px) {
      .newspaper-container { padding: 12px; }
      .newspaper-header { font-size: 1.6rem; }
      .page { padding: 16px; min-height: 260px; max-height: 360px; }
      .news-title { font-size: 1.2rem; }
      .news-text { font-size: 0.85rem; }
      .nav-btn { padding: 6px 14px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="newspaper-container">
    <div class="newspaper-header">
      📰 Ежедневная газета
      <small>Свежие новости из Интерфакса</small>
    </div>

    <div class="page-container" id="pageContainer">
      <!-- Страницы будут вставлены сюда -->
    </div>

    <div class="nav-controls">
      <button class="nav-btn" id="prevBtn" disabled>◀ Назад</button>
      <span class="page-indicator" id="pageIndicator">Страница 1 из 1</span>
      <button class="nav-btn" id="nextBtn">Вперед ▶</button>
    </div>
  </div>

  <script>
    const RSS_URL = 'https://www.interfax.ru/rss';
    const PROXY = 'https://api.allorigins.win/raw?url=';

    let articles = [];
    let currentPage = 0;

    const container = document.getElementById('pageContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const indicator = document.getElementById('pageIndicator');

    // ====== ЗАГРУЗКА ======
    async function loadNews() {
      try {
        console.log('🔄 Загрузка новостей...');
        const response = await fetch(PROXY + encodeURIComponent(RSS_URL));
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const text = await response.text();
        const parser = new DOMParser();
        const xml = parser.parseFromString(text, 'text/xml');
        const items = xml.querySelectorAll('item');
        console.log(`📰 Найдено ${items.length} новостей`);

        articles = [];
        items.forEach(item => {
          const title = item.querySelector('title')?.textContent || 'Без заголовка';
          const link = item.querySelector('link')?.textContent || '#';
          const pubDate = item.querySelector('pubDate')?.textContent;
          const description = item.querySelector('description')?.textContent || '';
          let imageUrl = null;
          const imgMatch = description.match(/<img[^>]+src="([^">]+)"/);
          if (imgMatch) imageUrl = imgMatch[1];
          const textContent = description.replace(/<[^>]+>/g, '').trim();
          articles.push({
            title,
            link,
            pubDate: pubDate ? new Date(pubDate).toLocaleDateString('ru-RU') : '',
            text: textContent || 'Подробнее по ссылке...',
            image: imageUrl || null
          });
        });

        if (articles.length === 0) {
          articles = [{
            title: 'Новости не загрузились',
            text: 'Попробуйте обновить страницу позже.',
            pubDate: '',
            image: null,
            link: '#'
          }];
        }
        renderPages();
      } catch (error) {
        console.error('❌ Ошибка загрузки RSS:', error);
        articles = [{
          title: 'Ошибка загрузки',
          text: 'Не удалось загрузить новости. Проверьте соединение.',
          pubDate: '',
          image: null,
          link: '#'
        }];
        renderPages();
      }
    }

    // ====== РЕНДЕР ======
    function renderPages() {
      container.innerHTML = '';
      articles.forEach((article, index) => {
        const pageDiv = document.createElement('div');
        pageDiv.className = 'page' + (index === 0 ? '' : ' hidden');
        pageDiv.innerHTML = `
          <div class="news-title">${escapeHtml(article.title)}</div>
          <div class="news-date">${article.pubDate || 'Сегодня'}</div>
          ${article.image ? `<img class="news-image" src="${article.image}" alt="Иллюстрация" loading="lazy">` : ''}
          <div class="news-text">${escapeHtml(article.text)}</div>
        `;
        container.appendChild(pageDiv);
      });
      currentPage = 0;
      updateUI();
    }

    function updateUI() {
      const pages = container.querySelectorAll('.page');
      pages.forEach((p, i) => {
        p.classList.toggle('hidden', i !== currentPage);
      });
      indicator.textContent = `Страница ${currentPage+1} из ${articles.length}`;
      prevBtn.disabled = (currentPage === 0);
      nextBtn.disabled = (currentPage === articles.length - 1);
    }

    function goToPage(index) {
      if (index < 0 || index >= articles.length) return;
      currentPage = index;
      updateUI();
    }

    prevBtn.addEventListener('click', () => goToPage(currentPage - 1));
    nextBtn.addEventListener('click', () => goToPage(currentPage + 1));

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]);
    }

    loadNews();
  </script>
</body>
</html>
