<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Газета SkyCitadel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #2c2c2c;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Times New Roman', Times, serif;
      padding: 16px;
    }
    .newspaper-container {
      background: #f4f0eb;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      padding: 20px;
      max-width: 720px;
      width: 100%;
      max-height: 95vh;
      display: flex;
      flex-direction: column;
    }
    .newspaper-header {
      text-align: center;
      border-bottom: 3px double #333;
      padding-bottom: 10px;
      margin-bottom: 16px;
      flex-shrink: 0;
    }
    .newspaper-header h1 {
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 4px;
      color: #1a1a1a;
    }
    .newspaper-header small {
      font-size: 0.8rem;
      display: block;
      font-weight: normal;
      letter-spacing: 2px;
      color: #555;
    }
    .newspaper-header .update-info {
      font-size: 0.75rem;
      color: #777;
      margin-top: 4px;
      letter-spacing: 0.5px;
    }
    .page-container {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
      border-radius: 8px;
    }
    .page {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: white;
      border-radius: 8px;
      padding: 20px 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: #222;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform, opacity;
    }
    .news-title {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 0.2rem;
      line-height: 1.2;
      color: #1a1a1a;
      flex-shrink: 0;
    }
    .news-date {
      font-size: 0.8rem;
      color: #777;
      margin-bottom: 0.6rem;
      border-bottom: 1px solid #ddd;
      padding-bottom: 0.4rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .source-badge {
      display: inline-block;
      font-size: 0.7rem;
      background: #eaeaea;
      color: #333;
      padding: 1px 10px;
      border-radius: 12px;
    }
    .news-image {
      width: 100%;
      max-height: 150px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 0.8rem;
      background: #eaeaea;
      flex-shrink: 0;
    }
    .news-text {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #222;
      overflow-y: auto;
      flex: 1;
      padding-right: 4px;
      min-height: 2em;
    }
    .news-text::-webkit-scrollbar {
      width: 4px;
    }
    .news-text::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 2px;
    }
    .nav-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      flex-shrink: 0;
      padding-top: 12px;
      border-top: 1px solid #ddd;
      flex-wrap: wrap;
      gap: 8px;
    }
    .nav-btn {
      background: #333;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .nav-btn:hover:not(:disabled) {
      background: #555;
    }
    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .page-indicator {
      font-size: 0.95rem;
      color: #555;
    }
    .refresh-btn {
      background: #6c8b9f;
      padding: 6px 16px;
      border-radius: 30px;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .refresh-btn:hover {
      background: #55758a;
    }
    .refresh-btn:active {
      transform: scale(0.96);
    }
    @media (max-width: 600px) {
      .newspaper-container { padding: 12px; }
      .newspaper-header h1 { font-size: 1.6rem; }
      .page { padding: 16px; }
      .news-title { font-size: 1.2rem; }
      .news-text { font-size: 0.85rem; }
      .nav-btn { padding: 6px 14px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="newspaper-container">
    <div class="newspaper-header">
      <h1>📰 Ежедневная газета</h1>
      <small>Новости со всего мира — агрегатор</small>
      <div class="update-info" id="updateInfo">Загрузка...</div>
    </div>

    <div class="page-container" id="pageContainer">
      <div style="display:flex; align-items:center; justify-content:center; height:100%; color:#555; font-size:1.2rem;">
        Загрузка новостей...
      </div>
    </div>

    <div class="nav-controls">
      <button class="nav-btn" id="prevBtn" disabled>◀ Назад</button>
      <span class="page-indicator" id="pageIndicator">Страница 0 из 0</span>
      <div style="display: flex; gap: 8px;">
        <button class="refresh-btn" id="refreshBtn">⟳ Обновить</button>
        <button class="nav-btn" id="nextBtn" disabled>Вперед ▶</button>
      </div>
    </div>
  </div>

  <script>
    // ====== ИСТОЧНИКИ ======
    const SOURCES = [
      { name: 'Интерфакс', url: 'https://www.interfax.ru/rss' },
      { name: 'РИА Новости', url: 'https://ria.ru/export/rss2/index.xml' },
      { name: 'ТАСС', url: 'https://tass.ru/rss/v2.xml' },
      { name: 'Lenta.ru', url: 'https://lenta.ru/rss' }
    ];

    const RSS2JSON_API = 'https://api.rss2json.com/v1/api.json?rss_url=';

    let articles = [];
    let currentPage = 0;
    let isAnimating = false;

    const container = document.getElementById('pageContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const indicator = document.getElementById('pageIndicator');
    const updateInfo = document.getElementById('updateInfo');
    const refreshBtn = document.getElementById('refreshBtn');

    // ====== ЗАГРУЗКА RSS ======
    async function fetchRSS(source) {
      try {
        const url = RSS2JSON_API + encodeURIComponent(source.url);
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (data.status !== 'ok') throw new Error('RSS2JSON error');

        console.log(`📰 ${source.name}: загружено ${data.items.length} новостей`);

        return data.items.map(item => {
          // Пробуем получить текст из разных полей
          let text = '';
          if (item.description) {
            text = item.description.replace(/<[^>]+>/g, '').trim();
          }
          if (!text && item.content) {
            text = item.content.replace(/<[^>]+>/g, '').trim();
          }
          if (!text && item.summary) {
            text = item.summary.replace(/<[^>]+>/g, '').trim();
          }
          if (!text) {
            text = 'Подробнее по ссылке...';
          }
          // Если текст слишком длинный, обрезаем
          if (text.length > 500) text = text.slice(0, 500) + '...';

          return {
            title: item.title || 'Без заголовка',
            link: item.link || '#',
            pubDate: item.pubDate ? new Date(item.pubDate).toLocaleDateString('ru-RU') : '',
            text: text,
            image: item.enclosure?.link || null,
            source: source.name
          };
        });
      } catch (e) {
        console.warn(`⚠️ ${source.name} не загружен:`, e.message);
        return [];
      }
    }

    // ====== ЗАГРУЗКА ВСЕХ ======
    async function loadAllNews() {
      container.innerHTML = '<div style="display:flex; align-items:center; justify-content:center; height:100%; color:#555; font-size:1.2rem;">Обновление...</div>';

      const results = await Promise.allSettled(SOURCES.map(fetchRSS));
      let all = [];
      for (const r of results) {
        if (r.status === 'fulfilled') all = all.concat(r.value);
      }

      console.log(`📰 Всего новостей: ${all.length}`);

      if (all.length === 0) {
        all = [
          {
            title: 'Новости временно недоступны',
            text: 'Не удалось загрузить новости. Попробуйте позже.',
            pubDate: new Date().toLocaleDateString('ru-RU'),
            source: 'Система',
            image: null
          },
          {
            title: 'SkyCitadel — цифровая крепость',
            text: 'Открытая экосистема без цензуры, слежки и рекламы. Присоединяйтесь!',
            pubDate: new Date().toLocaleDateString('ru-RU'),
            source: 'Система',
            image: null
          }
        ];
      } else {
        all.sort((a, b) => {
          const da = a.pubDate ? new Date(a.pubDate).getTime() : 0;
          const db = b.pubDate ? new Date(b.pubDate).getTime() : 0;
          return db - da;
        });
        if (all.length > 12) all = all.slice(0, 12);
      }

      articles = all;
      currentPage = 0;
      renderPages();
      updateTimestamp();
    }

    // ====== РЕНДЕР СТРАНИЦ ======
    function renderPages() {
      container.innerHTML = '';
      articles.forEach((article, idx) => {
        const div = document.createElement('div');
        div.className = 'page';
        div.style.transform = idx === 0 ? 'translateX(0)' : 'translateX(100%)';
        div.style.opacity = idx === 0 ? '1' : '0';
        div.dataset.index = idx;
        div.innerHTML = `
          <div class="news-title">${escapeHtml(article.title)}</div>
          <div class="news-date">
            <span>${article.pubDate || 'Сегодня'}</span>
            <span class="source-badge">${escapeHtml(article.source)}</span>
          </div>
          ${article.image ? `<img class="news-image" src="${article.image}" alt="Иллюстрация" loading="lazy" onerror="this.style.display='none'">` : ''}
          <div class="news-text">${escapeHtml(article.text)}</div>
        `;
        container.appendChild(div);
      });
      updateUI();
    }

    function updateUI() {
      const pages = container.querySelectorAll('.page');
      pages.forEach((p, i) => {
        p.style.transform = i === currentPage ? 'translateX(0)' : 'translateX(100%)';
        p.style.opacity = i === currentPage ? '1' : '0';
        p.style.pointerEvents = i === currentPage ? 'auto' : 'none';
      });
      const total = articles.length;
      indicator.textContent = total ? `Страница ${currentPage+1} из ${total}` : 'Нет новостей';
      prevBtn.disabled = currentPage === 0 || total === 0;
      nextBtn.disabled = currentPage === total - 1 || total === 0;
    }

    // ====== ПЕРЕЛИСТЫВАНИЕ ======
    function goToPage(index) {
      if (isAnimating) return;
      if (index < 0 || index >= articles.length || index === currentPage) return;
      isAnimating = true;

      const pages = container.querySelectorAll('.page');
      const old = pages[currentPage];
      const next = pages[index];
      const forward = index > currentPage;

      next.style.transition = 'none';
      next.style.transform = forward ? 'translateX(100%)' : 'translateX(-100%)';
      next.style.opacity = '0';
      next.style.pointerEvents = 'none';
      void next.offsetHeight;

      old.style.transition = 'transform 0.5s, opacity 0.5s';
      old.style.transform = forward ? 'translateX(-100%)' : 'translateX(100%)';
      old.style.opacity = '0';

      next.style.transition = 'transform 0.5s, opacity 0.5s';
      next.style.transform = 'translateX(0)';
      next.style.opacity = '1';
      next.style.pointerEvents = 'auto';

      setTimeout(() => {
        old.style.transition = 'none';
        old.style.transform = 'translateX(100%)';
        old.style.opacity = '0';
        next.style.transition = 'none';
        currentPage = index;
        updateUI();
        isAnimating = false;
      }, 500);
    }

    function updateTimestamp() {
      const now = new Date();
      const str = now.toLocaleString('ru-RU', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      updateInfo.textContent = `Последнее обновление: ${str}`;
    }

    // ====== ОБРАБОТЧИКИ КНОПОК ======
    prevBtn.addEventListener('click', () => goToPage(currentPage - 1));
    nextBtn.addEventListener('click', () => goToPage(currentPage + 1));
    refreshBtn.addEventListener('click', loadAllNews);

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/[&<>"']/g, m => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[m]);
    }

    // ====== СТАРТ И АВТООБНОВЛЕНИЕ ======
    loadAllNews();
    setInterval(loadAllNews, 3600000);
  </script>
</body>
</html>
