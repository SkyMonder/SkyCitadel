<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyMusic — Яндекс.Музыка</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0a0f1e;
      color: #e0e8ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      padding: 0.8rem 1.5rem;
      background: #111827;
      border-bottom: 1px solid #2a3450;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .header a { color: #5f7ecf; text-decoration: none; font-weight: 500; }
    .header a:hover { text-decoration: underline; }
    .header h1 { color: #b7ceff; font-size: 1.5rem; font-weight: 400; }
    .header .badge { background: #2a7a2a; padding: 0.2rem 0.8rem; border-radius: 20px; font-size: 0.7rem; color: #fff; margin-left: 0.5rem; }
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: #0d1425;
      border-bottom: 1px solid #1e2a40;
      flex-shrink: 0;
      align-items: center;
    }
    .preset-btn {
      background: #1a233a;
      border: 1px solid #2a3450;
      color: #cfdbff;
      padding: 0.3rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .preset-btn:hover { background: #2a3450; border-color: #5f7ecf; }
    .preset-btn.active { background: #5f7ecf; border-color: #5f7ecf; color: #fff; }
    .custom-url {
      display: flex;
      gap: 0.3rem;
      margin-left: auto;
      flex-wrap: wrap;
      align-items: center;
    }
    .custom-url input {
      padding: 0.3rem 0.6rem;
      background: #0d1225;
      border: 1px solid #2a3450;
      color: #e0e8ff;
      border-radius: 16px;
      font-size: 0.8rem;
      min-width: 200px;
    }
    .custom-url button {
      background: #5f7ecf;
      border: none;
      color: #fff;
      padding: 0.2rem 0.8rem;
      border-radius: 16px;
      cursor: pointer;
    }
    .custom-url button:hover { background: #7a9aef; }
    .player {
      flex: 1;
      background: #111827;
      padding: 1rem;
    }
    .player iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 12px;
      background: #0a0f1e;
    }
    .height-control {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: #8899cc;
      margin-left: 0.5rem;
    }
    .height-control input[type="range"] {
      width: 80px;
      accent-color: #5f7ecf;
    }
    @media (max-width: 768px) {
      .header { padding: 0.5rem 1rem; }
      .header h1 { font-size: 1.2rem; }
      .custom-url input { min-width: 120px; }
      .presets { gap: 0.3rem; padding: 0.3rem 0.5rem; }
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="/">🏰 Назад</a>
    <h1>🎵 SkyMusic <span class="badge">Яндекс.Музыка</span></h1>
  </div>

  <div class="presets">
    <span style="color:#8899cc;font-size:0.8rem;">🎶 Быстрый старт:</span>
    <button class="preset-btn active" data-src="https://music.yandex.ru/iframe/#track/71263/419460">🎵 Трек</button>
    <button class="preset-btn" data-src="https://music.yandex.ru/iframe/#album/496406">💿 Альбом</button>
    <button class="preset-btn" data-src="https://music.yandex.ru/iframe/#playlist/10773311">📋 Плейлист</button>
    <div class="custom-url">
      <input type="text" id="customInput" placeholder="Ссылка Яндекс.Музыки...">
      <button id="loadCustomBtn">➤</button>
    </div>
    <div class="height-control">
      <span>Высота:</span>
      <input type="range" id="heightSlider" min="80" max="600" value="350">
      <span id="heightLabel">350px</span>
    </div>
  </div>

  <div class="player" id="player">
    <iframe id="musicFrame" src="https://music.yandex.ru/iframe/#track/71263/419460" allow="encrypted-media"></iframe>
  </div>

  <script>
    const frame = document.getElementById('musicFrame');
    const customInput = document.getElementById('customInput');
    const loadCustomBtn = document.getElementById('loadCustomBtn');
    const heightSlider = document.getElementById('heightSlider');
    const heightLabel = document.getElementById('heightLabel');

    function loadMusic(src) {
      frame.src = src;
      document.querySelectorAll('.preset-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.src === src);
      });
    }

    // Кнопки-пресеты
    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const src = btn.dataset.src;
        if (src) loadMusic(src);
      });
    });

    // Своя ссылка
    loadCustomBtn.addEventListener('click', () => {
      const val = customInput.value.trim();
      if (!val) return;
      // Если пользователь вставил полный iframe, пытаемся извлечь src
      let src = val;
      const srcMatch = val.match(/src=["']([^"']+)["']/);
      if (srcMatch) src = srcMatch[1];
      loadMusic(src);
      customInput.value = '';
    });

    customInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loadCustomBtn.click();
    });

    // Управление высотой
    heightSlider.addEventListener('input', () => {
      const h = heightSlider.value;
      heightLabel.textContent = h + 'px';
      frame.style.height = h + 'px';
    });

    // Загрузка первого пресета при старте
    const defaultPreset = document.querySelector('.preset-btn.active');
    if (defaultPreset) {
      loadMusic(defaultPreset.dataset.src);
    }
  </script>
</body>
</html>
