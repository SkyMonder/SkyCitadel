<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>SkyMessage</title>
  <style>
    :root {
      --bg: #0a0f1e; --panel: #111827; --card: #1a233a;
      --border: #2a3450; --text: #e0e8ff; --accent: #5f7ecf;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }
    .auth-screen { position: absolute; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 20; }
    .auth-box { background: var(--card); padding: 2rem; border-radius: 20px; border: 1px solid var(--border); width: 320px; text-align: center; }
    .auth-box input { width: 100%; padding: 0.7rem; margin: 0.5rem 0; background: #0d1225; border: 1px solid var(--border); color: white; border-radius: 10px; }
    .auth-box button { width: 100%; padding: 0.7rem; background: var(--accent); border: none; color: white; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 0.5rem; }
    .switch-link { color: #7f8bb3; font-size: 0.8rem; cursor: pointer; margin-top: 0.8rem; }
    .app { display: flex; width: 100%; height: 100%; }
    .sidebar { width: 300px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 1rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.5rem; }
    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item { padding: 0.8rem 1rem; display: flex; align-items: center; gap: 0.7rem; border-bottom: 1px solid #1e2a40; cursor: pointer; position: relative; }
    .chat-item:hover, .chat-item.active { background: #1f2b4a; }
    .chat-avatar { width: 40px; height: 40px; border-radius: 50%; background: #2f3b5c; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; }
    .chat-info { flex: 1; }
    .chat-name { font-weight: 500; }
    .chat-last { font-size: 0.8rem; color: #8899cc; }
    .chat-actions { display: none; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 0.3rem; z-index: 5; }
    .chat-item:hover .chat-actions { display: flex; gap: 0.3rem; }
    .main-area { flex: 1; display: flex; flex-direction: column; }
    .chat-header { padding: 0.8rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.8rem; background: var(--card); }
    .messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .msg { max-width: 70%; padding: 0.7rem 1rem; border-radius: 16px; background: #1f2b4a; align-self: flex-start; position: relative; }
    .msg.own { align-self: flex-end; background: var(--accent); }
    .msg .time { font-size: 0.7rem; color: #ccc; margin-top: 0.2rem; text-align: right; }
    .msg img, .msg video { max-width: 200px; border-radius: 8px; margin: 0.3rem 0; }
    .msg-actions { display: none; position: absolute; right: 5px; top: 5px; background: var(--card); border-radius: 6px; padding: 2px; }
    .msg:hover .msg-actions { display: flex; gap: 0.2rem; }
    .input-area { padding: 1rem; border-top: 1px solid var(--border); display: flex; gap: 0.5rem; background: var(--card); align-items: center; }
    .input-area input { flex: 1; padding: 0.7rem; background: #0d1225; border: 1px solid var(--border); color: white; border-radius: 10px; }
    .btn { background: var(--accent); border: none; color: white; padding: 0.4rem 0.8rem; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
    .btn-danger { background: #c44; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 50; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--card); border-radius: 16px; padding: 1.5rem; width: 320px; border: 1px solid var(--border); }
    .modal input { width: 100%; padding: 0.7rem; margin: 0.5rem 0; background: #0d1225; border: 1px solid var(--border); color: white; border-radius: 10px; }
    .modal .btn-row { display: flex; gap: 0.5rem; justify-content: center; margin-top: 1rem; }
    .search-results { max-height: 200px; overflow-y: auto; margin: 0.5rem 0; }
    .search-result-item { padding: 0.5rem; cursor: pointer; border-radius: 8px; }
    .search-result-item:hover { background: #1f2b4a; }
    .call-ui { position: fixed; bottom: 20px; right: 20px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1rem; display: none; z-index: 30; flex-direction: column; gap: 0.8rem; }
    .call-ui.active { display: flex; }
    video { width: 200px; border-radius: 8px; background: #000; }
    .profile-panel { background: var(--card); padding: 1rem; border-radius: 12px; margin-top: 1rem; }
    .emoji-panel { display: none; flex-wrap: wrap; gap: 0.3rem; padding: 0.5rem; background: var(--card); border: 1px solid var(--border); border-radius: 10px; max-width: 280px; position: absolute; bottom: 60px; left: 10px; z-index: 40; }
    .emoji-panel span { cursor: pointer; font-size: 1.4rem; }
  </style>
</head>
<body>
  <div id="authScreen" class="auth-screen">
    <div class="auth-box">
      <h2 id="authTitle">Вход</h2>
      <input type="text" id="loginInput" placeholder="Логин" autocomplete="off">
      <input type="password" id="passInput" placeholder="Пароль">
      <button id="authBtn">Войти</button>
      <div class="switch-link" id="switchAuth">Нет аккаунта? Зарегистрироваться</div>
    </div>
  </div>

  <div class="app" id="app" style="display:none;">
    <div class="sidebar">
      <div class="sidebar-header">
        <span>✉️ SkyMessage</span>
        <button class="btn" id="newChatBtn">+</button>
        <button class="btn" id="findGroupsBtn">🔍</button>
        <button class="btn" id="profileBtn">👤</button>
      </div>
      <div class="chat-list" id="chatList"></div>
    </div>
    <div class="main-area">
      <div class="chat-header" id="chatHeader">Выберите чат</div>
      <div class="messages" id="messagesContainer"></div>
      <div class="input-area" id="inputArea" style="display:none; position: relative;">
        <button class="btn" id="attachBtn">📎</button>
        <input type="file" id="fileInput" style="display:none;" multiple>
        <button class="btn" id="emojiBtn">😀</button>
        <div class="emoji-panel" id="emojiPanel"></div>
        <input type="text" id="messageInput" placeholder="Сообщение...">
        <button class="btn" id="sendBtn">➤</button>
        <button class="btn" id="audioCallBtn" title="Аудиозвонок">📞</button>
        <button class="btn" id="videoCallBtn" title="Видеозвонок">📹</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="searchModal">
    <div class="modal">
      <h3>Поиск пользователя</h3>
      <input type="text" id="searchQuery" placeholder="Введите логин...">
      <div class="search-results" id="searchResults"></div>
      <div class="btn-row">
        <button class="btn" id="modalCancel" style="background:#444;">Отмена</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="groupsModal">
    <div class="modal">
      <h3>Поиск групп и каналов</h3>
      <input type="text" id="groupSearchQuery" placeholder="Название...">
      <div class="search-results" id="groupSearchResults"></div>
      <div class="btn-row">
        <button class="btn" id="groupsModalCancel" style="background:#444;">Закрыть</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="callModal">
    <div class="modal">
      <h3 id="callModalTitle">Вызов</h3>
      <p id="callModalName"></p>
      <p id="callModalStatus" style="color:#8899cc;"></p>
      <div class="btn-row" id="callModalActions">
        <button class="btn" id="callModalAcceptBtn" style="display:none;">Принять</button>
        <button class="btn" id="callModalRejectBtn" style="background:#c44;">Отклонить</button>
      </div>
    </div>
  </div>

  <div class="call-ui" id="currentCallUI">
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
    <div id="callStatus" style="font-size:0.9rem; color:#8899cc;"></div>
    <div style="display:flex; gap:0.5rem;">
      <button class="btn" id="toggleMic">🎤 Mic</button>
      <button class="btn" id="toggleCam">📷 Cam</button>
      <button class="btn" id="endCallBtn" style="background:#c44;">Завершить</button>
    </div>
  </div>

  <script>
    // ====== КОНФИГУРАЦИЯ ======
    const SERVER_URL = 'https://skymutant.onrender.com'; // ← ЗАМЕНИ НА СВОЙ RENDER URL
    const WS_URL = 'wss://skymutant.onrender.com';
    const ICE_SERVERS = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' }
      ]
    };

    // ====== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ======
    let ws, currentUser = null, cryptoKey = null, chats = {}, activeChatId = null;
    let localStream = null, peerConnection = null, activeCall = null;
    let uploadToken = null;
    let editingMessageId = null; // ID редактируемого сообщения

    // ====== ШИФРОВАНИЕ ======
    const enc = new TextEncoder(); const dec = new TextDecoder();
    async function deriveKey(password, saltBase64) {
      const salt = Uint8Array.from(atob(saltBase64), c => c.charCodeAt(0));
      const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' }, keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    }

    // ====== WEBSOCKET ======
    function connectWebSocket() {
      ws = new WebSocket(WS_URL);
      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'auth', login: currentUser.login }));
        sendServerMessage('get_chats', {});
      };
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        switch (msg.type) {
          case 'auth_ok': currentUser = { ...currentUser, ...msg }; break;
          case 'message': handleIncomingMessage(msg); break;
          case 'message_edited': handleMessageEdited(msg); break;
          case 'message_deleted': handleMessageDeleted(msg); break;
          case 'chat_list':
            chats = msg.chats;
            renderChatList();
            if (!activeChatId || !chats[activeChatId]) {
              const firstId = Object.keys(chats)[0];
              if (firstId) { activeChatId = firstId; openChat(firstId); }
            }
            break;
          case 'chat_created': activeChatId = msg.chatId; sendServerMessage('get_chats', {}); break;
          case 'messages': displayMessages(msg.messages); break;
          case 'user_search_result': showSearchResults(msg.users, 'user'); break;
          case 'call_offer': handleCallOffer(msg); break;
          case 'call_answer': handleCallAnswer(msg); break;
          case 'ice_candidate': handleICECandidate(msg); break;
          case 'search_user': {
            const query = (msg.query || '').toLowerCase();
            const allLogins = dbList('chat_users'); // массив логинов (имена файлов без .json)
              console.log(`[search_user] query="${query}", total users in DB: ${allLogins.length}`);
            const results = allLogins
              .filter(login => login !== currentUser && login.toLowerCase().includes(query))
              .map(login => ({ login }));
            ws.send(JSON.stringify({ type: 'user_search_result', users: results }));
            break;
          }
          case 'call_end': handleCallEnded(); break;
          case 'profile_updated': updateLocalProfile(msg.profile); break;
        }
      };
      ws.onclose = () => setTimeout(connectWebSocket, 3000);
    }

    function sendServerMessage(type, data = {}) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type, ...data }));
    }

    // ====== UI ======
    function showAuth(s) { document.getElementById('authScreen').style.display = s?'flex':'none'; }
    function showApp(s) { document.getElementById('app').style.display = s?'flex':'none'; }

    // ====== АВТОРИЗАЦИЯ ======
    document.getElementById('switchAuth').addEventListener('click', function() {
      const t = document.getElementById('authTitle'), b = document.getElementById('authBtn');
      if (t.textContent === 'Вход') { t.textContent='Регистрация'; b.textContent='Создать аккаунт'; this.textContent='Уже есть аккаунт? Войти'; }
      else { t.textContent='Вход'; b.textContent='Войти'; this.textContent='Нет аккаунта? Зарегистрироваться'; }
    });

    document.getElementById('authBtn').addEventListener('click', async () => {
      const login = document.getElementById('loginInput').value.trim();
      const password = document.getElementById('passInput').value;
      if (!login || !password) return alert('Заполни поля');
      const isReg = document.getElementById('authTitle').textContent === 'Регистрация';
      try {
        if (isReg) {
          const salt = window.crypto.getRandomValues(new Uint8Array(16));
          const saltB64 = btoa(String.fromCharCode(...salt));
          cryptoKey = await deriveKey(password, saltB64);
          const res = await fetch(`${SERVER_URL}/chat/register`, {
            method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ login, salt: saltB64 })
          });
          if (!res.ok) { alert('Ошибка регистрации'); return; }
          alert('Аккаунт создан! Войдите.');
          document.getElementById('authTitle').textContent='Вход'; document.getElementById('authBtn').textContent='Войти';
        } else {
          const res = await fetch(`${SERVER_URL}/chat/login_salt?login=${encodeURIComponent(login)}`);
          if (!res.ok) { alert('Пользователь не найден'); return; }
          const { salt: saltB64 } = await res.json();
          cryptoKey = await deriveKey(password, saltB64);
          currentUser = { login };
          showAuth(false); showApp(true); connectWebSocket();
        }
      } catch(e) { alert('Ошибка: '+e.message); }
    });

    // ====== СПИСОК ЧАТОВ ======
    function renderChatList() {
      const container = document.getElementById('chatList');
      container.innerHTML = '';
      Object.entries(chats).forEach(([id, chat]) => {
        const div = document.createElement('div');
        div.className = 'chat-item' + (id === activeChatId ? ' active' : '');
        div.innerHTML = `
          <div class="chat-avatar">${chat.type==='group'?'👥':chat.type==='channel'?'📢':'👤'}</div>
          <div class="chat-info">
            <div class="chat-name">${escapeHtml(chat.name)}${chat.blocked ? ' (заблокирован)' : ''}</div>
            <div class="chat-last">${chat.lastMsg || ''}</div>
          </div>
          <div class="chat-actions">
            ${chat.type !== 'private' ? `<button class="btn btn-sm leave-btn" data-id="${id}">🚪</button>` : ''}
            <button class="btn btn-sm delete-btn" data-id="${id}">🗑️</button>
            ${chat.blocked ? `<button class="btn btn-sm unblock-btn" data-id="${id}">🔓</button>` : `<button class="btn btn-sm block-btn" data-id="${id}">🚫</button>`}
          </div>`;
        div.addEventListener('click', (e) => {
          if (e.target.closest('.chat-actions')) return;
          activeChatId = id; openChat(id); renderChatList();
        });
        container.appendChild(div);
      });
      // Обработчики кнопок
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', (e) => { e.stopPropagation(); if(confirm('Удалить чат?')) sendServerMessage('delete_chat', { chatId: btn.dataset.id }); });
      });
      document.querySelectorAll('.block-btn').forEach(btn => {
        btn.addEventListener('click', (e) => { e.stopPropagation(); sendServerMessage('block_chat', { chatId: btn.dataset.id }); });
      });
      document.querySelectorAll('.unblock-btn').forEach(btn => {
        btn.addEventListener('click', (e) => { e.stopPropagation(); sendServerMessage('unblock_chat', { chatId: btn.dataset.id }); });
      });
      document.querySelectorAll('.leave-btn').forEach(btn => {
        btn.addEventListener('click', (e) => { e.stopPropagation(); if(confirm('Покинуть группу/канал?')) sendServerMessage('leave_group', { chatId: btn.dataset.id }); });
      });
    }

    function openChat(id) {
      document.getElementById('inputArea').style.display = 'flex';
      document.getElementById('chatHeader').textContent = chats[id]?.name || '';
      sendServerMessage('get_messages', { chatId: id });
    }

    // ====== СООБЩЕНИЯ ======
    function displayMessages(msgs) {
      const cont = document.getElementById('messagesContainer'); cont.innerHTML = '';
      msgs.forEach(m => addMessageToUI(m));
      cont.scrollTop = cont.scrollHeight;
    }

    function addMessageToUI(msg) {
      const div = document.createElement('div');
      div.className = 'msg' + (msg.from === currentUser.login ? ' own' : '');
      div.setAttribute('data-id', msg.id);  // <-- важно для edit/delete
      let content = `<strong>${escapeHtml(msg.from)}</strong>: `;
      if (msg.text) content += escapeHtml(msg.text);
      if (msg.file) { /* ... */ }
      if (msg.edited) content += ' <span style="font-size:0.7rem; color:#aaa;">(изменено)</span>';
      content += `<div class="time">${new Date(msg.time).toLocaleTimeString()}</div>`;
      if (msg.from === currentUser.login) {
        content += `<div class="msg-actions">
          <button class="btn btn-sm" onclick="editMessage('${msg.id}')">✏️</button>
          <button class="btn btn-sm btn-danger" onclick="deleteMessage('${msg.id}')">🗑️</button>
        </div>`;
      }
      div.innerHTML = content;
      document.getElementById('messagesContainer').appendChild(div);
    }

    function handleIncomingMessage(msg) {
      if (msg.from === currentUser.login) return; // свои сообщения уже добавлены оптимистично
      if (!chats[msg.chatId]) { sendServerMessage('get_chats', {}); return; }
      if (!chats[msg.chatId].messages) chats[msg.chatId].messages = [];
  // Проверяем, нет ли уже такого сообщения (избегаем дублей)
      if (!chats[msg.chatId].messages.find(m => m.id === msg.id)) {
        chats[msg.chatId].messages.push(msg);
        if (activeChatId === msg.chatId) {
          addMessageToUI(msg);
          document.getElementById('messagesContainer').scrollTop = document.getElementById('messagesContainer').scrollHeight;
      }
      }
      renderChatList();
    }

    function handleMessageEdited(msg) {
      const chat = chats[msg.chatId];
      if (!chat || !chat.messages) return;
      const found = chat.messages.find(m => m.id === msg.messageId);
      if (found) { found.text = msg.newText; found.edited = true; }
      if (activeChatId === msg.chatId) {
        const msgDiv = document.querySelector(`.msg[data-id="${msg.messageId}"]`);
        if (msgDiv) {
      // Обновляем только текстовое содержимое, не трогая кнопки
          const textSpan = msgDiv.querySelector('.msg-text');
          if (textSpan) {
          textSpan.textContent = msg.newText;
           } else {
            // fallback: заменяем содержимое
            const originalHtml = msgDiv.innerHTML;
            const parts = originalHtml.split(/(?=<\/strong>:)/);
            if (parts.length > 1) {
              msgDiv.innerHTML = parts[0] + escapeHtml(msg.newText) + parts[1].replace(/.*?(?=<div class="time")/s, '');
            }
          }
        if (!msgDiv.querySelector('.edited-mark')) {
            const mark = document.createElement('span');
            mark.className = 'edited-mark';
            mark.style.cssText = 'font-size:0.7rem; color:#aaa;';
            mark.textContent = ' (изменено)';
            msgDiv.appendChild(mark);
          }
        } else {
          // если не нашли, перезагружаем чат
          sendServerMessage('get_messages', { chatId: msg.chatId });
        }
      }
    }

    function handleMessageDeleted(msg) {
      const chat = chats[msg.chatId];
      if (!chat || !chat.messages) return;
      chat.messages = chat.messages.filter(m => m.id !== msg.messageId);
      if (activeChatId === msg.chatId) {
        const msgDiv = document.querySelector(`.msg[data-id="${msg.messageId}"]`);
        if (msgDiv) msgDiv.remove();
      }
    }

    window.editMessage = (id) => {
      // Находим текст сообщения в кэше и подставляем в поле ввода
      const chat = chats[activeChatId];
      if (!chat || !chat.messages) return;
      const msg = chat.messages.find(m => m.id === id);
      if (!msg || msg.from !== currentUser.login) return;
      document.getElementById('messageInput').value = msg.text;
      editingMessageId = id;
      document.getElementById('sendBtn').textContent = '✏️';
    };

    window.deleteMessage = (id) => {
      if (!confirm('Удалить сообщение?')) return;
      sendServerMessage('delete_message', { chatId: activeChatId, messageId: id });
    };

    document.getElementById('sendBtn').addEventListener('click', () => {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !activeChatId) return;

      // Создаём локальное сообщение
      const msg = {
        id: 'msg_' + Date.now(),
        from: currentUser.login,
        text: text,
        time: Date.now()
      };

  // Добавляем в кэш чата
      if (!chats[activeChatId]) chats[activeChatId] = { messages: [] };
      if (!chats[activeChatId].messages) chats[activeChatId].messages = [];
      chats[activeChatId].messages.push(msg);

      // Отображаем сразу (оптимистичная вставка)
      addMessageToUI(msg);
      document.getElementById('messagesContainer').scrollTop = document.getElementById('messagesContainer').scrollHeight;

  // Отправляем на сервер (получатель получит через WS)
      sendServerMessage('send_message', { chatId: activeChatId, text });

      input.value = '';
    });

    // ====== ЭМОДЗИ ======
    const emojis = '😀😃😄😁😆😅😂🤣😊😇🙂😉😌😍🥰😘😗😙😚😋😛😝😜🤪🤨🧐🤓😎🤩🥳😏😒😞😔😟😕🙁☹️😣😖😫😩🥺😢😭😤😠😡🤬🤯😳🥵🥶😱😨😰😥😓🤗🤔🤭🤫🤥😶😐😑😬🙄😯😦😧😮😲🥱😴🤤😪😵🤐🤢🤮🤧😷🤒🤕🤑🤠😈👿👹👺🤡💩👻💀☠️👽👾🤖🎃😺😸😹😻😼😽🙀😿😾'.split('');
    const emojiPanel = document.getElementById('emojiPanel');
    emojis.forEach(e => {
      const span = document.createElement('span');
      span.textContent = e;
      span.addEventListener('click', () => {
        document.getElementById('messageInput').value += e;
        emojiPanel.style.display = 'none';
      });
      emojiPanel.appendChild(span);
    });
    document.getElementById('emojiBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      emojiPanel.style.display = emojiPanel.style.display === 'flex' ? 'none' : 'flex';
    });
    document.addEventListener('click', () => { emojiPanel.style.display = 'none'; });

    // ====== ФАЙЛЫ ======
    document.getElementById('attachBtn').addEventListener('click', async () => {
      if (!uploadToken) { const res = await fetch(`${SERVER_URL}/get_upload_token`); const data = await res.json(); uploadToken = data.token; }
      document.getElementById('fileInput').click();
    });
    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;
      for (const file of files) {
        const formData = new FormData(); formData.append('file', file);
        const xhr = new XMLHttpRequest();
        xhr.open('POST', `${SERVER_URL}/upload_file`);
        xhr.setRequestHeader('x-upload-token', uploadToken);
        xhr.send(formData);
        xhr.onload = () => {
          const response = JSON.parse(xhr.responseText);
          sendServerMessage('file_message', {
            chatId: activeChatId,
            text: '',
            file: { name: response.name, size: response.size, type: response.type, url: `${SERVER_URL}${response.url}` }
          });
        };
      }
      e.target.value = '';
    });

    // ====== ПОИСК ПОЛЬЗОВАТЕЛЕЙ ======
    document.getElementById('newChatBtn').addEventListener('click', () => {
      const action = prompt('1 - Личный чат\n2 - Создать группу\n3 - Создать канал');
      if (action === '1') openSearchModal('user');
      else if (action === '2') { const n = prompt('Название группы:'); if(n) sendServerMessage('create_group', { name: n }); }
      else if (action === '3') { const n = prompt('Название канала:'); if(n) sendServerMessage('create_channel', { name: n }); }
    });
    document.getElementById('findGroupsBtn').addEventListener('click', () => openSearchModal('group'));

    function openSearchModal(type) {
      if (type === 'user') {
        document.getElementById('searchModal').classList.add('active');
        document.getElementById('searchQuery').value = ''; document.getElementById('searchResults').innerHTML = '';
      } else {
        document.getElementById('groupsModal').classList.add('active');
        document.getElementById('groupSearchQuery').value = ''; document.getElementById('groupSearchResults').innerHTML = '';
      }
    }
    document.getElementById('modalCancel').addEventListener('click', () => document.getElementById('searchModal').classList.remove('active'));
    document.getElementById('groupsModalCancel').addEventListener('click', () => document.getElementById('groupsModal').classList.remove('active'));

    document.getElementById('searchQuery').addEventListener('input', () => {
      const q = document.getElementById('searchQuery').value.trim();
      if (!q) { document.getElementById('searchResults').innerHTML = ''; return; }
      sendServerMessage('search_user', { query: q });
    });
    document.getElementById('groupSearchQuery').addEventListener('input', async () => {
      const q = document.getElementById('groupSearchQuery').value.trim();
      if (!q) { document.getElementById('groupSearchResults').innerHTML = ''; return; }
      const res = await fetch(`${SERVER_URL}/search_groups?q=${encodeURIComponent(q)}`);
      const groups = await res.json();
      showSearchResults(groups, 'group');
    });

    function showSearchResults(items, type) {
      const container = type === 'user' ? document.getElementById('searchResults') : document.getElementById('groupSearchResults');
      container.innerHTML = '';
      if (!items.length) { container.innerHTML = '<div>Ничего не найдено</div>'; return; }
      items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'search-result-item';
        if (type === 'user') {
          div.textContent = item.login;
          div.addEventListener('click', () => { sendServerMessage('create_private_chat', { target: item.login }); document.getElementById('searchModal').classList.remove('active'); });
        } else {
          div.innerHTML = `${escapeHtml(item.name)} (${item.type==='group'?'Группа':'Канал'}) <button class="btn btn-sm join-btn" data-id="${item.id}">Вступить</button>`;
          div.querySelector('.join-btn').addEventListener('click', (e) => { e.stopPropagation(); sendServerMessage('join_group', { chatId: item.id }); document.getElementById('groupsModal').classList.remove('active'); });
        }
        container.appendChild(div);
      });
    }

    // ====== ЗВОНКИ ======
    const callModal = document.getElementById('callModal');
    function showCallModalWindow(title, name, showAccept) {
      document.getElementById('callModalTitle').textContent = title;
      document.getElementById('callModalName').textContent = name;
      document.getElementById('callModalAcceptBtn').style.display = showAccept ? 'inline-block' : 'none';
      document.getElementById('callModalRejectBtn').textContent = showAccept ? 'Отклонить' : 'Отменить';
      callModal.classList.add('active');
    }
    function hideCallModalWindow() { callModal.classList.remove('active'); }
    function cleanupCall() {
      if (peerConnection) { peerConnection.close(); peerConnection = null; }
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      document.getElementById('localVideo').srcObject = null;
      document.getElementById('remoteVideo').srcObject = null;
      document.getElementById('currentCallUI').classList.remove('active');
      activeCall = null;
    }
    async function createPeerConnection() {
      peerConnection = new RTCPeerConnection(ICE_SERVERS);
      peerConnection.onicecandidate = (event) => { if (event.candidate && activeCall) sendServerMessage('ice_candidate', { chatId: activeCall.chatId, candidate: event.candidate }); };
      peerConnection.ontrack = (event) => { if (event.streams?.[0]) document.getElementById('remoteVideo').srcObject = event.streams[0]; };
      if (localStream) localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
    }
    async function startCall(callType) {
      if (!activeChatId) return;
      const chat = chats[activeChatId];
      if (!chat || chat.type !== 'private') return alert('Звонки только в личных чатах');
      if (activeCall) return alert('Уже есть активный звонок');
      try {
        const constraints = callType === 'video' ? { audio: true, video: { width: 640, height: 480 } } : { audio: true, video: false };
        localStream = await navigator.mediaDevices.getUserMedia(constraints);
        document.getElementById('localVideo').srcObject = localStream;
        document.getElementById('localVideo').style.display = callType === 'audio' ? 'none' : 'block';
        activeCall = { chatId: activeChatId, callType, incoming: false };
        showCallModalWindow('Идёт вызов', chat.name, false);
        await createPeerConnection();
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        sendServerMessage('call_offer', { chatId: activeChatId, sdp: peerConnection.localDescription, callType });
      } catch (e) { alert('Не удалось начать звонок: ' + e.message); cleanupCall(); hideCallModalWindow(); }
    }
    document.getElementById('audioCallBtn').addEventListener('click', () => startCall('audio'));
    document.getElementById('videoCallBtn').addEventListener('click', () => startCall('video'));
    document.getElementById('callModalRejectBtn').addEventListener('click', () => {
      if (activeCall) { sendServerMessage('call_end', { chatId: activeCall.chatId }); cleanupCall(); }
      hideCallModalWindow();
    });
    function handleCallOffer(msg) {
      if (activeCall) { sendServerMessage('call_end', { chatId: msg.chatId }); return; }
      activeCall = { chatId: msg.chatId, callType: msg.callType || 'video', incoming: true, from: msg.from, sdp: msg.sdp };
      showCallModalWindow('Входящий ' + (activeCall.callType === 'audio' ? 'аудиозвонок' : 'видеозвонок'), msg.from, true);
    }
    document.getElementById('callModalAcceptBtn').addEventListener('click', async () => {
      const callInfo = activeCall;
      if (!callInfo || !callInfo.incoming) return;
      hideCallModalWindow();
      try {
        const constraints = callInfo.callType === 'video' ? { audio: true, video: { width: 640, height: 480 } } : { audio: true, video: false };
        localStream = await navigator.mediaDevices.getUserMedia(constraints);
        document.getElementById('localVideo').srcObject = localStream;
        document.getElementById('localVideo').style.display = callInfo.callType === 'audio' ? 'none' : 'block';
        document.getElementById('remoteVideo').style.display = 'block';
        document.getElementById('currentCallUI').classList.add('active');
        await createPeerConnection();
        await peerConnection.setRemoteDescription(new RTCSessionDescription(callInfo.sdp));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        sendServerMessage('call_answer', { chatId: callInfo.chatId, sdp: peerConnection.localDescription });
      } catch (e) { alert('Не удалось принять звонок: ' + e.message); cleanupCall(); }
    });
    function handleCallAnswer(msg) {
      if (!activeCall || activeCall.incoming) return;
      hideCallModalWindow();
      document.getElementById('currentCallUI').classList.add('active');
      if (peerConnection) peerConnection.setRemoteDescription(new RTCSessionDescription(msg.sdp));
    }
    function handleICECandidate(msg) {
      if (peerConnection && msg.candidate) peerConnection.addIceCandidate(new RTCIceCandidate(msg.candidate));
    }
    document.getElementById('endCallBtn').addEventListener('click', () => {
      if (activeCall) sendServerMessage('call_end', { chatId: activeCall.chatId });
      cleanupCall(); hideCallModalWindow();
    });
    function handleCallEnded() { cleanupCall(); hideCallModalWindow(); }
    document.getElementById('toggleMic').addEventListener('click', () => {
      if (localStream) { const t = localStream.getAudioTracks()[0]; if (t) t.enabled = !t.enabled; }
    });
    document.getElementById('toggleCam').addEventListener('click', () => {
      if (localStream) { const t = localStream.getVideoTracks()[0]; if (t) { t.enabled = !t.enabled; document.getElementById('localVideo').style.display = t.enabled ? 'block' : 'none'; } }
    });

    // ====== ПРОФИЛЬ ======
    document.getElementById('profileBtn').addEventListener('click', () => alert('Профиль в разработке'));

    function escapeHtml(text) { return String(text).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(1) + ' MB';
    }
  </script>
</body>
</html>
