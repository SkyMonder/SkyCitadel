<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Ассистент — SkyCitadel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0f1e;
      color: #e0e8ff;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1rem;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 1rem;
      background: #111827;
      border-radius: 16px;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .back-btn {
      background: #2f4b8c;
      border: none;
      color: white;
      padding: 0.5rem 1.2rem;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .back-btn:hover { background: #4a6bb0; }
    h1 { font-size: 1.6rem; color: #b7ceff; display: flex; align-items: center; gap: 0.5rem; }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }
    .model-selector {
      display: flex;
      gap: 0.3rem;
      background: #1a233a;
      padding: 0.2rem;
      border-radius: 20px;
      border: 1px solid #2a3450;
      flex-wrap: wrap;
    }
    .model-selector button {
      background: transparent;
      border: none;
      color: #8899cc;
      padding: 0.3rem 0.7rem;
      border-radius: 16px;
      font-size: 0.65rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .model-selector button.active {
      background: #2f4b8c;
      color: white;
    }
    .model-selector button:hover:not(.active) { background: #2a3450; }
    .token-indicator {
      font-size: 0.8rem;
      color: #8899cc;
      background: #1a233a;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      border: 1px solid #2a3450;
      white-space: nowrap;
    }
    .token-indicator.low { color: #f48024; border-color: #f48024; }
    .token-indicator.critical { color: #f44; border-color: #f44; animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .clear-btn {
      background: #4a2a2a;
      border: none;
      color: #f48024;
      padding: 0.4rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .clear-btn:hover { background: #5a3a3a; }
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #111827;
      border-radius: 16px;
      border: 1px solid #2a3450;
      overflow: hidden;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .msg-wrapper {
      max-width: 80%;
      align-self: flex-start;
    }
    .msg-wrapper.user { align-self: flex-end; }
    .msg {
      padding: 0.7rem 1rem;
      border-radius: 16px;
      background: #1a233a;
      border: 1px solid #2a3450;
      word-wrap: break-word;
      animation: fadeIn 0.2s ease;
    }
    .msg.user {
      background: #2f4b8c;
      border-color: #3f62b0;
    }
    .msg a { color: #7a9aef; text-decoration: underline; }
    .msg a:hover { color: #b7ceff; }
    .msg .time {
      font-size: 0.7rem;
      color: #8899cc;
      margin-top: 0.3rem;
      text-align: right;
    }
    .msg-actions {
      margin-top: 0.3rem;
      display: flex;
      gap: 0.5rem;
    }
    .msg-actions button {
      background: #2a3450;
      border: none;
      color: #cfdbff;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .msg-actions button:hover { background: #3a4a6a; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .input-area {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      padding: 0.5rem 1rem;
      gap: 0.5rem;
      border-top: 1px solid #2a3450;
      background: #0d1425;
    }
    .input-area .input-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 200px;
    }
    .input-area input {
      flex: 1;
      padding: 0.7rem;
      background: #0d1225;
      border: 1px solid #3a4660;
      color: white;
      border-radius: 10px;
      outline: none;
      min-width: 150px;
    }
    .input-area input:focus { border-color: #5f7ecf; }
    .input-area input:disabled { opacity: 0.5; }
    .input-area .char-counter {
      font-size: 0.7rem;
      color: #8899cc;
      white-space: nowrap;
      padding: 0 0.3rem;
    }
    .input-area .char-counter.over { color: #f44; }
    .input-area button {
      padding: 0.7rem 1.5rem;
      background: #5f7ecf;
      border: none;
      color: white;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }
    .input-area button:hover { background: #7a9aef; }
    .input-area button:disabled { opacity: 0.5; pointer-events: none; }
    .loading {
      text-align: center;
      color: #8899cc;
      font-style: italic;
      padding: 0.5rem;
    }
    .quick-actions {
      display: flex;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      flex-wrap: wrap;
      border-bottom: 1px solid #2a3450;
      background: #0d1425;
    }
    .quick-actions button {
      background: #1a233a;
      border: 1px solid #2a3450;
      color: #cfdbff;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.2s;
    }
    .quick-actions button:hover { background: #2a3450; }
    .empty-state {
      text-align: center;
      color: #8899cc;
      padding: 2rem;
      font-style: italic;
    }
    .token-info {
      text-align: center;
      font-size: 0.7rem;
      color: #4a5a7a;
      padding: 0.3rem;
      border-top: 1px solid #1a233a;
      background: #0d1425;
    }
    .error-msg {
      color: #f48024;
      text-align: center;
      padding: 0.3rem;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="/" class="back-btn">🏰 Вернуться в крепость</a>
    <h1>🧠 AI Ассистент</h1>
    <div class="header-actions">
      <div class="model-selector" id="modelSelector">
        <button data-model="@cf/meta/llama-3.2-3b-instruct" class="active">⚡ Быстрая</button>
        <button data-model="@cf/google/gemma-4-26b-a4b-it">🧠 Умная</button>
        <button data-model="@cf/zai-org/glm-4.7-flash">⚖️ Сбаланс.</button>
        <button data-model="@cf/qwen/qwen3-30b-a3b-fp8">🚀 Qwen 30B</button>
        <button data-model="@cf/moonshotai/kimi-k2.6">🔥 Kimi</button>
        <!-- НОВАЯ КНОПКА ДЛЯ DEEPSEEK -->
        <button data-model="deepseek-ai/DeepSeek-V4-Flash-0731">🧬 DeepSeek V4</button>
      </div>
      <span class="token-indicator" id="tokenIndicator">⚡ Осталось: 10000</span>
      <button class="clear-btn" id="clearHistoryBtn">🗑️ Очистить</button>
    </div>
  </div>

  <div class="chat-container">
    <div class="quick-actions">
      <button data-prompt="Помоги написать пост для соцсети">✍️ Пост</button>
      <button data-prompt="Суммаризируй текст">📝 Суммаризировать</button>
      <button data-prompt="Идея для видео">💡 Идея</button>
      <button data-prompt="Что нового в SkyCitadel?">📢 О сервисе</button>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <div class="input-wrapper">
        <input type="text" id="input" placeholder="Спроси меня о чём угодно..." autofocus maxlength="300">
        <span class="char-counter" id="charCounter">0/300</span>
      </div>
      <button id="send-btn">Отправить</button>
    </div>
    <div id="charError" class="error-msg" style="display:none;">⚠️ Сообщение слишком длинное (максимум 300 символов)</div>
    <div class="token-info" id="tokenInfo">Лимит: 10 000 токенов в день. Сбрасывается в 00:00 UTC</div>
  </div>

  <script>
    // ====== КОНФИГУРАЦИЯ ======
    const API_URL = 'https://skymutant.cc.cd/ai/chat';
    const STORAGE_KEY = 'skyai_history';
    const MODEL_STORAGE_KEY = 'skyai_selected_model';
    const MAX_TOKENS_PER_DAY = 10000;
    const TOKEN_STORAGE_KEY = 'skyai_token_usage';
    const MAX_MSG_LENGTH = 300;

    // ====== УПРАВЛЕНИЕ МОДЕЛЯМИ ======
    const DEFAULT_MODEL = '@cf/meta/llama-3.2-3b-instruct';
    let selectedModel = localStorage.getItem(MODEL_STORAGE_KEY) || DEFAULT_MODEL;

    function setSelectedModel(model) {
      selectedModel = model;
      localStorage.setItem(MODEL_STORAGE_KEY, model);
      document.querySelectorAll('.model-selector button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.model === model);
      });
    }

    document.querySelectorAll('.model-selector button').forEach(btn => {
      btn.addEventListener('click', () => {
        setSelectedModel(btn.dataset.model);
      });
      if (btn.dataset.model === selectedModel) {
        btn.classList.add('active');
      }
    });

    // ====== УПРАВЛЕНИЕ ТОКЕНАМИ ======
    function getTokenUsage() {
      try {
        const data = JSON.parse(localStorage.getItem(TOKEN_STORAGE_KEY));
        if (data && data.date === new Date().toDateString()) return data.used;
      } catch (e) {}
      return 0;
    }
    function setTokenUsage(used) {
      localStorage.setItem(TOKEN_STORAGE_KEY, JSON.stringify({ date: new Date().toDateString(), used }));
    }
    function updateTokenIndicator() {
      const used = getTokenUsage();
      const remaining = Math.max(0, MAX_TOKENS_PER_DAY - used);
      const indicator = document.getElementById('tokenIndicator');
      if (indicator) {
        indicator.textContent = `⚡ Осталось: ${remaining}`;
        indicator.classList.remove('low', 'critical');
        if (remaining < 50) indicator.classList.add('critical');
        else if (remaining < 200) indicator.classList.add('low');
      }
    }
    function addTokenUsage(estimatedTokens) {
      const used = getTokenUsage();
      const newUsed = used + estimatedTokens;
      setTokenUsage(newUsed);
      updateTokenIndicator();
      if (newUsed >= MAX_TOKENS_PER_DAY) {
        document.getElementById('send-btn').disabled = true;
        document.getElementById('input').placeholder = '❌ Лимит токенов на сегодня исчерпан';
        document.getElementById('input').disabled = true;
      }
    }
    (function checkTokenLimit() {
      const used = getTokenUsage();
      if (used >= MAX_TOKENS_PER_DAY) {
        document.getElementById('send-btn').disabled = true;
        document.getElementById('input').disabled = true;
        document.getElementById('input').placeholder = '❌ Лимит токенов на сегодня исчерпан';
      }
    })();

    // ====== КОНТРОЛЬ ДЛИНЫ СООБЩЕНИЯ ======
    const input = document.getElementById('input');
    const charCounter = document.getElementById('charCounter');
    const charError = document.getElementById('charError');
    const sendBtn = document.getElementById('send-btn');

    function updateCharCounter() {
      const len = input.value.length;
      charCounter.textContent = `${len}/${MAX_MSG_LENGTH}`;
      if (len > MAX_MSG_LENGTH) {
        charCounter.classList.add('over');
        charError.style.display = 'block';
        sendBtn.disabled = true;
      } else {
        charCounter.classList.remove('over');
        charError.style.display = 'none';
        // если лимит токенов не исчерпан, включаем кнопку
        if (getTokenUsage() < MAX_TOKENS_PER_DAY) {
          sendBtn.disabled = false;
        }
      }
    }

    input.addEventListener('input', updateCharCounter);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(input.value);
      }
    });

    // ====== СОСТОЯНИЕ ЧАТА ======
    const messagesContainer = document.getElementById('messages');
    let history = [];

    function loadHistory() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed) && parsed.length > 0) { history = parsed; return true; }
        }
      } catch (e) {}
      return false;
    }
    function saveHistory() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); } catch (e) {}
    }

    function renderMessage(msg) {
      const wrapper = document.createElement('div');
      wrapper.className = `msg-wrapper${msg.role === 'user' ? ' user' : ''}`;

      const div = document.createElement('div');
      div.className = `msg${msg.role === 'user' ? ' user' : ''}`;

      let content = msg.content;
      const linkRegex = /\[([^\]]+)\]\(([^)]+)\)/g;
      content = content.replace(linkRegex, (match, text, url) => {
        return `<a href="${url}" target="_blank">${text}</a>`;
      });
      content = content.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');

      div.innerHTML = content;

      const time = document.createElement('div');
      time.className = 'time';
      time.textContent = new Date(msg.timestamp || Date.now()).toLocaleTimeString();
      div.appendChild(time);

      wrapper.appendChild(div);

      if (msg.role === 'assistant' && msg.content.includes('skycitadel.cc.cd/search.html')) {
        const actions = document.createElement('div');
        actions.className = 'msg-actions';
        const searchBtn = document.createElement('button');
        searchBtn.textContent = '🔍 Поискать';
        const urlMatch = msg.content.match(/https:\/\/skycitadel\.cc\.cd\/search\.html[^\s)]+/);
        if (urlMatch) {
          searchBtn.addEventListener('click', () => { window.open(urlMatch[0], '_blank'); });
        } else {
          searchBtn.style.display = 'none';
        }
        actions.appendChild(searchBtn);
        wrapper.appendChild(actions);
      }

      return wrapper;
    }

    function renderMessages() {
      messagesContainer.innerHTML = '';
      if (history.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'Задай вопрос ассистенту';
        messagesContainer.appendChild(empty);
        return;
      }
      history.forEach(msg => {
        const el = renderMessage(msg);
        messagesContainer.appendChild(el);
      });
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function addMessage(text, role = 'user') {
      const msg = { role, content: text, timestamp: Date.now() };
      history.push(msg);
      saveHistory();
      renderMessages();
    }

    function clearHistory() {
      if (history.length === 0) return;
      if (!confirm('Удалить всю историю диалога?')) return;
      history = [];
      saveHistory();
      renderMessages();
    }

    // ====== ОТПРАВКА ======
    async function sendMessage(text) {
      if (!text.trim()) return;

      // Проверка длины
      if (text.length > MAX_MSG_LENGTH) {
        charError.style.display = 'block';
        return;
      }

      const used = getTokenUsage();
      if (used >= MAX_TOKENS_PER_DAY) {
        alert('Лимит токенов на сегодня исчерпан. Попробуйте завтра.');
        return;
      }

      addMessage(text, 'user');
      input.value = '';
      updateCharCounter();
      sendBtn.disabled = true;

      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'loading';
      loadingDiv.id = 'loading-indicator';
      loadingDiv.textContent = '⏳ Думаю...';
      messagesContainer.appendChild(loadingDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      const apiHistory = history.slice(-5).map(m => ({ role: m.role, content: m.content }));

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: text,
            history: apiHistory.slice(0, -1),
            model: selectedModel
          })
        });

        const loadingEl = document.getElementById('loading-indicator');
        if (loadingEl) loadingEl.remove();

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.error || `HTTP ${response.status}`);
        }

        const data = await response.json();
        const reply = data.reply || 'Не удалось получить ответ';

        // Экономим нейроны: считаем только символы ответа (входные уже учтены, но мы их не считаем)
        const totalChars = reply.length;
        const estimatedTokens = Math.ceil(totalChars / 4) + 30; // +30 на overhead
        addTokenUsage(estimatedTokens);

        addMessage(reply, 'assistant');

      } catch (err) {
        const loadingEl = document.getElementById('loading-indicator');
        if (loadingEl) loadingEl.remove();
        addMessage(`❌ Ошибка: ${err.message}`, 'assistant');
      } finally {
        if (getTokenUsage() < MAX_TOKENS_PER_DAY) {
          sendBtn.disabled = false;
        }
        input.focus();
      }
    }

    // ====== ИНИЦИАЛИЗАЦИЯ ======
    (function init() {
      const hasHistory = loadHistory();
      if (!hasHistory) {
        history = [];
        saveHistory();
      }
      renderMessages();
      updateTokenIndicator();
      setSelectedModel(selectedModel);
      updateCharCounter(); // инициализация счётчика
    })();

    // ====== ОБРАБОТЧИКИ ======
    sendBtn.addEventListener('click', () => sendMessage(input.value));
    document.getElementById('clearHistoryBtn').addEventListener('click', clearHistory);
    document.querySelectorAll('.quick-actions button').forEach(btn => {
      btn.addEventListener('click', () => {
        input.value = btn.dataset.prompt;
        updateCharCounter();
        sendMessage(input.value);
      });
    });
    input.focus();
  </script>
</body>
</html>
