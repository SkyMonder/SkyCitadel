<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkySocial</title>
  <style>
    :root {
      --bg: #0a0f1e; --panel: #111827; --card: #1a233a;
      --border: #2a3450; --text: #e0e8ff; --accent: #5f7ecf;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }
    .login-screen { position: absolute; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 20; }
    .login-box { background: var(--card); padding: 2rem; border-radius: 20px; border: 1px solid var(--border); width: 320px; text-align: center; }
    .login-box input { width: 100%; padding: 0.7rem; margin: 0.5rem 0; background: #0d1225; border: 1px solid var(--border); color: white; border-radius: 8px; }
    .login-box button { width: 100%; padding: 0.7rem; background: var(--accent); border: none; color: white; border-radius: 10px; cursor: pointer; font-weight: bold; }
    .login-box .btn-secondary { background: #2a2a2a; margin-top: 0.3rem; }
    .error { color: #f48024; font-size: 0.8rem; margin-top: 0.5rem; }
    .app { display: none; width: 100%; height: 100%; flex-direction: column; }
    .header { padding: 1rem; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .content { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
    .post { background: var(--card); padding: 1rem; border-radius: 12px; border: 1px solid var(--border); }
    .post-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
    .post-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; }
    .post-author { font-weight: bold; }
    .post-text { margin-bottom: 0.5rem; }
    .post-actions { display: flex; gap: 0.5rem; font-size: 0.85rem; flex-wrap: wrap; }
    .btn { background: var(--accent); border: none; color: white; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; }
    .btn-danger { background: #c44; }
    .btn-sm { font-size: 0.75rem; padding: 0.2rem 0.5rem; }
    .new-post { display: flex; gap: 0.5rem; padding: 0.5rem; background: var(--card); border-radius: 12px; }
    .new-post textarea { flex: 1; padding: 0.5rem; background: #0d1225; border: 1px solid var(--border); color: white; border-radius: 8px; resize: vertical; min-height: 60px; }
    .profile-panel { background: var(--card); padding: 1rem; border-radius: 12px; display: none; }
    .profile-panel input { width: 100%; padding: 0.5rem; margin-top: 0.5rem; background: #0d1225; border: 1px solid var(--border); color: white; border-radius: 6px; }
    .profile-panel button { width: 100%; margin-top: 0.5rem; }
    .comment-section { margin-top: 0.5rem; margin-left: 1rem; border-left: 2px solid #2f3b5c; padding-left: 0.8rem; }
    .comment { margin-bottom: 0.5rem; }
    .comment-actions { display: flex; gap: 0.3rem; font-size: 0.75rem; align-items: center; }
  </style>
</head>
<body>
  <!-- Экран входа -->
  <div id="loginScreen" class="login-screen">
    <div class="login-box">
      <h3>Вход в SkyID</h3>
      <input type="text" id="auth-login" placeholder="Логин">
      <input type="password" id="auth-password" placeholder="Пароль">
      <button id="auth-do-login">Войти</button>
      <button id="auth-do-register" class="btn-secondary">Зарегистрироваться</button>
      <div class="error" id="auth-error"></div>
    </div>
  </div>

  <!-- Основное приложение -->
  <div class="app" id="app">
    <div class="header">
      <span>👥 SkySocial</span>
      <div>
        <button class="btn" id="profileBtn">Профиль</button>
        <button class="btn" id="logoutBtn">Выход</button>
      </div>
    </div>
    <div class="content" id="content">
      <div class="new-post">
        <textarea id="postText" placeholder="Что нового?"></textarea>
        <button class="btn" id="sendPost">➤</button>
      </div>
      <div id="postsContainer"></div>
    </div>
    <div class="profile-panel" id="profilePanel">
      <h3>Мой профиль</h3>
      <input type="text" id="profileName" placeholder="Имя">
      <input type="text" id="profileBio" placeholder="О себе">
      <button class="btn" id="saveProfile">Сохранить</button>
      <button class="btn" id="closeProfile" style="background:#444;">Закрыть</button>
    </div>
  </div>

  <script>
    // ====== Конфигурация ======
    const SKYID_URL = 'https://skymutant.cc.cd';
    const SOCIAL_API = 'https://skymutant.cc.cd';
    const CLIENT_KEY_BASE64 = 'BLx5Vp7U1c8dR2mQkG4fJ6yA9tC3bF0zH7iL2nM5oP8=';

    // ====== Шифрование ======
    async function getKey() {
      const k = Uint8Array.from(atob(CLIENT_KEY_BASE64), c => c.charCodeAt(0));
      return crypto.subtle.importKey('raw', k, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
    }
    async function encryptPayload(obj) {
      const key = await getKey();
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const enc = new TextEncoder().encode(JSON.stringify(obj));
      const c = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc);
      const combo = new Uint8Array(iv.byteLength + c.byteLength);
      combo.set(iv);
      combo.set(new Uint8Array(c), iv.byteLength);
      return btoa(String.fromCharCode(...combo));
    }
    async function decryptPayload(b64) {
      const key = await getKey();
      const combo = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      const iv = combo.slice(0, 12);
      const data = combo.slice(12);
      const dec = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
      return JSON.parse(new TextDecoder().decode(dec));
    }

    // ====== Глобальные переменные ======
    let token = localStorage.getItem('skyid_token') || null;
    let currentUserSkyID = null;
    let currentLogin = null;
    let isAdmin = false;

    // ====== Проверка токена ======
    async function verifyToken() {
      if (!token) return false;
      try {
        const res = await fetch(`${SKYID_URL}/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ token })
        });
        if (res.ok) {
          const data = await res.json();
          currentUserSkyID = data.skyid;
          currentLogin = data.login;
          isAdmin = (data.login === 'SkyMonder');
          localStorage.setItem('skyid_skyid', data.skyid);
          return true;
        } else {
          logout();
          return false;
        }
      } catch (e) {
        logout();
        return false;
      }
    }

    function logout() {
      token = null;
      localStorage.removeItem('skyid_token');
      localStorage.removeItem('skyid_skyid');
      currentUserSkyID = null;
      currentLogin = null;
      isAdmin = false;
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
    }

    function showApp() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
    }

    // ====== Авторизация ======
    document.getElementById('auth-do-login').addEventListener('click', async () => {
      const login = document.getElementById('auth-login').value.trim();
      const password = document.getElementById('auth-password').value;
      if (!login || !password) {
        document.getElementById('auth-error').textContent = 'Заполните все поля';
        return;
      }
      try {
        const payload = await encryptPayload({ login, password });
        const res = await fetch(`${SKYID_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: payload })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || 'Ошибка входа');
        }
        const json = await res.json();
        const data = await decryptPayload(json.data);
        token = data.jwt || data.token;
        localStorage.setItem('skyid_token', token);
        const valid = await verifyToken();
        if (valid) {
          showApp();
          loadPosts();
        }
      } catch (e) {
        document.getElementById('auth-error').textContent = e.message;
      }
    });

    document.getElementById('auth-do-register').addEventListener('click', async () => {
      const login = document.getElementById('auth-login').value.trim();
      const password = document.getElementById('auth-password').value;
      if (!login || !password) {
        document.getElementById('auth-error').textContent = 'Заполните все поля';
        return;
      }
      try {
        const payload = await encryptPayload({ login, password });
        const res = await fetch(`${SKYID_URL}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: payload })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || 'Ошибка регистрации');
        }
        const json = await res.json();
        const data = await decryptPayload(json.data);
        token = data.jwt || data.token;
        localStorage.setItem('skyid_token', token);
        const valid = await verifyToken();
        if (valid) {
          showApp();
          loadPosts();
        }
      } catch (e) {
        document.getElementById('auth-error').textContent = e.message;
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', logout);

    // ====== Инициализация ======
    (async () => {
      if (token) {
        const valid = await verifyToken();
        if (valid) {
          showApp();
          loadPosts();
          return;
        }
      }
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
    })();

    // ====== API-запросы с авторизацией ======
    async function apiFetch(url, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        ...options.headers
      };
      if (token) {
        headers['Authorization'] = `Bearer ${token}`;
      }
      const res = await fetch(url, { ...options, headers });
      if (res.status === 401) {
        logout();
        throw new Error('Unauthorized');
      }
      return res;
    }

    // ====== Загрузка постов ======
    async function loadPosts() {
      const container = document.getElementById('postsContainer');
      try {
        const res = await apiFetch(`${SOCIAL_API}/posts`);
        const posts = await res.json();
        container.innerHTML = posts.map(post => renderPost(post)).join('');
      } catch (e) {
        if (e.message !== 'Unauthorized') {
          container.innerHTML = '<p>Ошибка загрузки постов</p>';
        }
      }
    }

    function renderPost(post) {
      const deleteBtn = (post.skyid === currentUserSkyID || isAdmin) ?
        `<button class="btn btn-danger btn-sm" onclick="deletePost('${post.id}')">Удалить</button>` : '';
      const banBtn = isAdmin ? `<button class="btn btn-danger btn-sm" onclick="banUser('${post.skyid}')">🔨 Бан</button>` : '';
      return `
        <div class="post">
          <div class="post-header">
            <div class="post-avatar">👤</div>
            <div class="post-author">${escapeHtml(post.author)} ${banBtn}</div>
            <span style="margin-left:auto; font-size:0.7rem; color:#8899cc;">${new Date(post.created).toLocaleString()}</span>
          </div>
          <div class="post-text">${escapeHtml(post.text)}</div>
          <div class="post-actions">
            <button class="btn btn-sm" onclick="likePost('${post.id}')">👍 ${post.likes.length}</button>
            <button class="btn btn-sm" onclick="dislikePost('${post.id}')">👎 ${post.dislikes.length}</button>
            <button class="btn btn-sm" onclick="toggleComments('${post.id}')">💬</button>
            ${deleteBtn}
          </div>
          <div id="comments-${post.id}" class="comment-section" style="display:none;">
            <div id="comments-list-${post.id}"></div>
            <div style="display:flex; gap:0.3rem; margin-top:0.3rem;">
              <input type="text" id="comment-input-${post.id}" placeholder="Комментарий..." style="flex:1; padding:0.3rem; background:#0d1225; border:1px solid var(--border); color:white; border-radius:4px;">
              <button class="btn btn-sm" onclick="addComment('${post.id}')">➤</button>
            </div>
          </div>
        </div>`;
    }

    // ====== Отправка поста ======
    document.getElementById('sendPost').addEventListener('click', async () => {
      const text = document.getElementById('postText').value.trim();
      if (!text) return;
      try {
        await apiFetch(`${SOCIAL_API}/posts`, {
          method: 'POST',
          body: JSON.stringify({ text })
        });
        document.getElementById('postText').value = '';
        loadPosts();
      } catch (e) {
        if (e.message !== 'Unauthorized') alert('Ошибка отправки поста');
      }
    });

    // ====== Лайки / дизлайки ======
    window.likePost = async (id) => {
      try {
        await apiFetch(`${SOCIAL_API}/posts/${id}/like`, { method: 'POST' });
        loadPosts();
      } catch (e) {}
    };
    window.dislikePost = async (id) => {
      try {
        await apiFetch(`${SOCIAL_API}/posts/${id}/dislike`, { method: 'POST' });
        loadPosts();
      } catch (e) {}
    };

    // ====== Удаление поста ======
    window.deletePost = async (id) => {
      if (!confirm('Удалить пост?')) return;
      try {
        await apiFetch(`${SOCIAL_API}/posts/${id}`, { method: 'DELETE' });
        loadPosts();
      } catch (e) {}
    };

    // ====== Комментарии ======
    window.toggleComments = async (postId) => {
      const block = document.getElementById('comments-' + postId);
      if (block.style.display === 'none' || !block.style.display) {
        block.style.display = 'block';
        const list = document.getElementById('comments-list-' + postId);
        try {
          const res = await apiFetch(`${SOCIAL_API}/posts/${postId}/comments`);
          const comments = await res.json();
          list.innerHTML = comments.map(c => `
            <div class="comment">
              <strong>${escapeHtml(c.author)}</strong>: ${escapeHtml(c.text)}
              <div class="comment-actions">
                <button class="btn btn-sm" onclick="likeComment('${postId}','${c.id}')">👍 ${c.likes.length}</button>
                <button class="btn btn-sm" onclick="dislikeComment('${postId}','${c.id}')">👎 ${c.dislikes.length}</button>
                ${(c.skyid === currentUserSkyID || isAdmin) ? `<button class="btn btn-danger btn-sm" onclick="deleteComment('${postId}','${c.id}')">×</button>` : ''}
              </div>
            </div>`).join('');
        } catch (e) {}
      } else {
        block.style.display = 'none';
      }
    };

    window.addComment = async (postId) => {
      const input = document.getElementById('comment-input-' + postId);
      const text = input.value.trim();
      if (!text) return;
      try {
        await apiFetch(`${SOCIAL_API}/posts/${postId}/comments`, {
          method: 'POST',
          body: JSON.stringify({ text })
        });
        input.value = '';
        window.toggleComments(postId);
      } catch (e) {}
    };

    window.likeComment = async (postId, commentId) => {
      try {
        await apiFetch(`${SOCIAL_API}/posts/${postId}/comments/${commentId}/like`, { method: 'POST' });
        window.toggleComments(postId);
      } catch (e) {}
    };
    window.dislikeComment = async (postId, commentId) => {
      try {
        await apiFetch(`${SOCIAL_API}/posts/${postId}/comments/${commentId}/dislike`, { method: 'POST' });
        window.toggleComments(postId);
      } catch (e) {}
    };
    window.deleteComment = async (postId, commentId) => {
      if (!confirm('Удалить комментарий?')) return;
      try {
        await apiFetch(`${SOCIAL_API}/posts/${postId}/comments/${commentId}`, { method: 'DELETE' });
        window.toggleComments(postId);
      } catch (e) {}
    };

    // ====== Бан пользователя (только админ) ======
    window.banUser = async (skyid) => {
      if (!isAdmin) return;
      if (!confirm(`Забанить пользователя ${skyid}?`)) return;
      try {
        await apiFetch(`${SOCIAL_API}/admin/ban`, {
          method: 'POST',
          body: JSON.stringify({ skyid })
        });
        alert('Пользователь забанен');
        loadPosts();
      } catch (e) {}
    };

    // ====== Профиль ======
    document.getElementById('profileBtn').addEventListener('click', async () => {
      const panel = document.getElementById('profilePanel');
      if (panel.style.display === 'none' || !panel.style.display) {
        panel.style.display = 'block';
        try {
          const res = await apiFetch(`${SOCIAL_API}/profile`);
          const profile = await res.json();
          document.getElementById('profileName').value = profile.name || '';
          document.getElementById('profileBio').value = profile.bio || '';
        } catch (e) {}
      } else {
        panel.style.display = 'none';
      }
    });
    document.getElementById('closeProfile').addEventListener('click', () => {
      document.getElementById('profilePanel').style.display = 'none';
    });
    document.getElementById('saveProfile').addEventListener('click', async () => {
      const name = document.getElementById('profileName').value.trim();
      const bio = document.getElementById('profileBio').value.trim();
      try {
        await apiFetch(`${SOCIAL_API}/profile`, {
          method: 'PUT',
          body: JSON.stringify({ name, bio })
        });
        alert('Профиль обновлён');
      } catch (e) {}
    });

    // ====== Вспомогательные функции ======
    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
  </script>
</body>
</html>
