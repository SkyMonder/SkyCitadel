<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyTV — Смотрим</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0a0f1e;
      color: #e0e8ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      padding: 0.8rem 1.5rem;
      background: #111827;
      border-bottom: 1px solid #2a3450;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .header a {
      color: #5f7ecf;
      text-decoration: none;
      font-weight: 500;
    }
    .header a:hover { text-decoration: underline; }
    .header h1 {
      color: #b7ceff;
      font-size: 1.5rem;
      font-weight: 400;
    }
    .header .badge {
      background: #2a7a2a;
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      font-size: 0.7rem;
      color: #fff;
      margin-left: 0.5rem;
    }
    .channels-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      background: #0d1425;
      border-bottom: 1px solid #1e2a40;
      flex-shrink: 0;
      overflow-y: auto;
      max-height: 80px;
    }
    .channel-btn {
      background: #1a233a;
      border: 1px solid #2a3450;
      color: #cfdbff;
      padding: 0.3rem 0.9rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .channel-btn:hover {
      background: #2a3450;
      border-color: #5f7ecf;
    }
    .channel-btn.active {
      background: #5f7ecf;
      border-color: #5f7ecf;
      color: #fff;
    }
    .player {
      flex: 1;
      background: #000;
    }
    .player iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #0a0f1e;
    }
    @media (max-width: 768px) {
      .header { padding: 0.5rem 1rem; }
      .header h1 { font-size: 1.2rem; }
      .channels-bar { gap: 0.3rem; padding: 0.3rem 0.5rem; max-height: 60px; }
      .channel-btn { font-size: 0.7rem; padding: 0.2rem 0.6rem; }
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="/">🏰 Назад</a>
    <h1>📺 SkyTV <span class="badge">Смотрим</span></h1>
  </div>

  <div class="channels-bar" id="channelsBar"></div>

  <div class="player">
    <iframe id="tvFrame" src="" allowfullscreen></iframe>
  </div>

  <script>
    // ====== КАНАЛЫ «СМОТРИМ» (официальные embed-ссылки) ======
    const channels = [
      { id: '19201', name: 'Россия 24' },
      { id: '63251', name: 'Россия-Культура' },
      { id: '19845', name: 'Россия 1' },
      // Добавьте другие каналы, если знаете их live_id
      // Для Москвы 24 нужно найти ID на сайте smotrim.ru
    ];

    const frame = document.getElementById('tvFrame');
    const bar = document.getElementById('channelsBar');
    let currentId = '19201';

    function loadChannel(id) {
      currentId = id;
      const url = `https://player.smotrim.ru/iframe/stream/live_id/${id}`;
      frame.src = url;
      document.querySelectorAll('.channel-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.id === id);
      });
    }

    channels.forEach(ch => {
      const btn = document.createElement('button');
      btn.className = 'channel-btn';
      btn.dataset.id = ch.id;
      btn.textContent = ch.name;
      if (ch.id === currentId) btn.classList.add('active');
      btn.addEventListener('click', () => loadChannel(ch.id));
      bar.appendChild(btn);
    });

    // Загружаем первый канал
    loadChannel('19201');
  </script>
</body>
</html>
