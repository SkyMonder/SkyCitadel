<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyChess — Играть в шахматы</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0a0f1e;
      color: #e0e8ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      padding: 0.8rem 1.5rem;
      background: #111827;
      border-bottom: 1px solid #2a3450;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .header a {
      color: #5f7ecf;
      text-decoration: none;
      font-weight: 500;
    }
    .header a:hover { text-decoration: underline; }
    .header h1 {
      color: #b7ceff;
      font-size: 1.5rem;
      font-weight: 400;
    }
    .header .badge {
      background: #2a7a2a;
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      font-size: 0.7rem;
      color: #fff;
      margin-left: 0.5rem;
    }
    .header .badge.live { background: #c44; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: radial-gradient(circle at 20% 20%, #121a30, #080d1a);
    }
    .chess-wrapper {
      width: 100%;
      max-width: 800px;
      height: 100%;
      max-height: 700px;
      background: #111827;
      border-radius: 16px;
      border: 1px solid #2a3450;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .chess-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #1a233a;
    }
    .info-bar {
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding: 0.5rem 1rem;
      background: #0d1425;
      border-top: 1px solid #1e2a40;
      flex-shrink: 0;
      font-size: 0.8rem;
      color: #8899cc;
      flex-wrap: wrap;
    }
    .info-bar a {
      color: #5f7ecf;
      text-decoration: none;
    }
    .info-bar a:hover { text-decoration: underline; }
    @media (max-width: 768px) {
      .header { padding: 0.5rem 1rem; }
      .header h1 { font-size: 1.2rem; }
      .container { padding: 0.5rem; }
      .chess-wrapper { max-height: 600px; }
    }
    @media (max-width: 480px) {
      .chess-wrapper { max-height: 500px; border-radius: 12px; }
      .info-bar { font-size: 0.7rem; gap: 1rem; }
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="/">🏰 Назад</a>
    <h1>♟️ SkyChess <span class="badge live">Live</span></h1>
  </div>

  <div class="container">
    <div class="chess-wrapper">
      <!-- Lichess iframe — бесплатно, без рекламы, работает в РФ -->
      <iframe 
        src="https://lichess.org/embed?theme=wood&bg=dark" 
        allowtransparency="true"
        allow="fullscreen"
        loading="lazy"
        title="SkyChess — играть в шахматы онлайн"
      ></iframe>
    </div>
  </div>

  <div class="info-bar">
    <span>🎯 <a href="https://lichess.org/" target="_blank">Lichess</a> — бесплатный шахматный сервер</span>
    <span>👥 <a href="https://lichess.org/tv" target="_blank">Смотреть трансляции</a></span>
    <span>🤖 <a href="https://lichess.org/analysis" target="_blank">Анализ партий</a></span>
  </div>

  <!-- Альтернативные ссылки (на случай, если основной iframe не грузится) -->
  <div style="display:none;">
    <!-- Если Lichess заблокирован, можно использовать другие варианты: -->
    <!-- Chess.com (с рекламой) -->
    <!-- <iframe src="https://www.chess.com/emboard?id=123456" ...></iframe> -->
    <!-- Chess24 (требуется регистрация) -->
    <!-- <iframe src="https://chess24.com/en/embed/..." ...></iframe> -->
  </div>
</body>
</html>
