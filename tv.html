<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyTV — Свободное ТВ</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0a0f1e;
      color: #e0e8ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      padding: 0.8rem 1.5rem;
      background: #111827;
      border-bottom: 1px solid #2a3450;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .header a {
      color: #5f7ecf;
      text-decoration: none;
      font-weight: 500;
    }
    .header a:hover { text-decoration: underline; }
    .header h1 {
      color: #b7ceff;
      font-size: 1.5rem;
      font-weight: 400;
    }
    .header .badge {
      background: #2a7a2a;
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      font-size: 0.7rem;
      color: #fff;
      margin-left: 0.5rem;
    }
    .channels-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      background: #0d1425;
      border-bottom: 1px solid #1e2a40;
      flex-shrink: 0;
      overflow-y: auto;
      max-height: 80px;
      align-items: center;
    }
    .channel-btn {
      background: #1a233a;
      border: 1px solid #2a3450;
      color: #cfdbff;
      padding: 0.3rem 0.9rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .channel-btn:hover {
      background: #2a3450;
      border-color: #5f7ecf;
    }
    .channel-btn.active {
      background: #5f7ecf;
      border-color: #5f7ecf;
      color: #fff;
    }
    .player {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
    }
    .player video {
      width: 100%;
      height: 100%;
      max-height: 100vh;
      background: #000;
      outline: none;
    }
    .loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.7);
      color: #8899cc;
      font-size: 1.2rem;
      pointer-events: none;
      transition: opacity 0.5s;
      flex-direction: column;
      gap: 0.5rem;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-overlay .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #2a3450;
      border-top: 4px solid #5f7ecf;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .error-msg {
      color: #f48024;
      font-size: 0.9rem;
    }
    @media (max-width: 768px) {
      .header { padding: 0.5rem 1rem; }
      .header h1 { font-size: 1.2rem; }
      .channels-bar { gap: 0.3rem; padding: 0.3rem 0.5rem; max-height: 60px; }
      .channel-btn { font-size: 0.7rem; padding: 0.2rem 0.6rem; }
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="/">🏰 Назад</a>
    <h1>📺 SkyTV <span class="badge">Open IPTV</span></h1>
  </div>

  <div class="channels-bar" id="channelsBar"></div>

  <div class="player">
    <video id="video" controls autoplay></video>
    <div class="loading-overlay" id="loading">
      <div class="spinner"></div>
      <span>Загрузка...</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    // ====== СПИСОК КАНАЛОВ (из вашего M3U, только прямые потоки) ======
    const channels = [
      { name: 'Первый канал', url: 'https://edge1.1internet.tv/dash-live2/streams/1tv-dvr/1tvdash.mpd' },
      { name: 'Матч ТВ', url: 'https://streaming.televizor-24-tochka.ru/live/6.m3u8' },
      { name: 'НТВ', url: 'http://ott-cdn.ucom.am/s17/index.m3u8' },
      { name: 'Пятый канал', url: 'https://streaming.televizor-24-tochka.ru/live/8.m3u8' },
      { name: 'Карусель', url: 'https://streaming102.interskytech.com/live/232.m3u8' },
      { name: 'ОТР', url: 'https://streaming.televizor-24-tochka.ru/live/12.m3u8' },
      { name: 'ТВ Центр', url: 'http://ott-cdn.ucom.am/s54/index.m3u8' },
      { name: 'Рен ТВ', url: 'https://streaming.televizor-24-tochka.ru/live/14.m3u8' },
      { name: 'Спас', url: 'https://spas.mediacdn.ru/cdn/spas/playlist.m3u8' },
      { name: 'СТС', url: 'http://ott-cdn.ucom.am/s52/04.m3u8' },
      { name: 'Домашний', url: 'http://ott-cdn.ucom.am/s88/index.m3u8' },
      { name: 'ТВ-3', url: 'https://streaming.televizor-24-tochka.ru/live/18.m3u8' },
      { name: 'Пятница!', url: 'https://streaming.televizor-24-tochka.ru/live/19.m3u8' },
      { name: 'Звезда', url: 'https://tvchannelstream1.tvzvezda.ru/cdn/tvzvezda/playlist.m3u8' },
      { name: 'Мир', url: 'http://hls.mirtv.cdnvideo.ru/mirtv-parampublish/mirtv_2500/playlist.m3u8' },
      { name: 'ТНТ', url: 'http://ott-cdn.ucom.am/s19/index.m3u8' },
      { name: 'Муз-ТВ', url: 'https://streaming102.interskytech.com/live/618.m3u8' },
      { name: 'РБК', url: 'http://92.50.128.180/utv/1358/index.m3u8' },
      { name: 'RT Д Русский', url: 'https://hls.rt.com/hls/rtdru.m3u8' },
      { name: 'CGTN Русский', url: 'https://news.cgtn.com/resource/live/russian/cgtn-r.m3u8' }
    ];

    const video = document.getElementById('video');
    const loading = document.getElementById('loading');
    const bar = document.getElementById('channelsBar');
    let hls = null;
    let currentIndex = 0;

    // Строим кнопки
    function renderChannels() {
      bar.innerHTML = '';
      channels.forEach((ch, i) => {
        const btn = document.createElement('button');
        btn.className = 'channel-btn' + (i === 0 ? ' active' : '');
        btn.textContent = ch.name;
        btn.addEventListener('click', () => loadChannel(i));
        bar.appendChild(btn);
      });
    }

    function loadChannel(index) {
      const channel = channels[index];
      if (!channel) return;
      currentIndex = index;

      // Обновляем активную кнопку
      document.querySelectorAll('.channel-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
      });

      loading.classList.remove('hidden');
      loading.innerHTML = '<div class="spinner"></div><span>Загрузка...</span>';

      // Уничтожаем старый HLS
      if (hls) {
        hls.destroy();
        hls = null;
      }

      const url = channel.url;

      // Проверяем, поддерживается ли HLS
      if (Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
        });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
          loading.classList.add('hidden');
        });
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            loading.innerHTML = `<span class="error-msg">❌ Не удалось загрузить канал</span><span style="font-size:0.8rem;color:#8899cc;">Попробуйте другой</span>`;
            setTimeout(() => loading.classList.add('hidden'), 4000);
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Safari (native HLS)
        video.src = url;
        video.addEventListener('loadedmetadata', () => {
          video.play().catch(() => {});
          loading.classList.add('hidden');
        });
      } else {
        loading.innerHTML = '<span class="error-msg">❌ Ваш браузер не поддерживает HLS</span>';
        setTimeout(() => loading.classList.add('hidden'), 4000);
      }
    }

    // Инициализация
    renderChannels();
    if (channels.length > 0) {
      loadChannel(0);
    }
  </script>
</body>
</html>
