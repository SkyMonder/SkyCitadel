<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyGames</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0a0f1e;
      color: #e0e8ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      padding: 0.8rem 1.5rem;
      background: #111827;
      border-bottom: 1px solid #2a3450;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .header a {
      color: #5f7ecf;
      text-decoration: none;
      font-weight: 500;
    }
    .header a:hover { text-decoration: underline; }
    .header h1 {
      color: #b7ceff;
      font-size: 1.5rem;
      font-weight: 400;
    }
    .header .user-info {
      margin-left: auto;
      color: #8899cc;
      font-size: 0.9rem;
    }
    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
      overflow-y: auto;
    }
    .game-selector {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .game-btn {
      background: #1a233a;
      border: 1px solid #2a3450;
      color: #cfdbff;
      padding: 0.5rem 1.5rem;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.2s;
    }
    .game-btn:hover { background: #2a3450; border-color: #5f7ecf; }
    .game-btn.active { background: #5f7ecf; border-color: #5f7ecf; color: #fff; }
    .game-area {
      flex: 1;
      background: #111827;
      border-radius: 12px;
      border: 1px solid #2a3450;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }
    .game-area .status {
      font-size: 1.2rem;
      color: #b7ceff;
    }
    .game-area .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      width: 300px;
      height: 300px;
    }
    .game-area .cell {
      background: #0d1425;
      border: 1px solid #2a3450;
      border-radius: 8px;
      font-size: 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
      color: #b7ceff;
    }
    .game-area .cell:hover { background: #1a233a; }
    .game-area .cell.disabled { cursor: not-allowed; opacity: 0.6; }
    .game-area .room-list {
      width: 100%;
      max-width: 500px;
      max-height: 200px;
      overflow-y: auto;
    }
    .room-item {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 1rem;
      background: #0d1425;
      border-radius: 8px;
      margin-bottom: 0.3rem;
      border: 1px solid #1e2a40;
    }
    .room-item button { background: #5f7ecf; border: none; color: #fff; padding: 0.2rem 1rem; border-radius: 6px; cursor: pointer; }
    .room-item button:hover { background: #7a9aef; }
    .btn { background: #5f7ecf; border: none; color: #fff; padding: 0.5rem 1.5rem; border-radius: 8px; cursor: pointer; }
    .btn:hover { background: #7a9aef; }
    .btn-secondary { background: #2a3450; }
    .btn-secondary:hover { background: #3a4a6a; }
    .btn-danger { background: #c44; }
    .btn-danger:hover { background: #a33; }
    @media (max-width: 768px) {
      .game-area .board { width: 200px; height: 200px; }
      .game-area .cell { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="/">🏰 Назад</a>
    <h1>🎮 SkyGames</h1>
    <div class="user-info" id="userInfo">Загрузка...</div>
  </div>

  <div class="container">
    <div class="game-selector">
      <button class="game-btn active" data-game="tictac">❌ Крестики-нолики</button>
      <button class="game-btn" data-game="hangman">🔤 Виселица</button>
      <button class="game-btn" data-game="battleship">🚢 Морской бой</button>
      <button class="game-btn" data-game="guess">🔢 Угадай число</button>
    </div>

    <div class="game-area" id="gameArea">
      <div class="status" id="gameStatus">Выберите игру и найдите соперника</div>
      <div id="gameBoard" style="display:flex;flex-direction:column;align-items:center;gap:1rem;">
        <button class="btn" id="findGameBtn">🔍 Найти игру</button>
        <button class="btn btn-secondary" id="cancelGameBtn" style="display:none;">❌ Отменить</button>
        <div class="room-list" id="roomList"></div>
      </div>
    </div>
  </div>

  <script>
    // ====== КОНФИГУРАЦИЯ ======
    const API_BASE = 'https://skymutant.cc.cd';
    const WS_URL = 'wss://skymutant.cc.cd';
    let token = localStorage.getItem('skyid_token') || null;
    let username = localStorage.getItem('skyid_login') || null;
    let ws = null;
    let currentGame = 'tictac';
    let currentRoomId = null;
    let isSearching = false;
    let isMyTurn = false;

    // ====== ЭЛЕМЕНТЫ UI ======
    const userInfoEl = document.getElementById('userInfo');
    const gameStatus = document.getElementById('gameStatus');
    const gameBoard = document.getElementById('gameBoard');
    const findGameBtn = document.getElementById('findGameBtn');
    const cancelGameBtn = document.getElementById('cancelGameBtn');
    const roomListEl = document.getElementById('roomList');

    // ====== АВТОРИЗАЦИЯ ======
    async function initAuth() {
      if (!token) {
        token = localStorage.getItem('skyid_token');
        if (!token) {
          userInfoEl.textContent = '❌ Не авторизован';
          // Запрашиваем логин/пароль (упрощённо)
          const login = prompt('Введите логин SkyID:');
          const password = prompt('Введите пароль:');
          if (login && password) {
            try {
              const payload = await encryptPayload({ login, password });
              const res = await fetch(`${API_BASE}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ data: payload })
              });
              const json = await res.json();
              const data = await decryptPayload(json.data);
              token = data.jwt || data.token;
              localStorage.setItem('skyid_token', token);
              localStorage.setItem('skyid_login', login);
              location.reload();
            } catch (e) { alert('Ошибка входа: ' + e.message); }
          }
          return false;
        }
      }

      try {
        // Используем GET /gaverify
        const res = await fetch(`${API_BASE}/gaverify`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('Invalid token');
        const data = await res.json();
        username = data.login || data.skyid || 'Игрок';
        userInfoEl.textContent = `👤 ${username}`;
        localStorage.setItem('skyid_login', username);
        return true;
      } catch (e) {
        userInfoEl.textContent = '❌ Ошибка авторизации';
        return false;
      }
    }

    // ====== WEBSOCKET ======
    function connectWS() {
      ws = new WebSocket(WS_URL);
      ws.onopen = () => {
        console.log('✅ WS подключён');
        if (token && username) {
          ws.send(JSON.stringify({ type: 'games_auth', token: token, username: username }));
        }
      };
      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          handleWSMessage(msg);
        } catch (e) { console.error('Ошибка парсинга:', e); }
      };
      ws.onclose = () => setTimeout(connectWS, 3000);
      ws.onerror = (err) => console.error('WS ошибка:', err);
    }

    function sendWS(type, data = {}) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type, ...data }));
      }
    }

    function handleWSMessage(msg) {
      console.log('📨 WS:', msg);
      switch (msg.type) {
        case 'games_auth_ok':
          console.log('✅ Авторизован в играх');
          updateRooms();
          break;
        case 'games_room_list':
          renderRooms(msg.rooms);
          break;
        case 'games_room_created':
          if (msg.waiting) {
            gameStatus.textContent = '⏳ Ожидание соперника...';
            isSearching = true;
            findGameBtn.disabled = true;
            cancelGameBtn.style.display = 'inline-block';
          } else {
            currentRoomId = msg.roomId;
            gameStatus.textContent = `Игра началась! Вы играете за ${msg.turn === username ? 'первого' : 'второго'}`;
            renderBoard(msg.gameType, msg.state);
            isSearching = false;
            findGameBtn.disabled = false;
            cancelGameBtn.style.display = 'none';
            updateMyTurn(msg.turn === username);
          }
          break;
        case 'games_room_joined':
          currentRoomId = msg.roomId;
          gameStatus.textContent = `Игра началась! Вы играете за ${msg.turn === username ? 'первого' : 'второго'}`;
          renderBoard(msg.gameType, msg.state);
          updateMyTurn(msg.turn === username);
          break;
        case 'games_state_update':
          renderBoard(currentGame, msg.state);
          updateMyTurn(msg.turn === username);
          if (msg.gameOver) {
            gameStatus.textContent = msg.winner ? `🏁 Победил ${msg.winner}` : '🏁 Игра окончена';
          }
          break;
        case 'games_chat':
          // Пока игнорируем, но можно добавить чат
          break;
        case 'games_error':
          gameStatus.textContent = `❌ ${msg.message}`;
          break;
        default:
          console.log('Неизвестное сообщение:', msg);
      }
    }

    // ====== ИГРЫ ======
    function renderBoard(gameType, state) {
      if (gameType !== 'tictac') {
        gameBoard.innerHTML = `<div style="color:#8899cc;">Игра ${gameType} в разработке...</div>`;
        return;
      }
      // Крестики-нолики
      const board = state.board || Array(9).fill(null);
      let html = `<div class="board">`;
      board.forEach((cell, i) => {
        html += `<div class="cell" data-index="${i}" onclick="makeMove(${i})">${cell || ''}</div>`;
      });
      html += `</div>`;
      gameBoard.innerHTML = html;
    }

    function makeMove(index) {
      if (!currentRoomId || !isMyTurn) return;
      sendWS('games_move', { roomId: currentRoomId, move: { index } });
    }

    function updateMyTurn(turn) {
      isMyTurn = turn;
      if (currentRoomId) {
        gameStatus.textContent = isMyTurn ? 'Ваш ход' : 'Ход соперника';
      }
    }

    function renderRooms(rooms) {
      roomListEl.innerHTML = '';
      if (!rooms || rooms.length === 0) {
        roomListEl.innerHTML = '<div style="color:#8899cc;padding:0.5rem;">Нет активных комнат</div>';
        return;
      }
      rooms.forEach(room => {
        const div = document.createElement('div');
        div.className = 'room-item';
        const players = room.players.join(', ');
        div.innerHTML = `
          <span>${room.gameType} (${players || 'ожидание'})</span>
          <button onclick="joinRoom('${room.roomId}')">Присоединиться</button>
        `;
        roomListEl.appendChild(div);
      });
    }

    function updateRooms() {
      sendWS('games_list_rooms');
    }

    function findGame() {
      if (isSearching) return;
      sendWS('games_create_room', { gameType: currentGame });
    }

    function cancelSearch() {
      if (!isSearching) return;
      isSearching = false;
      findGameBtn.disabled = false;
      cancelGameBtn.style.display = 'none';
      gameStatus.textContent = 'Поиск отменён';
      // Отправляем leave, чтобы выйти из очереди
      sendWS('games_leave_room', { roomId: 'waiting' });
    }

    function joinRoom(roomId) {
      sendWS('games_join_room', { roomId });
    }

    // ====== СОБЫТИЯ ======
    document.querySelectorAll('.game-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.game-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentGame = btn.dataset.game;
        // Если есть комната, покидаем
        if (currentRoomId) {
          sendWS('games_leave_room', { roomId: currentRoomId });
          currentRoomId = null;
        }
        gameBoard.innerHTML = `<div style="color:#8899cc;">Выберите игру и найдите соперника</div>`;
        gameStatus.textContent = `Выбрана игра: ${btn.textContent}`;
        updateRooms();
      });
    });

    findGameBtn.addEventListener('click', findGame);
    cancelGameBtn.addEventListener('click', cancelSearch);

    // Обновляем список комнат каждые 5 секунд
    setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        sendWS('games_list_rooms');
      }
    }, 5000);

    // ====== ИНИЦИАЛИЗАЦИЯ ======
    (async function init() {
      const authOk = await initAuth();
      if (!authOk) return;
      connectWS();
    })();

    // ====== ШИФРОВАНИЕ ======
    const SECRET_KEY_BASE64 = "BLx5Vp7U1c8dR2mQkG4fJ6yA9tC3bF0zH7iL2nM5oP8=";
    async function getKey() {
      const k = Uint8Array.from(atob(SECRET_KEY_BASE64), c => c.charCodeAt(0));
      return crypto.subtle.importKey('raw', k, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
    }
    async function encryptPayload(obj) {
      const key = await getKey();
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const enc = new TextEncoder().encode(JSON.stringify(obj));
      const c = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc);
      const combo = new Uint8Array(iv.byteLength + c.byteLength);
      combo.set(iv);
      combo.set(new Uint8Array(c), iv.byteLength);
      return btoa(String.fromCharCode(...combo));
    }
    async function decryptPayload(b64) {
      const key = await getKey();
      const combo = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      const iv = combo.slice(0, 12);
      const data = combo.slice(12);
      const dec = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
      return JSON.parse(new TextDecoder().decode(dec));
    }
  </script>
</body>
</html>
