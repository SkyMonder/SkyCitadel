<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkySocial</title>
  <style>
    :root {
      --bg: #0a0f1e; --panel: #111827; --card: #1a233a;
      --border: #2a3450; --text: #e0e8ff; --accent: #5f7ecf;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }
    .login-screen { position: absolute; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 20; }
    .login-box { background: var(--card); padding: 2rem; border-radius: 20px; border: 1px solid var(--border); width: 300px; text-align: center; }
    .login-box input { width: 100%; padding: 0.7rem; margin: 0.5rem 0; background: #0d1225; border: 1px solid var(--border); color: white; border-radius: 10px; }
    .login-box button { width: 100%; padding: 0.7rem; background: var(--accent); border: none; color: white; border-radius: 10px; cursor: pointer; font-weight: bold; }
    .error { color: #f48024; font-size: 0.8rem; margin-top: 0.5rem; }
    .app { display: none; width: 100%; height: 100%; flex-direction: column; }
    .header { padding: 1rem; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .content { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
    .post { background: var(--card); padding: 1rem; border-radius: 12px; border: 1px solid var(--border); }
    .post-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
    .post-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; }
    .post-author { font-weight: bold; }
    .post-text { margin-bottom: 0.5rem; }
    .post-actions { display: flex; gap: 0.5rem; font-size: 0.85rem; }
    .btn { background: var(--accent); border: none; color: white; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; }
    .new-post { display: flex; gap: 0.5rem; padding: 0.5rem; background: var(--card); border-radius: 12px; }
    .new-post textarea { flex: 1; padding: 0.5rem; background: #0d1225; border: 1px solid var(--border); color: white; border-radius: 8px; resize: vertical; min-height: 60px; }
    .profile-panel { background: var(--card); padding: 1rem; border-radius: 12px; }
  </style>
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-box">
      <h3>Вход через SkyID</h3>
      <input type="text" id="loginInput" placeholder="Логин">
      <input type="password" id="passInput" placeholder="Пароль">
      <button id="loginBtn">Войти</button>
      <div class="error" id="loginError"></div>
      <p style="margin-top:0.8rem; font-size:0.8rem; color:#8899cc;">
        Нет аккаунта? <a href="#" id="registerLink" style="color:#5f7ecf;">Зарегистрировать SkyID</a>
      </p>
    </div>
  </div>

  <div class="app" id="app">
    <div class="header">
      <span>👥 SkySocial</span>
      <div>
        <button class="btn" id="profileBtn">Профиль</button>
        <button class="btn" id="logoutBtn">Выход</button>
      </div>
    </div>
    <div class="content" id="content">
      <div class="new-post">
        <textarea id="postText" placeholder="Что нового?"></textarea>
        <button class="btn" id="sendPost">➤</button>
      </div>
      <div id="postsContainer"></div>
    </div>
    <div class="profile-panel" id="profilePanel" style="display:none;">
      <h3>Мой профиль</h3>
      <input type="text" id="profileName" placeholder="Имя" style="width:100%; padding:0.5rem; margin-top:0.5rem; background:#0d1225; border:1px solid var(--border); color:white; border-radius:6px;">
      <input type="text" id="profileBio" placeholder="О себе" style="width:100%; padding:0.5rem; margin-top:0.5rem; background:#0d1225; border:1px solid var(--border); color:white; border-radius:6px;">
      <button class="btn" id="saveProfile" style="width:100%; margin-top:0.5rem;">Сохранить</button>
      <button class="btn" id="closeProfile" style="width:100%; margin-top:0.3rem; background:#444;">Закрыть</button>
    </div>
  </div>

  <script>
    const SKYID_URL = 'https://skybiduid.onrender.com';   // SkyID
    const SOCIAL_API = 'https://skysocial-128o.onrender.com'; // соцсеть

    // ========== Функции шифрования (как в index.html) ==========
    const SECRET_KEY_BASE64 = "BLx5Vp7U1c8dR2mQkG4fJ6yA9tC3bF0zH7iL2nM5oP8=";
    async function getKey() {
      const keyBytes = Uint8Array.from(atob(SECRET_KEY_BASE64), c => c.charCodeAt(0));
      return await crypto.subtle.importKey('raw', keyBytes, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
    }
    async function encryptPayload(plainObj) {
      const key = await getKey();
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encoded = new TextEncoder().encode(JSON.stringify(plainObj));
      const cipherBuffer = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encoded);
      const combined = new Uint8Array(iv.byteLength + cipherBuffer.byteLength);
      combined.set(iv, 0);
      combined.set(new Uint8Array(cipherBuffer), iv.byteLength);
      return btoa(String.fromCharCode(...combined));
    }
    async function decryptPayload(combinedBase64) {
      const key = await getKey();
      const combined = Uint8Array.from(atob(combinedBase64), c => c.charCodeAt(0));
      const iv = combined.slice(0, 12);
      const data = combined.slice(12);
      const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
      return JSON.parse(new TextDecoder().decode(decrypted));
    }

    let token = localStorage.getItem('skysocial_token') || null;

    // Автологин при наличии токена
    (async () => {
      if (token) {
        try {
          const res = await fetch(`${SKYID_URL}/me`, { headers: { Authorization: `Bearer ${token}` } });
          if (res.ok) { showApp(); loadPosts(); }
          else { token = null; localStorage.removeItem('skysocial_token'); }
        } catch (e) {}
      }
    })();

    // Вход
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const login = document.getElementById('loginInput').value.trim();
      const password = document.getElementById('passInput').value;
      const errorDiv = document.getElementById('loginError');
      errorDiv.textContent = '';
      if (!login || !password) return errorDiv.textContent = 'Заполни поля';
      try {
        // Шифруем запрос
        const encrypted = await encryptPayload({ login, password });
        const res = await fetch(`${SKYID_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: encrypted })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || 'Ошибка входа');
        }
        const json = await res.json();
        if (!json.data) throw new Error('Нет зашифрованного ответа');
        const data = await decryptPayload(json.data);
        token = data.token;
        localStorage.setItem('skysocial_token', token);
        showApp();
        loadPosts();
      } catch (e) { errorDiv.textContent = e.message; }
    });

    // Регистрация
    document.getElementById('registerLink').addEventListener('click', async (e) => {
      e.preventDefault();
      const login = document.getElementById('loginInput').value.trim();
      const password = document.getElementById('passInput').value;
      if (!login || !password) return document.getElementById('loginError').textContent = 'Введите логин и пароль';
      try {
        const encrypted = await encryptPayload({ login, password });
        const res = await fetch(`${SKYID_URL}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: encrypted })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || 'Ошибка регистрации');
        }
        const json = await res.json();
        if (!json.data) throw new Error('Нет зашифрованного ответа');
        const data = await decryptPayload(json.data);
        alert('Регистрация успешна! Ваш SkyID: ' + data.skyid + '\nТеперь войдите.');
        document.getElementById('loginInput').value = '';
        document.getElementById('passInput').value = '';
      } catch (e) { document.getElementById('loginError').textContent = e.message; }
    });

    function showApp() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
    }
    function hideApp() {
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      token = null; localStorage.removeItem('skysocial_token'); hideApp();
    });

    async function loadPosts() {
      const container = document.getElementById('postsContainer');
      try {
        const res = await fetch(`${SOCIAL_API}/posts`, { headers: { Authorization: `Bearer ${token}` } });
        const posts = await res.json();
        container.innerHTML = posts.map(post => `
          <div class="post">
            <div class="post-header">
              <div class="post-avatar">👤</div>
              <div class="post-author">${escapeHtml(post.author)}</div>
              <span style="margin-left:auto; font-size:0.7rem; color:#8899cc;">${new Date(post.created).toLocaleString()}</span>
            </div>
            <div class="post-text">${escapeHtml(post.text)}</div>
            <div class="post-actions">
              <button class="btn" onclick="likePost('${post.id}')">❤️ ${post.likes.length}</button>
            </div>
          </div>
        `).join('');
      } catch (e) { container.innerHTML = '<p>Ошибка загрузки постов</p>'; }
    }

    document.getElementById('sendPost').addEventListener('click', async () => {
      const text = document.getElementById('postText').value.trim();
      if (!text) return;
      await fetch(`${SOCIAL_API}/posts`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ text })
      });
      document.getElementById('postText').value = '';
      loadPosts();
    });

    window.likePost = async (postId) => {
      await fetch(`${SOCIAL_API}/posts/${postId}/like`, { method: 'POST', headers: { Authorization: `Bearer ${token}` } });
      loadPosts();
    };

    // Профиль (упрощённо)
    document.getElementById('profileBtn').addEventListener('click', async () => {
      const panel = document.getElementById('profilePanel');
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
      if (panel.style.display === 'block') {
        const res = await fetch(`${SOCIAL_API}/profile`, { headers: { Authorization: `Bearer ${token}` } });
        const profile = await res.json();
        document.getElementById('profileName').value = profile.name || '';
        document.getElementById('profileBio').value = profile.bio || '';
      }
    });
    document.getElementById('closeProfile').addEventListener('click', () => {
      document.getElementById('profilePanel').style.display = 'none';
    });
    document.getElementById('saveProfile').addEventListener('click', async () => {
      const name = document.getElementById('profileName').value.trim();
      const bio = document.getElementById('profileBio').value.trim();
      await fetch(`${SOCIAL_API}/profile`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ name, bio })
      });
      alert('Профиль обновлён');
    });

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
  </script>
</body>
</html>
