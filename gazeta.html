<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Газета SkyCitadel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #2c2c2c;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Times New Roman', Times, serif;
      padding: 20px;
    }
    .newspaper-container {
      background: #f4f0eb;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      padding: 20px;
      max-width: 800px;
      width: 100%;
      position: relative;
    }
    .newspaper-header {
      text-align: center;
      border-bottom: 3px double #333;
      padding-bottom: 10px;
      margin-bottom: 20px;
      font-size: 2.2rem;
      font-weight: bold;
      letter-spacing: 4px;
      color: #1a1a1a;
      font-family: 'Times New Roman', serif;
      text-transform: uppercase;
    }
    .newspaper-header small {
      font-size: 0.8rem;
      display: block;
      font-weight: normal;
      letter-spacing: 2px;
      color: #555;
    }
    .page-container {
      position: relative;
      min-height: 500px;
      perspective: 1200px;
    }
    .page-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .page {
      position: absolute;
      width: 100%;
      backface-visibility: hidden;
      background: white;
      border-radius: 8px;
      padding: 30px 25px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      min-height: 450px;
      display: flex;
      flex-direction: column;
    }
    .page-front {
      transform: rotateY(0deg);
    }
    .page-back {
      transform: rotateY(180deg);
    }
    .page.flipped {
      transform: rotateY(-180deg);
    }
    /* Анимация перелистывания */
    .page-wrapper.flipping-forward .page-front {
      transform: rotateY(-180deg);
    }
    .page-wrapper.flipping-forward .page-back {
      transform: rotateY(0deg);
    }
    .page-wrapper.flipping-backward .page-front {
      transform: rotateY(180deg);
    }
    .page-wrapper.flipping-backward .page-back {
      transform: rotateY(0deg);
    }

    .news-title {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
      line-height: 1.2;
      color: #1a1a1a;
    }
    .news-date {
      font-size: 0.85rem;
      color: #777;
      margin-bottom: 1rem;
      border-bottom: 1px solid #ddd;
      padding-bottom: 0.5rem;
    }
    .news-image {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 1rem;
      background: #eaeaea;
    }
    .news-text {
      font-size: 1rem;
      line-height: 1.6;
      color: #222;
      flex: 1;
      overflow-y: auto;
      max-height: 300px;
      padding-right: 5px;
    }
    .news-text::-webkit-scrollbar {
      width: 4px;
    }
    .news-text::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 2px;
    }

    /* Навигация */
    .nav-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      gap: 10px;
    }
    .nav-btn {
      background: #333;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 0.2s;
      font-family: 'Times New Roman', serif;
    }
    .nav-btn:hover:not(:disabled) {
      background: #555;
    }
    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .page-indicator {
      font-size: 1rem;
      color: #555;
      font-family: 'Times New Roman', serif;
    }

    /* Адаптив */
    @media (max-width: 600px) {
      .newspaper-container {
        padding: 10px;
      }
      .newspaper-header {
        font-size: 1.6rem;
      }
      .page {
        padding: 20px 15px;
      }
      .news-title {
        font-size: 1.4rem;
      }
      .news-text {
        font-size: 0.9rem;
        max-height: 200px;
      }
    }
  </style>
</head>
<body>
  <div class="newspaper-container">
    <div class="newspaper-header">
      📰 Ежедневная газета
      <small>Свежие новости из Интерфакса</small>
    </div>

    <div class="page-container" id="pageContainer">
      <div class="page-wrapper" id="pageWrapper">
        <!-- Страницы будут добавлены JS -->
      </div>
    </div>

    <div class="nav-controls">
      <button class="nav-btn" id="prevBtn" disabled>◀ Назад</button>
      <span class="page-indicator" id="pageIndicator">Страница 1 из 1</span>
      <button class="nav-btn" id="nextBtn">Вперед ▶</button>
    </div>
  </div>

  <script>
    // ====== ПРОКСИ ======
    const PROXY_URL = 'https://skycitadel.cc.cd/gazeta.html'; // заглушка, но мы используем прямой RSS через прокси
    const RSS_URL = 'https://www.interfax.ru/rss';

    // ====== СОСТОЯНИЕ ======
    let articles = [];
    let currentPage = 0;
    let totalPages = 0;
    let isFlipping = false;

    const wrapper = document.getElementById('pageWrapper');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const indicator = document.getElementById('pageIndicator');

    // ====== ЗАГРУЗКА НОВОСТЕЙ ======
    async function loadNews() {
      try {
        // Используем наш прокси (или прямой запрос, если CORS разрешён)
        const proxy = 'https://api.allorigins.win/raw?url=';
        const response = await fetch(proxy + encodeURIComponent(RSS_URL));
        const text = await response.text();
        const parser = new DOMParser();
        const xml = parser.parseFromString(text, 'text/xml');
        const items = xml.querySelectorAll('item');
        
        articles = [];
        items.forEach(item => {
          const title = item.querySelector('title')?.textContent || 'Без заголовка';
          const link = item.querySelector('link')?.textContent || '#';
          const pubDate = item.querySelector('pubDate')?.textContent;
          const description = item.querySelector('description')?.textContent || '';
          // Пытаемся извлечь картинку из description
          let imageUrl = null;
          const imgMatch = description.match(/<img[^>]+src="([^">]+)"/);
          if (imgMatch) imageUrl = imgMatch[1];
          // Очистка текста от HTML
          const textContent = description.replace(/<[^>]+>/g, '').trim();
          articles.push({
            title,
            link,
            pubDate: pubDate ? new Date(pubDate).toLocaleDateString('ru-RU') : '',
            text: textContent || 'Подробнее по ссылке...',
            image: imageUrl || null
          });
        });

        if (articles.length === 0) {
          // Если нет новостей, показываем заглушку
          articles = [{
            title: 'Новости не загрузились',
            text: 'Попробуйте обновить страницу позже.',
            pubDate: '',
            image: null,
            link: '#'
          }];
        }
        renderPages();
      } catch (error) {
        console.error('Ошибка загрузки RSS:', error);
        articles = [{
          title: 'Ошибка загрузки',
          text: 'Не удалось загрузить новости. Проверьте соединение.',
          pubDate: '',
          image: null,
          link: '#'
        }];
        renderPages();
      }
    }

    // ====== РЕНДЕР СТРАНИЦ ======
    function renderPages() {
      wrapper.innerHTML = '';
      totalPages = articles.length;
      articles.forEach((article, index) => {
        const pageDiv = document.createElement('div');
        pageDiv.className = 'page' + (index === 0 ? ' page-front' : ' page-back');
        if (index > 0) pageDiv.style.display = 'none'; // скрываем все, кроме первой
        pageDiv.innerHTML = `
          <div class="news-title">${escapeHtml(article.title)}</div>
          <div class="news-date">${article.pubDate || 'Сегодня'}</div>
          ${article.image ? `<img class="news-image" src="${article.image}" alt="Иллюстрация" loading="lazy">` : ''}
          <div class="news-text">${escapeHtml(article.text)}</div>
        `;
        wrapper.appendChild(pageDiv);
      });
      currentPage = 0;
      showPage(0);
    }

    // ====== ПОКАЗ СТРАНИЦЫ ======
    function showPage(index) {
      const pages = wrapper.querySelectorAll('.page');
      if (!pages.length) return;
      
      // Скрываем все страницы
      pages.forEach((p, i) => {
        p.style.display = 'none';
      });
      // Показываем текущую страницу
      const current = pages[index];
      if (current) current.style.display = 'flex';
      
      // Обновляем индикатор
      indicator.textContent = `Страница ${index+1} из ${totalPages}`;
      prevBtn.disabled = (index === 0);
      nextBtn.disabled = (index === totalPages - 1);
    }

    // ====== ПЕРЕЛИСТЫВАНИЕ С АНИМАЦИЕЙ ======
    function flipPage(direction) {
      if (isFlipping) return;
      const newPage = currentPage + direction;
      if (newPage < 0 || newPage >= totalPages) return;
      isFlipping = true;

      const pages = wrapper.querySelectorAll('.page');
      const current = pages[currentPage];
      const next = pages[newPage];

      // Подготавливаем следующую страницу (она должна быть видимой)
      next.style.display = 'flex';
      next.style.transform = direction === 1 ? 'rotateY(180deg)' : 'rotateY(-180deg)';

      // Применяем анимацию
      const wrapperEl = wrapper;
      wrapperEl.style.transition = 'transform 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
      wrapperEl.style.transform = direction === 1 ? 'rotateY(-180deg)' : 'rotateY(180deg)';

      setTimeout(() => {
        // После завершения анимации меняем местами страницы
        wrapperEl.style.transition = 'none';
        wrapperEl.style.transform = 'rotateY(0deg)';
        // Прячем старую страницу
        current.style.display = 'none';
        // Убираем трансформацию у новой
        next.style.transform = 'rotateY(0deg)';
        // Обновляем индекс
        currentPage = newPage;
        showPage(currentPage);
        isFlipping = false;
      }, 600);
    }

    // ====== ОБРАБОТЧИКИ КНОПОК ======
    prevBtn.addEventListener('click', () => flipPage(-1));
    nextBtn.addEventListener('click', () => flipPage(1));

    // ====== ВСПОМОГАТЕЛЬНАЯ ======
    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/[&<>"']/g, m => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[m]);
    }

    // ====== ЗАПУСК ======
    loadNews();
  </script>
</body>
</html>
