<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Газета • Ежедневные новости</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #3a2e2a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Georgia', 'Times New Roman', serif;
      padding: 20px;
      user-select: none;
      flex-direction: column;
      gap: 20px;
    }
    /* ─── Кнопка возврата ─── */
    .back-bar {
      width: 100%;
      max-width: 1050px;
      display: flex;
      justify-content: flex-start;
      padding: 0 8px;
    }
    .back-btn {
      background: #fcf6ed;
      border: 1px solid #b8a898;
      color: #2a221c;
      padding: 6px 18px;
      font-family: 'Arial', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      background: linear-gradient(145deg, #fcf6ed, #f0e8dc);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .back-btn:hover {
      background: #2a221c;
      color: #fcf6ed;
      border-color: #2a221c;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }

    .book-wrapper {
      perspective: 2200px;
      width: 100%;
      max-width: 1050px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }
    .book {
      position: relative;
      width: 100%;
      aspect-ratio: 1.45 / 1;
      transform-style: preserve-3d;
      border-radius: 6px 18px 18px 6px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.7), 0 10px 20px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,215,175,0.15);
    }
    .page {
      position: absolute;
      top:0; left:0;
      width:100%; height:100%;
      transform-style: preserve-3d;
      transform-origin: left center;
      transition: transform 0.85s cubic-bezier(0.645, 0.045, 0.355, 1);
      backface-visibility: hidden;
      border-radius: 0 12px 12px 0;
      will-change: transform;
    }
    .page-front, .page-back {
      position: absolute;
      top:0; left:0;
      width:100%; height:100%;
      backface-visibility: hidden;
      border-radius: 0 12px 12px 0;
      background: #fcf6ed;
      padding: 20px 24px 18px 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background-image: radial-gradient(ellipse at 20% 50%, rgba(235,215,190,0.12) 0%, transparent 70%);
    }
    .page-back {
      transform: rotateY(180deg);
      background: #f8f0e4;
    }
    .page.flipped { transform: rotateY(-180deg); }
    .newspaper {
      width:100%; height:100%;
      display: flex;
      flex-direction: column;
      color: #1f1a16;
      line-height: 1.4;
    }
    .masthead {
      text-align: center;
      border-bottom: 3px double #2a221c;
      padding-bottom: 5px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    .masthead .edition {
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #5a4a3a;
      font-family: 'Arial', sans-serif;
    }
    .masthead h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-family: 'Times New Roman', serif;
      color: #1a1410;
      line-height: 1.1;
    }
    .masthead .date-line {
      display: flex;
      justify-content: space-between;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #4a3d32;
      border-top: 1px solid #d4c8b8;
      padding-top: 3px;
      margin-top: 2px;
      font-family: 'Arial', sans-serif;
    }
    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      flex: 1;
      min-height: 0;
    }
    .column {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
    }
    .article-card {
      border-bottom: 1px solid #e4d8ca;
      padding-bottom: 5px;
      margin-bottom: 3px;
    }
    .article-card:last-child { border-bottom: none; padding-bottom:0; }
    .article-card .headline {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.2;
      color: #1a1410;
      font-family: 'Georgia', serif;
      cursor: pointer;
      transition: color 0.2s;
    }
    .article-card .headline:hover { color: #7a3f2a; }
    .article-card .headline a { color: inherit; text-decoration: none; }
    .article-card .meta {
      font-size: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #7a6a5a;
      font-family: 'Arial', sans-serif;
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 1px;
    }
    .article-card .meta .tag {
      background: #d4c8b8;
      color: #2a221c;
      padding: 0 6px;
      border-radius: 2px;
      font-size: 0.5rem;
    }
    .article-card .summary {
      font-size: 0.7rem;
      line-height: 1.3;
      color: #2d241e;
      font-family: 'Georgia', serif;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .article-card.featured .headline { font-size: 1.15rem; }
    .article-card.featured .summary { font-size: 0.78rem; -webkit-line-clamp: 3; }
    .article-card.featured { border-bottom: 2px solid #2a221c; padding-bottom: 6px; margin-bottom: 5px; }
    .page-number {
      text-align: center;
      font-size: 0.55rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #7a6a5a;
      font-family: 'Arial', sans-serif;
      border-top: 1px solid #e4d8ca;
      padding-top: 5px;
      margin-top: auto;
      flex-shrink: 0;
    }
    .nav-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      width: 100%;
      max-width: 480px;
      padding: 8px 0;
    }
    .nav-btn {
      background: #fcf6ed;
      border: 1px solid #b8a898;
      color: #2a221c;
      padding: 8px 24px;
      font-family: 'Arial', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      background: linear-gradient(145deg, #fcf6ed, #f0e8dc);
    }
    .nav-btn:hover { background: #2a221c; color: #fcf6ed; border-color: #2a221c; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.25); }
    .nav-btn:disabled { opacity:0.3; pointer-events:none; transform:none !important; }
    .nav-btn .icon { font-size:1rem; line-height:1; }
    .page-indicator {
      font-family: 'Arial', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 1px;
      color: #d4c8b8;
      background: rgba(0,0,0,0.2);
      padding: 4px 16px;
      border-radius: 20px;
    }
    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #5a4a3a;
      font-family: 'Georgia', serif;
      font-size: 1rem;
      gap: 10px;
    }
    .loading-state .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #e4d8ca;
      border-top: 3px solid #2a221c;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .flip-hint {
      position: absolute;
      bottom: 14px;
      right: 18px;
      font-size: 0.5rem;
      font-family: 'Arial', sans-serif;
      color: #b8a898;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: rgba(252,246,237,0.6);
      padding: 2px 10px;
      border-radius: 12px;
      backdrop-filter: blur(2px);
      pointer-events: none;
      opacity: 0.6;
      z-index: 10;
    }
    @media (max-width: 820px) {
      .book { aspect-ratio: 0.85 / 1; }
      .page-front, .page-back { padding: 14px 14px 12px; }
      .masthead h1 { font-size: 1.8rem; letter-spacing: 2px; }
      .columns { grid-template-columns: 1fr; gap: 8px; }
      .article-card .headline { font-size: 0.85rem; }
      .article-card .summary { font-size: 0.65rem; }
      .article-card.featured .headline { font-size: 1rem; }
      .article-card.featured .summary { font-size: 0.7rem; }
    }
    @media (max-width: 480px) {
      body { padding: 10px; }
      .book { aspect-ratio: 0.7 / 1; }
      .page-front, .page-back { padding: 10px 10px 8px; }
      .masthead h1 { font-size: 1.4rem; letter-spacing: 1px; }
      .masthead .edition { font-size: 0.5rem; }
      .article-card .headline { font-size: 0.75rem; }
      .article-card .summary { font-size: 0.6rem; -webkit-line-clamp: 2; }
      .article-card.featured .headline { font-size: 0.9rem; }
      .article-card.featured .summary { font-size: 0.65rem; -webkit-line-clamp: 2; }
      .nav-btn { padding: 6px 16px; font-size: 0.6rem; }
      .page-indicator { font-size: 0.55rem; padding: 2px 10px; }
    }
  </style>
</head>
<body>

  <!-- ====== Кнопка возврата ====== -->
  <div class="back-bar">
    <a href="/" class="back-btn">🏰 Вернуться в крепость</a>
  </div>

  <div class="book-wrapper">
    <div class="book" id="book">
      <div id="pagesContainer" style="width:100%;height:100%;position:relative;transform-style:preserve-3d;"></div>
      <div class="flip-hint">✦ листай</div>
    </div>
    <div class="nav-controls">
      <button class="nav-btn" id="prevBtn" disabled><span class="icon">◀</span> Назад</button>
      <span class="page-indicator" id="pageIndicator">1 / 1</span>
      <button class="nav-btn" id="nextBtn">Вперёд <span class="icon">▶</span></button>
    </div>
  </div>

  <script>
    // ─── Источники (три официальные ленты) ────────────────────────────────
    const RSS_FEEDS = [
      'https://tass.ru/rss/v2.xml',
      'https://ria.ru/export/rss2/archive/index.xml',
      'https://www.interfax.ru/rss.asp'
    ];

    const ARTICLES_PER_PAGE = 4;   // 4 статьи на разворот (по 2 в колонку)
    const ARTICLES_PER_COL = 2;

    let allArticles = [];
    let currentPage = 0;
    let totalPages = 0;
    let isFlipping = false;

    const book = document.getElementById('book');
    const pagesContainer = document.getElementById('pagesContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageIndicator = document.getElementById('pageIndicator');

    // ─── Загрузка RSS ──────────────────────────────────────────────────────
    async function fetchRSS(url) {
      try {
        const resp = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`);
        const data = await resp.json();
        return data.items || [];
      } catch (e) { console.warn('RSS error:', url, e); return []; }
    }

    async function loadAllNews() {
      const results = await Promise.all(RSS_FEEDS.map(fetchRSS));
      const flat = results.flat();
      flat.sort((a,b) => new Date(b.pubDate) - new Date(a.pubDate));
      return flat;
    }

    // ─── Отрисовка разворота ──────────────────────────────────────────────
    function renderSpread(articles, pageNum, total) {
      if (!articles || !articles.length) {
        return `<div class="newspaper">
          <div class="masthead"><div class="edition">Ежедневный выпуск</div><h1>ГАЗЕТА</h1>
          <div class="date-line"><span>${formatDate(new Date())}</span><span>№ ${String(pageNum).padStart(3,'0')}</span></div></div>
          <div style="flex:1;display:flex;align-items:center;justify-content:center;color:#8a7a6a;font-style:italic;">Нет статей</div>
          <div class="page-number">Стр. ${pageNum} / ${total}</div>
        </div>`;
      }

      const col1 = articles.slice(0, ARTICLES_PER_COL);
      const col2 = articles.slice(ARTICLES_PER_COL, ARTICLES_PER_COL*2);

      const renderCol = (items, isFirst) => items.map((item, idx) => {
        const isFeatured = idx === 0 && isFirst;
        const title = item.title || 'Без заголовка';
        const link = item.link || '#';
        const pubDate = item.pubDate ? new Date(item.pubDate) : new Date();
        let desc = (item.description || '').replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
        if (desc.length > 120) desc = desc.slice(0,120)+'…';
        const tag = (item.categories && item.categories.length) ? item.categories[0] : 'Новость';
        return `<div class="article-card ${isFeatured?'featured':''}">
          <div class="headline"><a href="${link}" target="_blank">${title}</a></div>
          <div class="meta"><span>${formatTime(pubDate)}</span><span class="tag">${tag}</span></div>
          <div class="summary">${desc || 'Подробности в источнике.'}</div>
        </div>`;
      }).join('');

      const col1html = renderCol(col1, true);
      const col2html = renderCol(col2, false) || `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#b8a898;font-style:italic;font-size:0.7rem;">— конец полосы —</div>`;

      return `<div class="newspaper">
        <div class="masthead">
          <div class="edition">Ежедневный выпуск</div>
          <h1>ГАЗЕТА</h1>
          <div class="date-line"><span>${formatDate(new Date())}</span><span>№ ${String(pageNum).padStart(3,'0')}</span></div>
        </div>
        <div class="columns">
          <div class="column">${col1html}</div>
          <div class="column">${col2html}</div>
        </div>
        <div class="page-number">Стр. ${pageNum} / ${total}</div>
      </div>`;
    }

    // ─── Построение всех страниц ──────────────────────────────────────────
    function buildPages(articles) {
      pagesContainer.innerHTML = '';
      if (!articles.length) {
        pagesContainer.innerHTML = `<div class="page-front" style="position:relative;background:#fcf6ed;display:flex;align-items:center;justify-content:center;border-radius:0 12px 12px 0;">
          <div class="loading-state"><span style="font-size:2.5rem;">📰</span><p>Нет новостей</p><small>Попробуйте обновить</small></div>
        </div>`;
        totalPages = 1; currentPage = 0; updateNav(); return;
      }

      const groups = [];
      for (let i = 0; i < articles.length; i += ARTICLES_PER_PAGE) {
        groups.push(articles.slice(i, i + ARTICLES_PER_PAGE));
      }
      totalPages = groups.length;
      currentPage = 0;

      groups.forEach((group, idx) => {
        const pageDiv = document.createElement('div');
        pageDiv.className = 'page';
        if (idx > 0) pageDiv.style.transform = 'rotateY(-180deg)';
        pageDiv.dataset.index = idx;

        const front = document.createElement('div');
        front.className = 'page-front';
        front.innerHTML = renderSpread(group, idx+1, groups.length);

        const back = document.createElement('div');
        back.className = 'page-back';
        if (idx < groups.length-1) {
          const nextGroup = groups[idx+1];
          back.innerHTML = renderSpread(nextGroup, idx+2, groups.length);
        } else {
          back.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:#5a4a3a;gap:8px;">
            <span style="font-size:3rem;opacity:0.3;">◈</span>
            <p style="font-family:'Georgia',serif;font-size:1rem;letter-spacing:2px;text-transform:uppercase;color:#8a7a6a;">Конец выпуска</p>
            <small style="font-family:'Arial',sans-serif;color:#b8a898;">Ежедневная газета</small>
          </div>`;
        }

        pageDiv.appendChild(front);
        pageDiv.appendChild(back);
        pagesContainer.appendChild(pageDiv);
      });

      showPage(0);
      updateNav();
    }

    // ─── Навигация ─────────────────────────────────────────────────────────
    function showPage(index) {
      const pages = pagesContainer.querySelectorAll('.page');
      pages.forEach((p, i) => {
        if (i < index) { p.classList.add('flipped'); p.style.transform = 'rotateY(-180deg)'; }
        else if (i === index) { p.classList.remove('flipped'); p.style.transform = 'rotateY(0deg)'; }
        else { p.classList.add('flipped'); p.style.transform = 'rotateY(-180deg)'; }
      });
      currentPage = index;
      updateNav();
    }

    function flipTo(index) {
      if (isFlipping || index === currentPage || index<0 || index>=totalPages) return;
      isFlipping = true;
      const pages = pagesContainer.querySelectorAll('.page');
      const from = currentPage, to = index;

      if (to > from) {
        const cur = pages[from]; if(cur) { cur.style.transition = 'transform 0.85s cubic-bezier(0.645, 0.045, 0.355, 1)'; cur.classList.add('flipped'); cur.style.transform = 'rotateY(-180deg)'; }
        const nxt = pages[to]; if(nxt) { nxt.style.transition = 'transform 0.85s cubic-bezier(0.645, 0.045, 0.355, 1)'; nxt.classList.remove('flipped'); nxt.style.transform = 'rotateY(0deg)'; }
      } else {
        const prv = pages[to]; if(prv) { prv.style.transition = 'transform 0.85s cubic-bezier(0.645, 0.045, 0.355, 1)'; prv.classList.remove('flipped'); prv.style.transform = 'rotateY(0deg)'; }
        const cur = pages[from]; if(cur) { cur.style.transition = 'transform 0.85s cubic-bezier(0.645, 0.045, 0.355, 1)'; cur.classList.add('flipped'); cur.style.transform = 'rotateY(-180deg)'; }
      }

      currentPage = to;
      updateNav();
      setTimeout(() => {
        isFlipping = false;
        pages.forEach((p,i) => {
          if (i <= currentPage) { p.classList.add('flipped'); p.style.transform = 'rotateY(-180deg)'; }
          else { p.classList.remove('flipped'); p.style.transform = 'rotateY(0deg)'; }
        });
        const curPage = pages[currentPage];
        if (curPage) { curPage.classList.remove('flipped'); curPage.style.transform = 'rotateY(0deg)'; }
        for (let i=0; i<currentPage; i++) { const p=pages[i]; if(p){ p.classList.add('flipped'); p.style.transform='rotateY(-180deg)'; } }
        for (let i=currentPage+1; i<pages.length; i++) { const p=pages[i]; if(p){ p.classList.add('flipped'); p.style.transform='rotateY(-180deg)'; } }
        updateNav();
      }, 900);
    }

    function nextPage() { if (currentPage < totalPages-1) flipTo(currentPage+1); }
    function prevPage() { if (currentPage > 0) flipTo(currentPage-1); }
    function updateNav() {
      prevBtn.disabled = currentPage <= 0;
      nextBtn.disabled = currentPage >= totalPages-1;
      pageIndicator.textContent = `${currentPage+1} / ${totalPages}`;
    }

    // ─── Вспомогательные функции ──────────────────────────────────────────
    function formatDate(d) {
      const m = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
      return `${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()}`;
    }
    function formatTime(d) { return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

    // ─── Инициализация ────────────────────────────────────────────────────
    async function init() {
      pagesContainer.innerHTML = `<div class="page-front" style="position:relative;background:#fcf6ed;display:flex;align-items:center;justify-content:center;border-radius:0 12px 12px 0;">
        <div class="loading-state"><div class="spinner"></div><p>Загрузка новостей...</p><small>источники: ТАСС, РИА, Интерфакс</small></div>
      </div>`;
      totalPages = 1; currentPage = 0; updateNav();
      const articles = await loadAllNews();
      allArticles = articles;
      buildPages(articles);
    }

    // ─── События ──────────────────────────────────────────────────────────
    prevBtn.addEventListener('click', prevPage);
    nextBtn.addEventListener('click', nextPage);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); nextPage(); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prevPage(); }
    });
    book.addEventListener('click', (e) => {
      const rect = book.getBoundingClientRect();
      const x = e.clientX - rect.left;
      if (x > rect.width * 0.6) nextPage();
      else if (x < rect.width * 0.4) prevPage();
    });

    init();
    setInterval(init, 600000); // обновление каждые 10 минут
  </script>
</body>
</html>
