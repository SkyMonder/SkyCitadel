<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Добро пожаловать в SkyCitadel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0f1e;
      color: #e0e8ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .container {
      text-align: center;
      max-width: 500px;
      padding: 2rem;
    }
    .icon {
      font-size: 4.5rem;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #b5ceff, #5f7ecf);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.3rem;
    }
    .subtitle {
      color: #8899cc;
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .btn-primary {
      background: #5f7ecf;
      color: white;
      border: none;
      padding: 0.9rem 1.5rem;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary:hover {
      background: #7a98e8;
      transform: scale(1.02);
    }
    .btn-download {
      background: #2f4b8c;
      color: white;
      border: none;
      padding: 0.9rem 1.5rem;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-download:hover {
      background: #4a6bb0;
      transform: scale(1.02);
    }
    .platform-group {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-top: 0.5rem;
    }
    .platform-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      background: #111827;
      border: 1px solid #2a3450;
      color: #e0e8ff;
      padding: 0.9rem 1.5rem;
      border-radius: 14px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }
    .platform-btn:hover {
      background: #1f2b4a;
      border-color: #5f7ecf;
      transform: scale(1.02);
    }
    .platform-btn .emoji {
      font-size: 1.5rem;
    }
    .back-link {
      color: #5f7ecf;
      cursor: pointer;
      font-size: 0.85rem;
      margin-top: 1rem;
      display: inline-block;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: #7a98e8;
    }
    .hidden {
      display: none;
    }
    .footer {
      margin-top: 2rem;
      font-size: 0.7rem;
      color: #4a5a7a;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Шаг 1: Главный экран -->
    <div id="step1">
      <div class="icon">🛡️</div>
      <h1>ДОБРО ПОЖАЛОВАТЬ</h1>
      <h1 style="font-size:1.8rem; -webkit-text-fill-color: #b7ceff; background: none; margin-top: -5px;">В SKYCITADEL!</h1>
      <p class="subtitle">Цифровая крепость для свободных людей</p>
      <div class="btn-group">
        <button class="btn-primary" onclick="goToMain()">🚀 Продолжить в браузере</button>
        <button class="btn-download" onclick="showStep2()">📱 Скачать приложение</button>
      </div>
    </div>

    <!-- Шаг 2: Выбор платформы -->
    <div id="step2" class="hidden">
      <div class="icon">📥</div>
      <h1 style="font-size:1.6rem; -webkit-text-fill-color: #b7ceff; background: none;">Скачать SkyCitadel</h1>
      <p class="subtitle">Выберите вашу платформу</p>
      <div class="platform-group">
        <a href="https://github.com/SkyMonder/SkyCitadel/tree/main/SkyCitadel_apps/FOR%20WINDOWS" target="_blank" class="platform-btn">
          <span class="emoji">🖥️</span> Скачать для ПК (Windows)
        </a>
        <a href="https://github.com/SkyMonder/SkyCitadel/tree/main/SkyCitadel_apps/FOR%20ANDROID" target="_blank" class="platform-btn">
          <span class="emoji">📱</span> Скачать для Android (APK)
        </a>
      </div>
      <span class="back-link" onclick="showStep1()">← Назад</span>
    </div>

    <div class="footer">© 2026 SkyCitadel</div>
  </div>
  <script src="/settings-loader.js"></script>
  <script>
    function showStep1() {
      document.getElementById('step1').classList.remove('hidden');
      document.getElementById('step2').classList.add('hidden');
    }
    function showStep2() {
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('step2').classList.remove('hidden');
    }
    function goToMain() {
      localStorage.setItem('skycitadel_welcome_dismissed', 'true');
      window.location.href = '/';
    }
    // Если пользователь уже закрывал попап — сразу переходим на главную
    if (localStorage.getItem('skycitadel_welcome_dismissed') === 'true') {
      window.location.href = '/';
    }
  </script>
  <script>
  // Регистрация Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(function(registration) {
        console.log('✅ Service Worker зарегистрирован:', registration);
      })
      .catch(function(error) {
        console.warn('⚠️ Ошибка регистрации Service Worker:', error);
      });
  }
</script>
</body>
</html>
