<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поддержать SkyCitadel</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0a0f1e;
      color: #e0e8ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: #1a233a;
      border-radius: 20px;
      border: 1px solid #2a3450;
      padding: 2rem;
      text-align: center;
    }
    h1 { color: #b7ceff; margin-bottom: 0.5rem; }
    .sub { color: #8899cc; margin-bottom: 1.5rem; }
    .donate-btn {
      display: block;
      background: #2a3450;
      color: #cfdbff;
      padding: 1rem;
      border-radius: 12px;
      margin-bottom: 0.8rem;
      text-decoration: none;
      transition: 0.2s;
      font-size: 1.1rem;
    }
    .donate-btn:hover {
      background: #5f7ecf;
      color: #fff;
      transform: translateX(4px);
    }
    .back-link {
      color: #5f7ecf;
      text-decoration: none;
      margin-top: 1.5rem;
    }
    .back-link:hover { text-decoration: underline; }
  </style>
  <script src="/settings-loader.js"></script>
</head>
<body>
  <div class="container">
    <h1>☕ Поддержать SkyCitadel</h1>
    <p class="sub">Проект развивается одним человеком. Ваша поддержка помогает ему оставаться живым и свободным.</p>
    
    <a href="https://www.donationalerts.com/r/skycitadel" target="_blank" class="donate-btn">💳 DonationAlerts</a>
    
    <a href="/" class="back-link">🏰 Вернуться в крепость</a>
  </div>
</body>
</html>
