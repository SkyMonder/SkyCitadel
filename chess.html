<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyChess — Шахматный движок</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0a0f1e;
      color: #e0e8ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      padding: 0.8rem 1.5rem;
      background: #111827;
      border-bottom: 1px solid #2a3450;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .header a {
      color: #5f7ecf;
      text-decoration: none;
      font-weight: 500;
    }
    .header a:hover { text-decoration: underline; }
    .header h1 {
      color: #b7ceff;
      font-size: 1.5rem;
      font-weight: 400;
    }
    .header .badge {
      background: #2a7a2a;
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      font-size: 0.7rem;
      color: #fff;
      margin-left: 0.5rem;
    }
    .container {
      flex: 1;
      display: flex;
      gap: 1.5rem;
      padding: 1rem;
      overflow: hidden;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
    }
    .game-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #111827;
      border-radius: 12px;
      border: 1px solid #2a3450;
      padding: 1rem;
      min-width: 400px;
      flex: 1;
      max-width: 700px;
    }
    #board-container {
      width: 100%;
      max-width: 560px;
      aspect-ratio: 1/1;
    }
    .status {
      margin-top: 0.8rem;
      font-size: 1.1rem;
      color: #b7ceff;
      text-align: center;
      min-height: 2rem;
    }
    .controls {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      background: #5f7ecf;
      border: none;
      color: #fff;
      padding: 0.4rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn:hover { background: #7a9aef; }
    .btn-secondary { background: #2a3450; }
    .btn-secondary:hover { background: #3a4a6a; }
    .btn-danger { background: #c44; }
    .btn-danger:hover { background: #a33; }
    .btn:disabled { opacity: 0.4; pointer-events: none; }
    .move-history {
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: #8899cc;
      max-height: 150px;
      overflow-y: auto;
      background: #0d1425;
      padding: 0.5rem;
      border-radius: 8px;
      font-family: monospace;
      width: 100%;
    }
    .sidebar {
      width: 280px;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      background: #111827;
      border-radius: 12px;
      border: 1px solid #2a3450;
      padding: 1rem;
      overflow-y: auto;
      flex-shrink: 0;
      max-height: 600px;
    }
    .sidebar h3 {
      color: #b7ceff;
      font-weight: 400;
      border-bottom: 1px solid #2a3450;
      padding-bottom: 0.5rem;
    }
    .sidebar label {
      font-size: 0.9rem;
      color: #cfdbff;
    }
    .sidebar select, .sidebar input {
      width: 100%;
      padding: 0.3rem;
      background: #0d1225;
      border: 1px solid #2a3450;
      color: #e0e8ff;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .sidebar .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #8899cc;
      padding: 0.2rem 0;
    }
    @media (max-width: 768px) {
      .container { flex-direction: column; align-items: center; }
      .game-area { min-width: unset; width: 100%; }
      .sidebar { width: 100%; max-height: 300px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="/">🏰 Назад</a>
    <h1>♟️ SkyChess <span class="badge">Stockfish</span></h1>
  </div>

  <div class="container">
    <div class="game-area">
      <div id="board-container"></div>
      <div class="status" id="status">Начать новую игру</div>
      <div class="controls">
        <button class="btn" id="newGameBtn">🔄 Новая игра</button>
        <button class="btn btn-secondary" id="undoBtn">↩️ Отменить</button>
        <button class="btn btn-secondary" id="flipBtn">🔄 Перевернуть</button>
      </div>
      <div class="move-history" id="moveHistory">История ходов:</div>
    </div>

    <div class="sidebar">
      <h3>⚙️ Настройки</h3>
      <label>Уровень сложности:</label>
      <select id="levelSelect">
        <option value="1">Лёгкий</option>
        <option value="5" selected>Средний</option>
        <option value="10">Сложный</option>
        <option value="15">Мастер</option>
        <option value="20">Гроссмейстер</option>
      </select>
      <label>Играть за:</label>
      <select id="colorSelect">
        <option value="white">Белые</option>
        <option value="black">Чёрные</option>
        <option value="random">Случайно</option>
      </select>
      <label>Режим:</label>
      <select id="modeSelect">
        <option value="ai">Против ИИ</option>
        <option value="two">Два игрока (горячий стул)</option>
      </select>

      <h3>📊 Информация</h3>
      <div class="info-row"><span>Фигуры:</span><span id="materialInfo">=</span></div>
      <div class="info-row"><span>Оценка:</span><span id="evalInfo">0.00</span></div>
      <div class="info-row"><span>Ходов:</span><span id="moveCount">0</span></div>
    </div>
  </div>

  <!-- Библиотеки -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js"></script>

  <script>
    // ====== СОСТОЯНИЕ ======
    const chess = new Chess();
    let board = null;
    let gameMode = 'ai'; // 'ai' или 'two'
    let playerColor = 'white'; // 'white' или 'black'
    let isAIThinking = false;
    let moveHistory = [];
    let stockfish = null;
    let gameOver = false;

    // ====== ЭЛЕМЕНТЫ UI ======
    const statusEl = document.getElementById('status');
    const moveHistoryEl = document.getElementById('moveHistory');
    const materialInfoEl = document.getElementById('materialInfo');
    const evalInfoEl = document.getElementById('evalInfo');
    const moveCountEl = document.getElementById('moveCount');
    const levelSelect = document.getElementById('levelSelect');
    const colorSelect = document.getElementById('colorSelect');
    const modeSelect = document.getElementById('modeSelect');
    const newGameBtn = document.getElementById('newGameBtn');
    const undoBtn = document.getElementById('undoBtn');
    const flipBtn = document.getElementById('flipBtn');

    // ====== ИНИЦИАЛИЗАЦИЯ STOCKFISH ======
    function initStockfish() {
      if (typeof Stockfish !== 'undefined') {
        stockfish = new Stockfish();
        stockfish.postMessage('uci');
        stockfish.postMessage('setoption name Skill Level value ' + levelSelect.value);
        stockfish.postMessage('isready');
        console.log('✅ Stockfish загружен');
        return true;
      } else {
        console.warn('⚠️ Stockfish не загружен');
        return false;
      }
    }

    // ====== ДОСКА ======
    function initBoard() {
      const config = {
        position: 'start',
        draggable: true,
        pieceTheme: 'https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/img/chesspieces/wikipedia/{piece}.png',
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: () => board.position(chess.fen())
      };
      board = Chessboard('board-container', config);
    }

    function onDragStart(source, piece) {
      if (gameOver) return false;
      if (gameMode === 'ai') {
        if (isAIThinking) return false;
        if (playerColor === 'white' && piece[0] !== 'w') return false;
        if (playerColor === 'black' && piece[0] !== 'b') return false;
        return true;
      } else {
        // Режим двух игроков
        const turn = chess.turn() === 'w' ? 'white' : 'black';
        if (piece[0] !== (turn === 'white' ? 'w' : 'b')) return false;
        return true;
      }
    }

    function onDrop(source, target) {
      const move = chess.move({
        from: source,
        to: target,
        promotion: 'q'
      });
      if (move === null) return 'snapback';
      updateUI(move);
      board.position(chess.fen());
      // Проверка окончания игры
      if (checkGameOver()) return;

      // Ход ИИ или ожидание
      if (gameMode === 'ai' && !gameOver) {
        const turn = chess.turn() === 'w' ? 'white' : 'black';
        if (turn !== playerColor) {
          scheduleAIMove();
        }
      }
    }

    // ====== ИИ ======
    function scheduleAIMove() {
      if (gameOver || isAIThinking) return;
      isAIThinking = true;
      statusEl.textContent = '🤔 ИИ думает...';
      setTimeout(() => makeAIMove(), 300);
    }

    function makeAIMove() {
      if (!stockfish) {
        // fallback: случайный ход
        const moves = chess.moves();
        if (moves.length === 0) return;
        const randomMove = moves[Math.floor(Math.random() * moves.length)];
        chess.move(randomMove);
        updateUI(chess.history().slice(-1)[0]);
        board.position(chess.fen());
        isAIThinking = false;
        if (checkGameOver()) return;
        if (gameMode === 'ai' && chess.turn() === (playerColor === 'white' ? 'w' : 'b')) {
          scheduleAIMove();
        }
        return;
      }

      stockfish.postMessage('position fen ' + chess.fen());
      const depth = parseInt(levelSelect.value) + 5;
      stockfish.postMessage('go depth ' + depth);

      stockfish.onmessage = (event) => {
        const message = event.data;
        if (message.startsWith('bestmove')) {
          const parts = message.split(' ');
          const bestMove = parts[1];
          if (bestMove) {
            const move = chess.move(bestMove);
            if (move) {
              updateUI(move);
              board.position(chess.fen());
              isAIThinking = false;
              if (checkGameOver()) return;
              if (gameMode === 'ai' && !gameOver) {
                const turn = chess.turn() === 'w' ? 'white' : 'black';
                if (turn !== playerColor) {
                  scheduleAIMove();
                } else {
                  statusEl.textContent = 'Ваш ход';
                }
              }
            } else {
              isAIThinking = false;
            }
          } else {
            isAIThinking = false;
          }
        } else if (message.startsWith('info')) {
          // Можно парсить оценку для отображения
          const evalMatch = message.match(/score cp (-?\d+)/);
          if (evalMatch) {
            const cp = parseInt(evalMatch[1]);
            const evalStr = (cp / 100).toFixed(2);
            evalInfoEl.textContent = evalStr;
          }
        }
      };
    }

    // ====== UI ОБНОВЛЕНИЯ ======
    function updateUI(move) {
      moveHistory.push(move.san || move);
      moveHistoryEl.textContent = 'История ходов: ' + moveHistory.join(' ');
      moveCountEl.textContent = chess.history().length;
      updateMaterial();
      statusEl.textContent = chess.turn() === 'w' ? 'Ход белых' : 'Ход чёрных';
    }

    function updateMaterial() {
      const fen = chess.fen();
      const pieces = fen.split(' ')[0];
      const white = pieces.match(/[A-Z]/g) || [];
      const black = pieces.match(/[a-z]/g) || [];
      const values = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
      let wScore = 0, bScore = 0;
      white.forEach(p => { wScore += values[p.toLowerCase()] || 0; });
      black.forEach(p => { bScore += values[p.toLowerCase()] || 0; });
      const diff = wScore - bScore;
      materialInfoEl.textContent = diff > 0 ? `+${diff}` : (diff < 0 ? `${diff}` : '=');
    }

    function checkGameOver() {
      if (chess.in_checkmate()) {
        const winner = chess.turn() === 'w' ? 'чёрные' : 'белые';
        statusEl.textContent = `🏁 Мат! Победили ${winner}`;
        gameOver = true;
        return true;
      } else if (chess.in_draw()) {
        statusEl.textContent = '🤝 Ничья';
        gameOver = true;
        return true;
      } else if (chess.in_check()) {
        statusEl.textContent = '⚠️ Шах!';
      }
      return false;
    }

    // ====== УПРАВЛЕНИЕ ======
    function newGame() {
      chess.reset();
      moveHistory = [];
      gameOver = false;
      isAIThinking = false;
      board.position('start');
      updateUI(null);
      moveHistoryEl.textContent = 'История ходов:';
      evalInfoEl.textContent = '0.00';
      playerColor = colorSelect.value === 'random' ? (Math.random() > 0.5 ? 'white' : 'black') : colorSelect.value;
      gameMode = modeSelect.value;
      statusEl.textContent = `Новая игра! Вы играете ${playerColor === 'white' ? 'белыми' : 'чёрными'}`;
      if (gameMode === 'ai') {
        if (playerColor === 'black') {
          // Если игрок чёрными, ИИ ходит первым
          setTimeout(() => scheduleAIMove(), 500);
        }
      }
    }

    function undoMove() {
      // Отмена последнего хода (только в режиме двух игроков или если ИИ уже сходил)
      if (gameMode === 'ai') {
        // Сложно отменять ход ИИ, просто перезапуск
        if (confirm('В режиме ИИ отмена хода не поддерживается. Начать новую игру?')) {
          newGame();
        }
        return;
      }
      if (moveHistory.length === 0) return;
      chess.undo();
      moveHistory.pop();
      board.position(chess.fen());
      updateUI(null);
      statusEl.textContent = 'Ход отменён';
    }

    function flipBoard() {
      board.flip();
    }

    // ====== СОБЫТИЯ ======
    newGameBtn.addEventListener('click', newGame);
    undoBtn.addEventListener('click', undoMove);
    flipBtn.addEventListener('click', flipBoard);

    // Обновление уровня сложности
    levelSelect.addEventListener('change', () => {
      if (stockfish) {
        stockfish.postMessage('setoption name Skill Level value ' + levelSelect.value);
      }
    });

    // ====== ИНИЦИАЛИЗАЦИЯ ======
    (function init() {
      const sfLoaded = initStockfish();
      if (!sfLoaded) {
        console.warn('⚠️ Stockfish не загружен, используем случайные ходы');
      }
      initBoard();
      newGame();
      // Обновляем доску при изменении размера окна
      window.addEventListener('resize', () => board.resize());
    })();
  </script>
</body>
</html>
