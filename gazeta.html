<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Газета SkyCitadel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1225;
      color: #e0e8ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      min-height: 100vh;
    }
    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 1.5rem;
      color: #b7ceff;
      text-shadow: 0 0 8px #2f4b8c;
    }
    #news { max-width: 800px; margin: 0 auto; }
    .article {
      background: rgba(20, 28, 50, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid #2e3b5c;
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 0.8rem;
      transition: background 0.2s;
    }
    .article:hover { background: rgba(30, 40, 65, 0.8); }
    .article h2 {
      margin: 0 0 0.4rem 0;
      font-size: 1.1rem;
      color: #cfdbff;
    }
    .article h2 a {
      color: #aac0ff;
      text-decoration: none;
    }
    .article h2 a:hover { text-decoration: underline; }
    .article p {
      font-size: 0.85rem;
      color: #8899cc;
    }
    .date {
      text-align: center;
      margin-top: 20px;
      font-style: italic;
      color: #5b6d9a;
    }
    #sources {
      max-width: 800px;
      margin: 20px auto 0;
      font-size: 0.85rem;
      color: #6b7b9e;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>📰 Новости Интерфакс</h1>
  <div id="news">Загрузка новостей...</div>
  <div class="date" id="updateTime"></div>
  <div id="sources">
    <strong>Источник:</strong> Интерфакс (RSS)
  </div>
  <script src="sky-network.js"></script>
  <script>
    // Адрес твоего сервера с прокси
    const PROXY_URL = 'https://sky-mutant--rilloperdagelo.replit.app/proxy-cors';
    const RSS_URL = 'https://www.interfax.ru/rss';

    const newsContainer = document.getElementById('news');
    const updateTime = document.getElementById('updateTime');

    function loadNews() {
      newsContainer.innerHTML = 'Загрузка новостей...';
      // Запрашиваем RSS через наш прокси, который не боится CORS
      SkyNetwork.fetch(PROXY_URL + '?url=' + encodeURIComponent(RSS_URL))
        .then(response => response.text())
        .then(str => {
          const parser = new DOMParser();
          const xml = parser.parseFromString(str, 'text/xml');
          const items = xml.querySelectorAll('item');
          const articles = [];
          items.forEach(item => {
            const title = item.querySelector('title')?.textContent || 'Без заголовка';
            const link = item.querySelector('link')?.textContent || '#';
            const pubDate = item.querySelector('pubDate')?.textContent;
            articles.push({ title, link, pubDate });
          });
          if (articles.length === 0) {
            newsContainer.innerHTML = '<p style="text-align:center;">Новостей пока нет</p>';
          } else {
            displayNews(articles.slice(0, 10));
          }
        })
        .catch(err => {
          console.error('Ошибка загрузки RSS:', err);
          newsContainer.innerHTML = '<p style="text-align:center;">Не удалось загрузить новости</p>';
        });
    }

    function displayNews(items) {
      newsContainer.innerHTML = '';
      items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'article';
        const date = item.pubDate ? new Date(item.pubDate).toLocaleString('ru-RU') : '';
        div.innerHTML = `
          <h2><a href="${item.link}" target="_blank">${item.title}</a></h2>
          <p>${date}</p>
        `;
        newsContainer.appendChild(div);
      });
      updateTime.textContent = 'Обновлено: ' + new Date().toLocaleString('ru-RU');
    }

    // Загружаем при старте и обновляем каждый час
    loadNews();
    setInterval(loadNews, 3600000);
  </script>
</body>
</html>
