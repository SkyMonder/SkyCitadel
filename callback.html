<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход в SkyVideo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0f1e;
      color: #e0e8ff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .loader {
      text-align: center;
    }
    .spinner {
      border: 4px solid rgba(255,255,255,0.1);
      border-top: 4px solid #5f7ecf;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .error { color: #f48024; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="loader" id="status">
    <div class="spinner"></div>
    <p>Вход в систему...</p>
  </div>

  <script>
    (async function() {
      // ====== Конфигурация ======
      const SKYID_URL = 'https://skymutant.onrender.com'; // ← замените на свой, если нужно
      const CLIENT_ID = 'skyvideo';
      const CLIENT_SECRET = 'skyvideo_secret';
      const REDIRECT_URI = window.location.origin + window.location.pathname; // текущий URL

      // ====== Парсим URL ======
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error');

      if (error) {
        document.getElementById('status').innerHTML = `
          <p style="color:#f48024;">❌ Ошибка авторизации: ${error}</p>
          <p><a href="/" style="color:#5f7ecf;">Вернуться на главную</a></p>
        `;
        return;
      }

      if (!code) {
        document.getElementById('status').innerHTML = `
          <p style="color:#f48024;">❌ Не передан код авторизации</p>
          <p><a href="/" style="color:#5f7ecf;">Вернуться на главную</a></p>
        `;
        return;
      }

      try {
        // ====== Обмен кода на токен ======
        console.log('📤 Отправка кода:', code);
        const response = await fetch(`${SKYID_URL}/oauth/token`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            code: code,
            client_id: CLIENT_ID,
            client_secret: CLIENT_SECRET
          })
        });

        const responseData = await response.json();

        if (!response.ok) {
          console.error('❌ Ошибка:', responseData);
          throw new Error(responseData.error || `HTTP ${response.status}`);
        }

        console.log('✅ Токен получен:', responseData);

        // ====== Сохраняем токен ======
        const token = responseData.access_token;
        const skyid = responseData.skyid;
        const login = responseData.login || '';

        localStorage.setItem('skyvideo_token', token);
        localStorage.setItem('skyvideo_skyid', skyid);
        localStorage.setItem('skyvideo_login', login);
        if (responseData.refresh_token) {
          localStorage.setItem('skyvideo_refresh_token', responseData.refresh_token);
        }
        if (responseData.expires_in) {
          localStorage.setItem('skyvideo_expires_at', Date.now() + responseData.expires_in * 1000);
        }

        // ====== Перенаправляем на главную страницу SkyVideo ======
        // Если state содержит URL, используем его, иначе на главную
        let redirectUrl = '/';
        if (state) {
          try {
            const decodedState = decodeURIComponent(state);
            if (decodedState.startsWith('/') || decodedState.startsWith(window.location.origin)) {
              redirectUrl = decodedState;
            }
          } catch (e) {}
        }

        window.location.href = redirectUrl;
      } catch (err) {
        console.error('❌ Исключение:', err);
        document.getElementById('status').innerHTML = `
          <p style="color:#f48024;">❌ Ошибка входа: ${err.message}</p>
          <p><a href="/" style="color:#5f7ecf;">Вернуться на главную</a></p>
        `;
      }
    })();
  </script>
</body>
</html>
