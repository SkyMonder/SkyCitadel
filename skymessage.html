<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>SkyMessage</title>
  <style>
    :root {
      --bg: #0a0f1e; --panel: #111827; --card: #1a233a;
      --border: #2a3450; --text: #e0e8ff; --accent: #5f7ecf;
      --hover: #2f4b8c;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }
    .auth-screen { position: absolute; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 20; }
    .auth-box { background: var(--card); padding: 2rem; border-radius: 20px; border: 1px solid var(--border); width: 320px; text-align: center; }
    .auth-box input { width: 100%; padding: 0.7rem; margin: 0.5rem 0; background: #0d1225; border: 1px solid var(--border); color: white; border-radius: 10px; }
    .auth-box button { width: 100%; padding: 0.7rem; background: var(--accent); border: none; color: white; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 0.5rem; }
    .switch-link { color: #7f8bb3; font-size: 0.8rem; cursor: pointer; margin-top: 0.8rem; }
    .app { display: flex; width: 100%; height: 100%; }
    .sidebar { width: 300px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 1rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.5rem; }
    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item { padding: 0.8rem 1rem; display: flex; align-items: center; gap: 0.7rem; border-bottom: 1px solid #1e2a40; cursor: pointer; transition: 0.2s; }
    .chat-item:hover, .chat-item.active { background: #1f2b4a; }
    .chat-avatar { width: 40px; height: 40px; border-radius: 50%; background: #2f3b5c; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; }
    .chat-info { flex: 1; }
    .chat-name { font-weight: 500; }
    .chat-last { font-size: 0.8rem; color: #8899cc; }
    .main-area { flex: 1; display: flex; flex-direction: column; }
    .chat-header { padding: 0.8rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.8rem; background: var(--card); }
    .messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .msg { max-width: 70%; padding: 0.7rem 1rem; border-radius: 16px; background: #1f2b4a; align-self: flex-start; }
    .msg.own { align-self: flex-end; background: var(--accent); }
    .msg .time { font-size: 0.7rem; color: #ccc; margin-top: 0.2rem; text-align: right; }
    .input-area { padding: 1rem; border-top: 1px solid var(--border); display: flex; gap: 0.5rem; background: var(--card); }
    .input-area input { flex: 1; padding: 0.7rem; background: #0d1225; border: 1px solid var(--border); color: white; border-radius: 10px; }
    .emoji-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; }
    .emoji-panel { display: none; flex-wrap: wrap; gap: 0.3rem; padding: 0.5rem; background: var(--card); border: 1px solid var(--border); border-radius: 10px; max-width: 280px; }
    .emoji-panel span { cursor: pointer; font-size: 1.4rem; }
    .profile-panel { position: absolute; top: 0; right: 0; width: 320px; height: 100%; background: var(--panel); border-left: 1px solid var(--border); transform: translateX(100%); transition: 0.3s; z-index: 15; padding: 1.5rem; overflow-y: auto; }
    .profile-panel.open { transform: translateX(0); }
    .avatar-upload { width: 80px; height: 80px; border-radius: 50%; background: #2f3b5c; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 2rem; cursor: pointer; background-size: cover; }
    .btn { background: var(--accent); border: none; color: white; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
    .call-ui { position: fixed; bottom: 20px; right: 20px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1rem; display: none; z-index: 30; flex-direction: column; gap: 0.8rem; }
    .call-ui.active { display: flex; }
    video { width: 200px; border-radius: 8px; }
  </style>
</head>
<body>
  <!-- Экран аутентификации -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-box">
      <h2 id="authTitle">Вход</h2>
      <input type="text" id="loginInput" placeholder="Логин" autocomplete="off">
      <input type="password" id="passInput" placeholder="Пароль">
      <button id="authBtn">Войти</button>
      <div class="switch-link" id="switchAuth">Нет аккаунта? Зарегистрироваться</div>
    </div>
  </div>

  <!-- Основной интерфейс -->
  <div class="app" id="app" style="display:none;">
    <div class="sidebar">
      <div class="sidebar-header">
        <span style="font-weight:bold;">✉️ SkyMessage</span>
        <button class="btn" id="newChatBtn">+</button>
        <button class="btn" id="profileBtn">👤</button>
      </div>
      <div class="chat-list" id="chatList"></div>
    </div>
    <div class="main-area" id="chatArea">
      <div class="chat-header" id="chatHeader">Выберите чат</div>
      <div class="messages" id="messagesContainer"></div>
      <div class="input-area" id="inputArea" style="display:none;">
        <button class="emoji-btn" id="emojiToggle">😀</button>
        <input type="text" id="messageInput" placeholder="Сообщение...">
        <button class="btn" id="sendBtn">➤</button>
        <button class="btn" id="callBtn">📞</button>
      </div>
      <div class="emoji-panel" id="emojiPanel"></div>
    </div>
    <!-- Профиль -->
    <div class="profile-panel" id="profilePanel">
      <h3>Мой профиль</h3>
      <div class="avatar-upload" id="avatarUpload" title="Сменить аватар">👤</div>
      <input type="file" id="avatarFile" accept="image/*" style="display:none;">
      <input type="text" id="profileName" placeholder="Имя" style="width:100%; margin-top:1rem; padding:0.5rem; background:#0d1225; border:1px solid var(--border); color:white; border-radius:8px;">
      <input type="text" id="profileStatus" placeholder="Статус" style="width:100%; margin-top:0.5rem; padding:0.5rem; background:#0d1225; border:1px solid var(--border); color:white; border-radius:8px;">
      <button class="btn" id="saveProfile" style="width:100%; margin-top:1rem;">Сохранить</button>
      <button class="btn" id="closeProfile" style="width:100%; margin-top:0.5rem; background:#444;">Закрыть</button>
    </div>
    <!-- Звонок -->
    <div class="call-ui" id="callUI">
      <div><span id="callerName"></span></div>
      <video id="localVideo" autoplay muted></video>
      <video id="remoteVideo" autoplay></video>
      <div style="display:flex; gap:0.5rem;">
        <button class="btn" id="toggleMic">🎤 Mic</button>
        <button class="btn" id="toggleCam">📷 Cam</button>
        <button class="btn" id="endCall" style="background:#c44;">Завершить</button>
      </div>
    </div>
    <!-- Входящий звонок -->
    <div class="call-ui" id="incomingCall" style="bottom:auto; top:20px;">
      <div><span id="incomingCaller"></span> звонит...</div>
      <div style="display:flex; gap:0.5rem;">
        <button class="btn" id="acceptCall">Принять</button>
        <button class="btn" id="rejectCall" style="background:#c44;">Отклонить</button>
      </div>
    </div>
  </div>

  <script>
    // ========== Конфигурация ==========
    const WS_URL = 'wss://serveratiuz.onrender.com';
    const SERVER_URL = 'https://serveratiuz.onrender.com';   // REST API сервиса №2

    let ws;
    let currentUser = null;   // { login, name, avatar, status }
    let cryptoKey = null;     // AES-GCM ключ из пароля
    let chats = {};           // чаты, полученные с сервера
    let activeChatId = null;
    let localStream = null;
    let peerConnection = null;
    let pendingCall = null;   // { chatId, from }

    // ========== Шифрование ==========
    const enc = new TextEncoder();
    const dec = new TextDecoder();
    async function deriveKey(password, saltBase64) {
      const salt = Uint8Array.from(atob(saltBase64), c => c.charCodeAt(0));
      const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' }, keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    }
    async function encryptPayload(obj) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, cryptoKey, enc.encode(JSON.stringify(obj)));
      return { iv: btoa(String.fromCharCode(...iv)), data: btoa(String.fromCharCode(...new Uint8Array(encrypted))) };
    }
    async function decryptPayload(ivB64, dataB64) {
      const iv = Uint8Array.from(atob(ivB64), c => c.charCodeAt(0));
      const data = Uint8Array.from(atob(dataB64), c => c.charCodeAt(0));
      const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, cryptoKey, data);
      return JSON.parse(dec.decode(decrypted));
    }

    // ========== WebSocket ==========
    function connectWebSocket() {
      ws = new WebSocket(WS_URL);
      ws.onopen = () => {
        const authMsg = { type: 'auth', login: currentUser.login };
        ws.send(JSON.stringify(authMsg));
        loadChats();
      };
      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);
        switch(msg.type) {
          case 'auth_ok':
            currentUser.name = msg.name;
            currentUser.avatar = msg.avatar;
            currentUser.status = msg.status;
            break;
          case 'message':
            await handleIncomingMessage(msg);
            break;
          case 'chat_list':
            chats = msg.chats;
            renderChatList();
            if (activeChatId) openChat(activeChatId);
            break;
          case 'messages':
            displayMessages(msg.messages);
            break;
          case 'call_offer':
            handleCallOffer(msg);
            break;
          case 'call_answer':
            handleCallAnswer(msg);
            break;
          case 'ice_candidate':
            handleICECandidate(msg);
            break;
          case 'call_end':
            endCall();
            break;
          case 'user_search_result':
            displayUserSearchResults(msg.users);
            break;
          default: break;
        }
      };
      ws.onclose = () => setTimeout(connectWebSocket, 3000);
    }

    async function sendServerMessage(type, data) {
      if (ws.readyState === WebSocket.OPEN) {
        const encrypted = await encryptPayload(data);
        ws.send(JSON.stringify({ type, ...encrypted }));
      }
    }

    // ========== Аутентификация ==========
    document.getElementById('switchAuth').addEventListener('click', () => {
      const title = document.getElementById('authTitle');
      const btn = document.getElementById('authBtn');
      if (title.textContent === 'Вход') {
        title.textContent = 'Регистрация';
        btn.textContent = 'Создать аккаунт';
        this.textContent = 'Уже есть аккаунт? Войти';
      } else {
        title.textContent = 'Вход';
        btn.textContent = 'Войти';
        this.textContent = 'Нет аккаунта? Зарегистрироваться';
      }
    });

    document.getElementById('authBtn').addEventListener('click', async () => {
      const login = document.getElementById('loginInput').value.trim();
      const password = document.getElementById('passInput').value;
      if (!login || !password) {
        showStatusMessage('Заполни все поля');
        return;
      }
      const isReg = document.getElementById('authTitle').textContent === 'Регистрация';
      try {
        if (isReg) {
          // Регистрация
          const salt = window.crypto.getRandomValues(new Uint8Array(16));
          const saltB64 = btoa(String.fromCharCode(...salt));
          cryptoKey = await deriveKey(password, saltB64);
          const res = await fetch(`${SERVER_URL}/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ login, salt: saltB64 })
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.error || 'Ошибка регистрации');
          }
          showStatusMessage('Аккаунт создан! Теперь войди.');
          document.getElementById('authTitle').textContent = 'Вход';
          document.getElementById('authBtn').textContent = 'Войти';
        } else {
          // Вход
          const res = await fetch(`${SERVER_URL}/login_salt?login=${encodeURIComponent(login)}`);
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.error || 'Пользователь не найден');
          }
          const { salt: saltB64 } = await res.json();
          cryptoKey = await deriveKey(password, saltB64);
          currentUser = { login };
          showAuth(false);
          showApp(true);
          connectWebSocket();
        }
      } catch(e) {
        showStatusMessage(e.message);
        console.error(e);
      }
    });

    // Добавим функцию для показа статуса (вместо alert)
    function showStatusMessage(text) {
          // Простой вывод в верхней части экрана (можно заменить на alert пока)
      alert(text);
    }

    function showAuth(show) { document.getElementById('authScreen').style.display = show ? 'flex' : 'none'; }
    function showApp(show) { document.getElementById('app').style.display = show ? 'flex' : 'none'; }

    // ========== UI чатов ==========
    function loadChats() {
      sendServerMessage('get_chats', {});
    }

    function renderChatList() {
      const container = document.getElementById('chatList');
      container.innerHTML = '';
      Object.entries(chats).forEach(([id, chat]) => {
        const div = document.createElement('div');
        div.className = 'chat-item' + (id === activeChatId ? ' active' : '');
        div.innerHTML = `
          <div class="chat-avatar">${chat.type==='group'?'👥':chat.type==='channel'?'📢':'👤'}</div>
          <div class="chat-info">
            <div class="chat-name">${chat.name}</div>
            <div class="chat-last">${chat.lastMsg || ''}</div>
          </div>`;
        div.addEventListener('click', () => {
          activeChatId = id;
          openChat(id);
          renderChatList();
        });
        container.appendChild(div);
      });
    }

    function clearChat() {
      document.getElementById('chatHeader').textContent = 'Выберите чат';
      document.getElementById('messagesContainer').innerHTML = '';
      document.getElementById('inputArea').style.display = 'none';
    }

    function openChat(id) {
      const chat = chats[id];
      if (!chat) return;
      document.getElementById('inputArea').style.display = 'flex';
      document.getElementById('chatHeader').textContent = chat.name;
      sendServerMessage('get_messages', { chatId: id });
    }

    async function handleIncomingMessage(msg) {
      const { chatId, from, text, time } = msg;
      if (!chats[chatId]) {
        loadChats();
        return;
      }
      if (!chats[chatId].messages) chats[chatId].messages = [];
      chats[chatId].messages.push({ from, text, time });
      if (chatId === activeChatId) {
        addMessageToUI({ from, text, time });
      }
      renderChatList();
    }

    function displayMessages(messages) {
      const container = document.getElementById('messagesContainer');
      container.innerHTML = '';
      messages.forEach(msg => addMessageToUI(msg));
      container.scrollTop = container.scrollHeight;
    }

    function addMessageToUI(msg) {
      const div = document.createElement('div');
      div.className = 'msg' + (msg.from === currentUser.login ? ' own' : '');
      div.innerHTML = `<strong>${msg.from}</strong>: ${escapeHtml(msg.text)} <span class="time">${new Date(msg.time).toLocaleTimeString()}</span>`;
      document.getElementById('messagesContainer').appendChild(div);
    }

    function escapeHtml(text) { return String(text).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

    // Отправка сообщения
    document.getElementById('sendBtn').addEventListener('click', () => {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !activeChatId) return;
      input.value = '';
      sendServerMessage('send_message', { chatId: activeChatId, text });
    });

    // Эмодзи
    const emojis = '😀😃😄😁😅😂🤣😊😇🙂😉😌😍🥰😘😗😙😚😋😛😝😜🤪🤨🧐🤓😎🤩🥳😏😒😞😔😟😕🙁☹️😣😖😫😩🥺😢😭😤😠😡🤬🤯😳🥵🥶😱😨😰😥😓🤗🤔🤭🤫🤥😶😐😑😬🙄😯😦😧😮😲🥱😴🤤😪😵🤐🤢🤮🤧😷🤒🤕🤑🤠😈👿👹👺🤡💩👻💀☠️👽👾🤖🎃😺😸😹😻😼😽🙀😿😾'.split('');
    const emojiPanel = document.getElementById('emojiPanel');
    emojis.forEach(e => {
      const span = document.createElement('span');
      span.textContent = e;
      span.addEventListener('click', () => { document.getElementById('messageInput').value += e; emojiPanel.style.display = 'none'; });
      emojiPanel.appendChild(span);
    });
    document.getElementById('emojiToggle').addEventListener('click', () => emojiPanel.style.display = emojiPanel.style.display==='flex'?'none':'flex');

    // Новый чат
    document.getElementById('newChatBtn').addEventListener('click', () => {
      const action = prompt('Создать:\n1 - Личный чат (поиск)\n2 - Группа\n3 - Канал');
      if (action === '1') {
        const query = prompt('Логин собеседника:');
        if (query) sendServerMessage('search_user', { query });
      } else if (action === '2') {
        const name = prompt('Название группы:');
        if (name) sendServerMessage('create_group', { name });
      } else if (action === '3') {
        const name = prompt('Название канала:');
        if (name) sendServerMessage('create_channel', { name });
      }
    });

    function displayUserSearchResults(users) {
      if (!users.length) return alert('Никого не найдено');
      const list = users.map((u,i) => `${i+1}. ${u.login}`).join('\n');
      const choice = prompt('Выберите номер:\n' + list);
      const idx = parseInt(choice)-1;
      if (users[idx]) sendServerMessage('create_private_chat', { target: users[idx].login });
    }

    // Профиль
    document.getElementById('profileBtn').addEventListener('click', () => {
      document.getElementById('profilePanel').classList.toggle('open');
      if (currentUser) {
        document.getElementById('profileName').value = currentUser.name || '';
        document.getElementById('profileStatus').value = currentUser.status || '';
        document.getElementById('avatarUpload').style.backgroundImage = currentUser.avatar ? `url(${currentUser.avatar})` : '';
        document.getElementById('avatarUpload').textContent = currentUser.avatar ? '' : '👤';
      }
    });
    document.getElementById('closeProfile').addEventListener('click', () => document.getElementById('profilePanel').classList.remove('open'));
    document.getElementById('avatarUpload').addEventListener('click', () => document.getElementById('avatarFile').click());
    document.getElementById('avatarFile').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const base64 = ev.target.result;
        currentUser.avatar = base64;
        document.getElementById('avatarUpload').style.backgroundImage = `url(${base64})`;
        document.getElementById('avatarUpload').textContent = '';
        sendServerMessage('update_profile', { avatar: base64 });
      };
      reader.readAsDataURL(file);
    });
    document.getElementById('saveProfile').addEventListener('click', () => {
      const name = document.getElementById('profileName').value.trim();
      const status = document.getElementById('profileStatus').value.trim();
      if (name) currentUser.name = name;
      currentUser.status = status;
      sendServerMessage('update_profile', { name, status });
      alert('Профиль обновлён');
    });

    // ========== Звонки (WebRTC) ==========
    async function getLocalStream() {
      if (!localStream) {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
        document.getElementById('localVideo').srcObject = localStream;
      }
      return localStream;
    }

    document.getElementById('callBtn').addEventListener('click', async () => {
      if (!activeChatId) return;
      const chat = chats[activeChatId];
      if (chat.type !== 'private') return alert('Звонки только в личных чатах');
      await getLocalStream();
      sendServerMessage('call_offer', { chatId: activeChatId });
      document.getElementById('callUI').classList.add('active');
    });

    async function handleCallOffer(msg) {
      const { from, chatId } = msg;
      pendingCall = { chatId, from };
      document.getElementById('incomingCaller').textContent = from;
      document.getElementById('incomingCall').classList.add('active');
    }

    document.getElementById('acceptCall').addEventListener('click', async () => {
      if (!pendingCall) return;
      await getLocalStream();
      document.getElementById('callUI').classList.add('active');
      document.getElementById('incomingCall').classList.remove('active');
      createPeerConnection(pendingCall.chatId);
      sendServerMessage('call_answer', { chatId: pendingCall.chatId });
      pendingCall = null;
    });

    document.getElementById('rejectCall').addEventListener('click', () => {
      if (pendingCall) {
        sendServerMessage('call_reject', { chatId: pendingCall.chatId });
        document.getElementById('incomingCall').classList.remove('active');
        pendingCall = null;
      }
    });

    function createPeerConnection(chatId) {
      peerConnection = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          sendServerMessage('ice_candidate', { chatId, candidate: event.candidate });
        }
      };
      peerConnection.ontrack = (event) => {
        document.getElementById('remoteVideo').srcObject = event.streams[0];
      };
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
    }

    async function handleCallAnswer(msg) {
      if (!peerConnection) createPeerConnection(msg.chatId);
      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      sendServerMessage('call_offer_sdp', { chatId: msg.chatId, sdp: offer });
    }

    async function handleICECandidate(msg) {
      if (peerConnection) {
        await peerConnection.addIceCandidate(new RTCIceCandidate(msg.candidate));
      }
    }

    document.getElementById('endCall').addEventListener('click', () => {
      sendServerMessage('call_end', { chatId: activeChatId });
      endCall();
    });

    function endCall() {
      if (peerConnection) { peerConnection.close(); peerConnection = null; }
      document.getElementById('callUI').classList.remove('active');
      document.getElementById('remoteVideo').srcObject = null;
    }

    document.getElementById('toggleMic').addEventListener('click', () => {
      if (localStream) {
        const audioTrack = localStream.getAudioTracks()[0];
        if (audioTrack) audioTrack.enabled = !audioTrack.enabled;
      }
    });
    document.getElementById('toggleCam').addEventListener('click', () => {
      if (localStream) {
        const videoTrack = localStream.getVideoTracks()[0];
        if (videoTrack) videoTrack.enabled = !videoTrack.enabled;
      }
    });

    // Инициализация
    showAuth(true);
    showApp(false);
