<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>SkyMessage (SSE)</title>
  <style>
    :root {
      --bg: #0a0f1e; --panel: #111827; --card: #1a233a;
      --border: #2a3450; --text: #e0e8ff; --accent: #5f7ecf;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }
    .auth-screen { position: absolute; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 20; }
    .auth-box { background: var(--card); padding: 2rem; border-radius: 20px; border: 1px solid var(--border); width: 320px; text-align: center; }
    .auth-box input { width: 100%; padding: 0.7rem; margin: 0.5rem 0; background: #0d1225; border: 1px solid var(--border); color: white; border-radius: 10px; }
    .auth-box button { width: 100%; padding: 0.7rem; background: var(--accent); border: none; color: white; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 0.5rem; }
    .switch-link { color: #7f8bb3; font-size: 0.8rem; cursor: pointer; margin-top: 0.8rem; }
    .app { display: flex; width: 100%; height: 100%; }
    .sidebar { width: 300px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 1rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.5rem; }
    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item { padding: 0.8rem 1rem; display: flex; align-items: center; gap: 0.7rem; border-bottom: 1px solid #1e2a40; cursor: pointer; position: relative; }
    .chat-item:hover, .chat-item.active { background: #1f2b4a; }
    .chat-avatar { width: 40px; height: 40px; border-radius: 50%; background: #2f3b5c; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; }
    .chat-info { flex: 1; }
    .chat-name { font-weight: 500; }
    .chat-last { font-size: 0.8rem; color: #8899cc; }
    .chat-actions { display: none; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 0.3rem; z-index: 5; }
    .chat-item:hover .chat-actions { display: flex; gap: 0.3rem; }
    .main-area { flex: 1; display: flex; flex-direction: column; }
    .chat-header { padding: 0.8rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.8rem; background: var(--card); }
    .messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .msg { max-width: 70%; padding: 0.7rem 1rem; border-radius: 16px; background: #1f2b4a; align-self: flex-start; position: relative; }
    .msg.own { align-self: flex-end; background: var(--accent); }
    .msg .time { font-size: 0.7rem; color: #ccc; margin-top: 0.2rem; text-align: right; }
    .msg img, .msg video { max-width: 200px; border-radius: 8px; margin: 0.3rem 0; }
    .msg-actions { display: none; position: absolute; right: 5px; top: 5px; background: var(--card); border-radius: 6px; padding: 2px; }
    .msg:hover .msg-actions { display: flex; gap: 0.2rem; }
    .edited-mark { font-size: 0.7rem; color: #aaa; }
    .input-area { padding: 1rem; border-top: 1px solid var(--border); display: flex; gap: 0.5rem; background: var(--card); align-items: center; position: relative; }
    .input-area input { flex: 1; padding: 0.7rem; background: #0d1225; border: 1px solid var(--border); color: white; border-radius: 10px; }
    .btn { background: var(--accent); border: none; color: white; padding: 0.4rem 0.8rem; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
    .btn-danger { background: #c44; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 50; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--card); border-radius: 16px; padding: 1.5rem; width: 320px; border: 1px solid var(--border); }
    .modal input { width: 100%; padding: 0.7rem; margin: 0.5rem 0; background: #0d1225; border: 1px solid var(--border); color: white; border-radius: 10px; }
    .modal .btn-row { display: flex; gap: 0.5rem; justify-content: center; margin-top: 1rem; }
    .search-results { max-height: 200px; overflow-y: auto; margin: 0.5rem 0; }
    .search-result-item { padding: 0.5rem; cursor: pointer; border-radius: 8px; }
    .search-result-item:hover { background: #1f2b4a; }
    .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #c44; color: white; padding: 0.6rem 1.2rem; border-radius: 20px; font-size: 0.9rem; z-index: 100; display: none; }
    .emoji-panel { display: none; flex-wrap: wrap; gap: 0.3rem; padding: 0.5rem; background: var(--card); border: 1px solid var(--border); border-radius: 10px; max-width: 280px; position: absolute; bottom: 70px; left: 10px; z-index: 40; }
    .emoji-panel span { cursor: pointer; font-size: 1.4rem; }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>

  <div id="authScreen" class="auth-screen">
    <div class="auth-box">
      <h2 id="authTitle">Вход</h2>
      <input type="text" id="loginInput" placeholder="Логин" autocomplete="off">
      <input type="password" id="passInput" placeholder="Пароль">
      <button id="authBtn">Войти</button>
      <div class="switch-link" id="switchAuth">Нет аккаунта? Зарегистрироваться</div>
    </div>
  </div>

  <div class="app" id="app" style="display:none;">
    <div class="sidebar">
      <div class="sidebar-header">
        <span>✉️ SkyMessage</span>
        <button class="btn" id="newChatBtn">+</button>
        <button class="btn" id="findGroupsBtn">🔍</button>
        <button class="btn" id="profileBtn">👤</button>
      </div>
      <div class="chat-list" id="chatList"></div>
    </div>
    <div class="main-area">
      <div class="chat-header" id="chatHeader">Выберите чат</div>
      <div class="messages" id="messagesContainer"></div>
      <div class="input-area" id="inputArea" style="display:none;">
        <button class="btn" id="attachBtn">📎</button>
        <input type="file" id="fileInput" style="display:none;" multiple>
        <button class="btn" id="emojiBtn">😀</button>
        <div class="emoji-panel" id="emojiPanel"></div>
        <input type="text" id="messageInput" placeholder="Сообщение...">
        <button class="btn" id="sendBtn">➤</button>
      </div>
    </div>
  </div>

  <!-- Модалки -->
  <div class="modal-overlay" id="searchModal">
    <div class="modal">
      <h3>Поиск пользователя</h3>
      <input type="text" id="searchQuery" placeholder="Введите логин...">
      <div class="search-results" id="searchResults"></div>
      <div class="btn-row">
        <button class="btn" id="modalCancel" style="background:#444;">Отмена</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="groupsModal">
    <div class="modal">
      <h3>Поиск групп и каналов</h3>
      <input type="text" id="groupSearchQuery" placeholder="Название...">
      <div class="search-results" id="groupSearchResults"></div>
      <div class="btn-row">
        <button class="btn" id="groupsModalCancel" style="background:#444;">Закрыть</button>
      </div>
    </div>
  </div>

  <script>
    // ====== ВСПОМОГАТЕЛЬНЫЕ ======
    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(1) + ' MB';
    }

    // ====== КОНСТАНТЫ ======
    const SERVER_URL = 'https://skymutant-prox.rilloperdagelo.workers.dev';
    const API_URL = SERVER_URL;

    // ====== ГЛОБАЛЬНЫЕ ======
    let currentUser = null, chats = {}, activeChatId = null;
    let editingMessageId = null;
    let eventSource = null;

    function showToast(message, bg = '#c44') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.style.background = bg;
      toast.style.display = 'block';
      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    // ====== HTTP-запросы ======
    async function apiRequest(endpoint, method = 'POST', data = null, timeout = 15000) {
      const token = localStorage.getItem('skyid_token');
      const headers = {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      };
      const options = { method, headers };
      if (data) options.body = JSON.stringify(data);

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeout);
      options.signal = controller.signal;

      try {
        const response = await fetch(API_URL + endpoint, options);
        clearTimeout(timer);
        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.error || `HTTP ${response.status}`);
        }
        return await response.json();
      } catch (err) {
        clearTimeout(timer);
        throw err;
      }
    }

    // ====== SSE КЛИЕНТ ======
    function connectSSE() {
      const token = localStorage.getItem('skyid_token');
      if (!token) {
        console.warn('⚠️ Нет токена, SSE не подключён');
        return;
      }
      // Закрываем предыдущее соединение
      if (eventSource) {
        eventSource.close();
        eventSource = null;
      }

      // EventSource не поддерживает кастомные заголовки, передаём токен в URL
      const url = API_URL + '/events?token=' + encodeURIComponent(token);
      eventSource = new EventSource(url);

      eventSource.onopen = () => {
        console.log('📡 SSE соединение открыто');
      };

      eventSource.onmessage = (event) => {
        console.log('📨 SSE событие:', event.data);
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'connected') {
            console.log('✅ SSE подключено для', msg.userId);
            return;
          }
          // Обработка сообщений
          if (msg.type === 'chat_update') {
            loadChats();
          } else {
            handleIncomingMessage(msg);
          }
        } catch (e) {
          console.error('Ошибка парсинга SSE:', e);
        }
      };

      eventSource.onerror = (err) => {
        console.warn('⚠️ SSE ошибка, переподключение через 3 сек...', err);
        eventSource.close();
        setTimeout(connectSSE, 3000);
      };
    }

    function disconnectSSE() {
      if (eventSource) {
        eventSource.close();
        eventSource = null;
        console.log('📡 SSE отключено');
      }
    }

    // ====== ОТПРАВКА СООБЩЕНИЯ ======
    async function sendMessage(chatId, text) {
      if (!currentUser || !currentUser.login) {
        showToast('Ошибка: не авторизован');
        return;
      }
      try {
        await apiRequest('/send', 'POST', { chatId, text }, 10000);
        // Оптимистичное добавление
        const msg = { id: 'msg_' + Date.now(), from: currentUser.login, text, time: Date.now() };
        if (!chats[chatId]) chats[chatId] = { messages: [] };
        if (!chats[chatId].messages) chats[chatId].messages = [];
        chats[chatId].messages.push(msg);
        if (activeChatId === chatId) addMessageToUI(msg);
        renderChatList();
      } catch (err) {
        showToast('Ошибка отправки: ' + err.message);
      }
    }

    // ====== ВЕРИФИКАЦИЯ ======
    async function verifySession() {
      try {
        const data = await apiRequest('/verify', 'POST', {}, 10000);
        if (data.login) {
          currentUser = { login: data.login, skyid: data.skyid };
          return true;
        }
      } catch (err) {
        console.warn('❌ Ошибка верификации:', err.message);
      }
      return false;
    }

    // ====== АВТОРИЗАЦИЯ ======
    function showAuth(s) { document.getElementById('authScreen').style.display = s?'flex':'none'; }
    function showApp(s) { document.getElementById('app').style.display = s?'flex':'none'; }

    document.getElementById('switchAuth').addEventListener('click', function() {
      const t = document.getElementById('authTitle'), b = document.getElementById('authBtn');
      if (t.textContent === 'Вход') {
        t.textContent='Регистрация'; b.textContent='Создать аккаунт'; this.textContent='Уже есть аккаунт? Войти';
      } else {
        t.textContent='Вход'; b.textContent='Войти'; this.textContent='Нет аккаунта? Зарегистрироваться';
      }
    });

    document.getElementById('authBtn').addEventListener('click', async () => {
      const login = document.getElementById('loginInput').value.trim();
      const password = document.getElementById('passInput').value;
      if (!login || !password) return alert('Заполни поля');
      const isReg = document.getElementById('authTitle').textContent === 'Регистрация';
      const url = isReg ? `${API_URL}/smreg` : `${API_URL}/smlog`;
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login, password })
        });
        const data = await res.json();
        if (!res.ok) { alert(data.error || 'Ошибка'); return; }
        if (isReg) {
          alert('Аккаунт создан! Теперь войдите.');
          document.getElementById('authTitle').textContent = 'Вход';
          document.getElementById('authBtn').textContent = 'Войти';
          document.getElementById('switchAuth').textContent = 'Нет аккаунта? Зарегистрироваться';
          return;
        }
        const token = data.jwt;
        if (!token) { alert('Ошибка: сервер не вернул JWT'); return; }
        localStorage.setItem('skyid_token', token);
        currentUser = { login };
        showAuth(false); showApp(true);
        await loadChats();
        connectSSE();
      } catch(e) { alert('Ошибка: '+e.message); }
    });

    // ====== ЗАГРУЗКА ЧАТОВ ======
    async function loadChats() {
      try {
        const data = await apiRequest('/get_chats', 'POST', {}, 10000);
        chats = data.chats || {};
        renderChatList();
        const ids = Object.keys(chats);
        if (ids.length > 0 && (!activeChatId || !chats[activeChatId])) {
          activeChatId = ids[0];
          openChat(activeChatId);
        }
      } catch (err) {
        console.error('Ошибка загрузки чатов:', err);
        showToast('Ошибка загрузки чатов');
      }
    }

    // ====== UI ======
    function renderChatList() {
      const container = document.getElementById('chatList');
      container.innerHTML = '';
      Object.entries(chats).forEach(([id, chat]) => {
        const div = document.createElement('div');
        div.className = 'chat-item' + (id === activeChatId ? ' active' : '');
        div.innerHTML = `
          <div class="chat-avatar">${chat.type==='group'?'👥':'👤'}</div>
          <div class="chat-info"><div class="chat-name">${escapeHtml(chat.name)}${chat.blocked?' (заблокирован)':''}</div><div class="chat-last">${chat.lastMsg||''}</div></div>
          <div class="chat-actions">
            ${chat.type!=='private'?`<button class="btn btn-sm leave-btn" data-id="${id}">🚪</button>`:''}
            <button class="btn btn-sm delete-btn" data-id="${id}">🗑️</button>
            ${chat.blocked?`<button class="btn btn-sm unblock-btn" data-id="${id}">🔓</button>`:`<button class="btn btn-sm block-btn" data-id="${id}">🚫</button>`}
          </div>`;
        div.addEventListener('click', (e) => { if(e.target.closest('.chat-actions')) return; activeChatId=id; openChat(id); renderChatList(); });
        container.appendChild(div);
      });
      // Обработчики кнопок
      document.querySelectorAll('.delete-btn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();if(confirm('Удалить чат?'))deleteChat(b.dataset.id)}));
      document.querySelectorAll('.block-btn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();blockChat(b.dataset.id)}));
      document.querySelectorAll('.unblock-btn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();unblockChat(b.dataset.id)}));
      document.querySelectorAll('.leave-btn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();if(confirm('Покинуть?'))leaveGroup(b.dataset.id)}));
    }

    function openChat(id) {
      console.log('📂 Открытие чата:', id);
      document.getElementById('inputArea').style.display = 'flex';
      document.getElementById('chatHeader').textContent = chats[id]?.name || '';
      loadMessages(id);
    }

    async function loadMessages(chatId) {
      try {
        const data = await apiRequest('/get_messages', 'POST', { chatId }, 10000);
        displayMessages(data.messages || []);
      } catch (err) {
        console.error('Ошибка загрузки сообщений:', err);
        showToast('Ошибка загрузки сообщений');
      }
    }

    function displayMessages(msgs) {
      const cont = document.getElementById('messagesContainer');
      cont.innerHTML = '';
      msgs.forEach(m => addMessageToUI(m));
      cont.scrollTop = cont.scrollHeight;
    }

    function addMessageToUI(msg) {
      if (!currentUser) return;
      const div = document.createElement('div');
      div.className = 'msg' + (msg.from === currentUser.login ? ' own' : '');
      div.setAttribute('data-id', msg.id);
      let content = `<strong>${escapeHtml(msg.from)}</strong>: <span class="msg-text">${escapeHtml(msg.text||'')}</span>`;
      if (msg.file) {
        const { name, type, size, url, data } = msg.file;
        const fileUrl = url || data;
        if (type.startsWith('image/')) content += `<br><img src="${fileUrl}" alt="${name}" loading="lazy">`;
        else if (type.startsWith('video/')) content += `<br><video controls src="${fileUrl}"></video>`;
        else content += `<br><a href="${fileUrl}" download="${name}">📎 ${name} (${formatSize(size)})</a>`;
      }
      if (msg.edited) content += ' <span class="edited-mark">(изменено)</span>';
      content += `<div class="time">${new Date(msg.time).toLocaleTimeString()}</div>`;
      if (msg.from === currentUser.login) {
        content += `<div class="msg-actions">
          <button class="btn btn-sm" onclick="editMessage('${msg.id}')">✏️</button>
          <button class="btn btn-sm btn-danger" onclick="deleteMessage('${msg.id}')">🗑️</button>
        </div>`;
      }
      div.innerHTML = content;
      document.getElementById('messagesContainer').appendChild(div);
    }

    function handleIncomingMessage(msg) {
      if (!currentUser) return;
      if (msg.from === currentUser.login) return;
      if (!chats[msg.chatId]) { loadChats(); return; }
      if (!chats[msg.chatId].messages) chats[msg.chatId].messages = [];
      if (chats[msg.chatId].messages.find(m => m.id === msg.id)) return;
      chats[msg.chatId].messages.push(msg);
      if (activeChatId === msg.chatId) addMessageToUI(msg);
      renderChatList();
    }

    // ====== ДЕЙСТВИЯ С ЧАТАМИ ======
    async function deleteChat(chatId) {
      try { await apiRequest('/delete_chat', 'POST', { chatId }); loadChats(); } catch(err) { showToast(err.message); }
    }
    async function blockChat(chatId) {
      try { await apiRequest('/block_chat', 'POST', { chatId }); loadChats(); } catch(err) { showToast(err.message); }
    }
    async function unblockChat(chatId) {
      try { await apiRequest('/unblock_chat', 'POST', { chatId }); loadChats(); } catch(err) { showToast(err.message); }
    }
    async function leaveGroup(chatId) {
      try { await apiRequest('/leave_group', 'POST', { chatId }); loadChats(); } catch(err) { showToast(err.message); }
    }

    // ====== ОТПРАВКА СООБЩЕНИЯ (кнопка) ======
    document.getElementById('sendBtn').addEventListener('click', () => {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text && !editingMessageId) return;
      if (editingMessageId) {
        editingMessageId = null;
        document.getElementById('sendBtn').textContent = '➤';
        input.value = '';
        return;
      }
      if (!activeChatId) return;
      sendMessage(activeChatId, text);
      input.value = '';
    });

    document.getElementById('messageInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('sendBtn').click();
      }
    });

    // ====== НОВЫЙ ЧАТ ======
    document.getElementById('newChatBtn').addEventListener('click', () => {
      const action = prompt('1 - Личный чат\n2 - Создать группу\n3 - Создать канал');
      if (action === '1') openSearchModal('user');
      else if (action === '2') { const n = prompt('Название группы:'); if(n) createGroup(n); }
      else if (action === '3') { const n = prompt('Название канала:'); if(n) createChannel(n); }
    });

    async function createGroup(name) {
      try { await apiRequest('/create_group', 'POST', { name }); loadChats(); } catch(err) { showToast(err.message); }
    }
    async function createChannel(name) {
      try { await apiRequest('/create_channel', 'POST', { name }); loadChats(); } catch(err) { showToast(err.message); }
    }

    // ====== ПОИСК ======
    document.getElementById('findGroupsBtn').addEventListener('click', () => openSearchModal('group'));

    function openSearchModal(type) {
      if (type === 'user') {
        document.getElementById('searchModal').classList.add('active');
        document.getElementById('searchQuery').value = '';
        document.getElementById('searchResults').innerHTML = '';
      } else {
        document.getElementById('groupsModal').classList.add('active');
        document.getElementById('groupSearchQuery').value = '';
        document.getElementById('groupSearchResults').innerHTML = '';
      }
    }
    document.getElementById('modalCancel').addEventListener('click', () => document.getElementById('searchModal').classList.remove('active'));
    document.getElementById('groupsModalCancel').addEventListener('click', () => document.getElementById('groupsModal').classList.remove('active'));

    document.getElementById('searchQuery').addEventListener('input', async () => {
      const q = document.getElementById('searchQuery').value.trim();
      if (!q) { document.getElementById('searchResults').innerHTML = ''; return; }
      try {
        const data = await apiRequest('/search_user', 'POST', { query: q });
        showSearchResults(data.users || [], 'user');
      } catch(err) { showToast(err.message); }
    });

    document.getElementById('groupSearchQuery').addEventListener('input', async () => {
      const q = document.getElementById('groupSearchQuery').value.trim();
      if (!q) { document.getElementById('groupSearchResults').innerHTML = ''; return; }
      try {
        const data = await apiRequest('/search_groups', 'POST', { query: q });
        showSearchResults(data.groups || [], 'group');
      } catch(err) { showToast(err.message); }
    });

    function showSearchResults(items, type) {
      const container = type === 'user' ? document.getElementById('searchResults') : document.getElementById('groupSearchResults');
      container.innerHTML = '';
      if (!items.length) { container.innerHTML = '<div>Ничего не найдено</div>'; return; }
      items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'search-result-item';
        if (type === 'user') {
          div.textContent = item.login;
          div.addEventListener('click', async () => {
            try { await apiRequest('/create_private_chat', 'POST', { target: item.login }); loadChats(); } catch(err) { showToast(err.message); }
            document.getElementById('searchModal').classList.remove('active');
          });
        } else {
          div.innerHTML = `${escapeHtml(item.name)} (${item.type==='group'?'Группа':'Канал'}) <button class="btn btn-sm join-btn" data-id="${item.id}">Вступить</button>`;
          div.querySelector('.join-btn').addEventListener('click', async (e) => {
            e.stopPropagation();
            try { await apiRequest('/join_group', 'POST', { chatId: item.id }); loadChats(); } catch(err) { showToast(err.message); }
            document.getElementById('groupsModal').classList.remove('active');
          });
        }
        container.appendChild(div);
      });
    }

    // ====== ЭМОДЗИ ======
    const emojis = '😀😃😄😁😆😅😂🤣😊😇🙂😉😌😍🥰😘😗😙😚😋😛😝😜🤪🤨🧐🤓😎🤩🥳😏😒😞😔😟😕🙁☹️😣😖😫😩🥺😢😭😤😠😡🤬🤯😳🥵🥶😱😨😰😥😓🤗🤔🤭🤫🤥😶😐😑😬🙄😯😦😧😮😲🥱😴🤤😪😵🤐🤢🤮🤧😷🤒🤕🤑🤠😈👿👹👺🤡💩👻💀☠️👽👾🤖🎃😺😸😹😻😼😽🙀😿😾'.split('');
    const emojiPanel = document.getElementById('emojiPanel');
    emojis.forEach(e => {
      const span = document.createElement('span');
      span.textContent = e;
      span.addEventListener('click', () => { document.getElementById('messageInput').value += e; emojiPanel.style.display = 'none'; });
      emojiPanel.appendChild(span);
    });
    document.getElementById('emojiBtn').addEventListener('click', (e) => { e.stopPropagation(); emojiPanel.style.display = emojiPanel.style.display === 'flex' ? 'none' : 'flex'; });
    document.addEventListener('click', () => { emojiPanel.style.display = 'none'; });

    // ====== ИНИЦИАЛИЗАЦИЯ ======
    (async function init() {
      const token = localStorage.getItem('skyid_token');
      if (token) {
        console.log('🔑 Токен найден, пытаемся восстановить сессию...');
        showAuth(false); showApp(true);
        const ok = await verifySession();
        if (ok) {
          await loadChats();
          connectSSE();
        } else {
          localStorage.removeItem('skyid_token');
          showAuth(true); showApp(false);
          showToast('Сессия истекла, войдите заново');
        }
      } else {
        showAuth(true); showApp(false);
      }
      console.log('🚀 SkyMessage (SSE) загружен');
    })();
  </script>
</body>
</html>
