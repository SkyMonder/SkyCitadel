<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>SkyMessage</title>
  <style>
    :root {
      --bg: #0a0f1e; --panel: #111827; --card: #1a233a;
      --border: #2a3450; --text: #e0e8ff; --accent: #5f7ecf;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }
    .auth-screen { position: absolute; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 20; }
    .auth-box { background: var(--card); padding: 2rem; border-radius: 20px; border: 1px solid var(--border); width: 320px; text-align: center; }
    .auth-box input { width: 100%; padding: 0.7rem; margin: 0.5rem 0; background: #0d1225; border: 1px solid var(--border); color: white; border-radius: 10px; }
    .auth-box button { width: 100%; padding: 0.7rem; background: var(--accent); border: none; color: white; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 0.5rem; }
    .switch-link { color: #7f8bb3; font-size: 0.8rem; cursor: pointer; margin-top: 0.8rem; }
    .app { display: flex; width: 100%; height: 100%; }
    .sidebar { width: 300px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 1rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.5rem; }
    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item { padding: 0.8rem 1rem; display: flex; align-items: center; gap: 0.7rem; border-bottom: 1px solid #1e2a40; cursor: pointer; position: relative; }
    .chat-item:hover, .chat-item.active { background: #1f2b4a; }
    .chat-avatar { width: 40px; height: 40px; border-radius: 50%; background: #2f3b5c; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; }
    .chat-info { flex: 1; }
    .chat-name { font-weight: 500; }
    .chat-last { font-size: 0.8rem; color: #8899cc; }
    .chat-actions { display: none; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 0.3rem; z-index: 5; }
    .chat-item:hover .chat-actions { display: flex; gap: 0.3rem; }
    .main-area { flex: 1; display: flex; flex-direction: column; }
    .chat-header { padding: 0.8rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.8rem; background: var(--card); }
    .messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .msg { max-width: 70%; padding: 0.7rem 1rem; border-radius: 16px; background: #1f2b4a; align-self: flex-start; }
    .msg.own { align-self: flex-end; background: var(--accent); }
    .msg .time { font-size: 0.7rem; color: #ccc; margin-top: 0.2rem; text-align: right; }
    .msg img, .msg video { max-width: 200px; border-radius: 8px; margin: 0.3rem 0; }
    .input-area { padding: 1rem; border-top: 1px solid var(--border); display: flex; gap: 0.5rem; background: var(--card); }
    .input-area input { flex: 1; padding: 0.7rem; background: #0d1225; border: 1px solid var(--border); color: white; border-radius: 10px; }
    .btn { background: var(--accent); border: none; color: white; padding: 0.4rem 0.8rem; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
    .btn-danger { background: #c44; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 50; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--card); border-radius: 16px; padding: 1.5rem; width: 320px; border: 1px solid var(--border); }
    .modal input { width: 100%; padding: 0.7rem; margin: 0.5rem 0; background: #0d1225; border: 1px solid var(--border); color: white; border-radius: 10px; }
    .modal .btn-row { display: flex; gap: 0.5rem; justify-content: center; margin-top: 1rem; }
    .search-results { max-height: 200px; overflow-y: auto; margin: 0.5rem 0; }
    .search-result-item { padding: 0.5rem; cursor: pointer; border-radius: 8px; }
    .search-result-item:hover { background: #1f2b4a; }
    .call-ui { position: fixed; bottom: 20px; right: 20px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1rem; display: none; z-index: 30; flex-direction: column; gap: 0.8rem; }
    .call-ui.active { display: flex; }
    video { width: 200px; border-radius: 8px; background: #000; }
    .profile-panel { background: var(--card); padding: 1rem; border-radius: 12px; margin-top: 1rem; }
    .profile-panel input { margin-bottom: 0.5rem; }
    .avatar-upload { width: 80px; height: 80px; border-radius: 50%; background: #2f3b5c; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 2rem; cursor: pointer; background-size: cover; }
  </style>
</head>
<body>
  <!-- Экран входа -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-box">
      <h2 id="authTitle">Вход</h2>
      <input type="text" id="loginInput" placeholder="Логин" autocomplete="off">
      <input type="password" id="passInput" placeholder="Пароль">
      <button id="authBtn">Войти</button>
      <div class="switch-link" id="switchAuth">Нет аккаунта? Зарегистрироваться</div>
    </div>
  </div>

  <!-- Основной интерфейс -->
  <div class="app" id="app" style="display:none;">
    <div class="sidebar">
      <div class="sidebar-header">
        <span>✉️ SkyMessage</span>
        <button class="btn" id="newChatBtn">+</button>
        <button class="btn" id="findGroupsBtn">🔍</button>
        <button class="btn" id="profileBtn">👤</button>
      </div>
      <div class="chat-list" id="chatList"></div>
    </div>
    <div class="main-area">
      <div class="chat-header" id="chatHeader">Выберите чат</div>
      <div class="messages" id="messagesContainer"></div>
      <div class="input-area" id="inputArea" style="display:none;">
        <input type="text" id="messageInput" placeholder="Сообщение...">
        <button class="btn" id="attachBtn">📎</button>
        <input type="file" id="fileInput" style="display:none;" multiple>
        <button class="btn" id="sendBtn">➤</button>
        <button class="btn" id="audioCallBtn" title="Аудиозвонок">📞</button>
        <button class="btn" id="videoCallBtn" title="Видеозвонок">📹</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно поиска пользователей -->
  <div class="modal-overlay" id="searchModal">
    <div class="modal">
      <h3>Поиск пользователя</h3>
      <input type="text" id="searchQuery" placeholder="Введите логин...">
      <div class="search-results" id="searchResults"></div>
      <div class="btn-row">
        <button class="btn" id="modalCancel" style="background:#444;">Отмена</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно поиска групп/каналов -->
  <div class="modal-overlay" id="groupsModal">
    <div class="modal">
      <h3>Поиск групп и каналов</h3>
      <input type="text" id="groupSearchQuery" placeholder="Название...">
      <div class="search-results" id="groupSearchResults"></div>
      <div class="btn-row">
        <button class="btn" id="groupsModalCancel" style="background:#444;">Закрыть</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно вызова -->
  <div class="modal-overlay" id="callModal">
    <div class="modal">
      <h3 id="callModalTitle">Вызов</h3>
      <p id="callModalName"></p>
      <p id="callModalStatus" style="color:#8899cc;"></p>
      <div class="btn-row" id="callModalActions">
        <button class="btn" id="callModalAcceptBtn" style="display:none;">Принять</button>
        <button class="btn" id="callModalRejectBtn" style="background:#c44;">Отклонить</button>
      </div>
    </div>
  </div>

  <!-- Текущий звонок -->
  <div class="call-ui" id="currentCallUI">
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
    <div id="callStatus" style="font-size:0.9rem; color:#8899cc;"></div>
    <div style="display:flex; gap:0.5rem;">
      <button class="btn" id="toggleMic">🎤 Mic</button>
      <button class="btn" id="toggleCam">📷 Cam</button>
      <button class="btn" id="endCallBtn" style="background:#c44;">Завершить</button>
    </div>
  </div>

  <script>
    // Конфигурация
    const WS_URL = 'wss://serveratiuz-8a8k.onrender.com';
    const SERVER_URL = 'https://serveratiuz-8a8k.onrender.com';
    const ICE_SERVERS = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        {
          urls: 'turn:openrelay.metered.ca:80',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        }
      ]
    };

    let ws, currentUser = null, cryptoKey = null, chats = {}, activeChatId = null;
    let localStream = null, peerConnection = null;
    let activeCall = null; // { chatId, callType, incoming: bool, sdp?, from? }

    // Шифрование (только для входа)
    const enc = new TextEncoder(); const dec = new TextDecoder();
    async function deriveKey(password, saltBase64) {
      const salt = Uint8Array.from(atob(saltBase64), c => c.charCodeAt(0));
      const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' }, keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    }

    // WebSocket
    function connectWebSocket() {
      ws = new WebSocket(WS_URL);
      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'auth', login: currentUser.login }));
        sendServerMessage('get_chats', {});
      };
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        switch (msg.type) {
          case 'auth_ok': currentUser = { ...currentUser, ...msg }; break;
          case 'message': handleIncomingMessage(msg); break;
          case 'chat_list': chats = msg.chats; renderChatList(); if (activeChatId) openChat(activeChatId); break;
          case 'chat_created': activeChatId = msg.chatId; sendServerMessage('get_chats', {}); break;
          case 'messages': displayMessages(msg.messages); break;
          case 'user_search_result': showSearchResults(msg.users, 'user'); break;
          case 'call_offer': handleCallOffer(msg); break;
          case 'call_answer': handleCallAnswer(msg); break;
          case 'ice_candidate': handleICECandidate(msg); break;
          case 'call_end': handleCallEnded(); break;
          case 'profile_updated': updateLocalProfile(msg.profile); break;
        }
      };
      ws.onclose = () => setTimeout(connectWebSocket, 3000);
    }

    function sendServerMessage(type, data = {}) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type, ...data }));
      }
    }

    // UI
    function showAuth(s) { document.getElementById('authScreen').style.display = s?'flex':'none'; }
    function showApp(s) { document.getElementById('app').style.display = s?'flex':'none'; }

    // Аутентификация
    document.getElementById('switchAuth').addEventListener('click', function() {
      const t = document.getElementById('authTitle'), b = document.getElementById('authBtn');
      if (t.textContent === 'Вход') { t.textContent='Регистрация'; b.textContent='Создать аккаунт'; this.textContent='Уже есть аккаунт? Войти'; }
      else { t.textContent='Вход'; b.textContent='Войти'; this.textContent='Нет аккаунта? Зарегистрироваться'; }
    });

    document.getElementById('authBtn').addEventListener('click', async () => {
      const login = document.getElementById('loginInput').value.trim();
      const password = document.getElementById('passInput').value;
      if (!login || !password) return alert('Заполни поля');
      const isReg = document.getElementById('authTitle').textContent === 'Регистрация';
      try {
        if (isReg) {
          const salt = window.crypto.getRandomValues(new Uint8Array(16));
          const saltB64 = btoa(String.fromCharCode(...salt));
          cryptoKey = await deriveKey(password, saltB64);
          const res = await fetch(`${SERVER_URL}/register`, {
            method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ login, salt: saltB64 })
          });
          if (!res.ok) { alert('Ошибка регистрации'); return; }
          alert('Аккаунт создан! Войдите.');
          document.getElementById('authTitle').textContent='Вход';
          document.getElementById('authBtn').textContent='Войти';
        } else {
          const res = await fetch(`${SERVER_URL}/login_salt?login=${encodeURIComponent(login)}`);
          if (!res.ok) { alert('Пользователь не найден'); return; }
          const { salt: saltB64 } = await res.json();
          cryptoKey = await deriveKey(password, saltB64);
          currentUser = { login };
          showAuth(false); showApp(true); connectWebSocket();
        }
      } catch(e) { alert('Ошибка: '+e.message); }
    });

    // Чаты
    function renderChatList() { /* ... (без изменений) ... */ }
    function openChat(id) { /* ... */ }
    function displayMessages(msgs) { /* ... */ }
    function addMessageToUI(msg) { /* ... */ }
    function handleIncomingMessage(msg) { /* ... */ }

    document.getElementById('sendBtn').addEventListener('click', () => { /* ... */ });

    // Новый чат
    document.getElementById('newChatBtn').addEventListener('click', () => { /* ... */ });

    // Поиск
    const searchModal = document.getElementById('searchModal');
    const searchInput = document.getElementById('searchQuery');
    const searchResultsDiv = document.getElementById('searchResults');
    function openSearchModal() { /* ... */ }
    document.getElementById('modalCancel').addEventListener('click', () => searchModal.classList.remove('active'));
    searchInput.addEventListener('input', () => { /* ... */ });
    function showSearchResults(users, type) { /* ... */ }

    // Загрузка файлов (упрощённо)
    let uploadToken = null;
    async function ensureUploadToken() { /* ... */ }
    document.getElementById('attachBtn').addEventListener('click', async () => { /* ... */ });
    document.getElementById('fileInput').addEventListener('change', async (e) => { /* ... */ });

    // Профиль (упрощённо)
    document.getElementById('profileBtn').addEventListener('click', () => { /* ... */ });

    // ========== Звонки (полностью переписанные для надёжного отображения) ==========
    const callModal = document.getElementById('callModal');
    const callModalTitle = document.getElementById('callModalTitle');
    const callModalName = document.getElementById('callModalName');
    const callModalStatus = document.getElementById('callModalStatus');
    const callModalAcceptBtn = document.getElementById('callModalAcceptBtn');
    const callModalRejectBtn = document.getElementById('callModalRejectBtn');
    const currentCallUI = document.getElementById('currentCallUI');
    const endCallBtn = document.getElementById('endCallBtn');
    const toggleMicBtn = document.getElementById('toggleMic');
    const toggleCamBtn = document.getElementById('toggleCam');
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');

    function showCallModalWindow(title, name, status, showAccept) {
      callModalTitle.textContent = title;
      callModalName.textContent = name;
      callModalStatus.textContent = status || '';
      callModalAcceptBtn.style.display = showAccept ? 'inline-block' : 'none';
      callModalRejectBtn.textContent = showAccept ? 'Отклонить' : 'Отменить';
      callModal.classList.add('active');
    }
    function hideCallModalWindow() { callModal.classList.remove('active'); }

    function cleanupCall() {
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      localVideo.srcObject = null;
      remoteVideo.srcObject = null;
      currentCallUI.classList.remove('active');
      activeCall = null;
    }

    async function createPeerConnection() {
      peerConnection = new RTCPeerConnection(ICE_SERVERS);
      peerConnection.onicecandidate = (event) => {
        if (event.candidate && activeCall) {
          sendServerMessage('ice_candidate', { chatId: activeCall.chatId, candidate: event.candidate });
        }
      };
      peerConnection.ontrack = (event) => {
        console.log('Удалённый трек получен:', event);
        if (event.streams && event.streams[0]) {
          remoteVideo.srcObject = event.streams[0];
          remoteVideo.style.display = 'block'; // Явно показываем
        }
      };
      if (localStream) {
        localStream.getTracks().forEach(track => {
          console.log('Добавляем локальный трек:', track.kind);
          peerConnection.addTrack(track, localStream);
        });
      }
      return peerConnection;
    }

    async function startCall(callType) {
      if (!activeChatId) return;
      const chat = chats[activeChatId];
      if (!chat || chat.type !== 'private') return alert('Звонки только в личных чатах');
      if (activeCall) return alert('Уже есть активный звонок');

      try {
        const constraints = callType === 'video'
          ? { audio: true, video: { width: 640, height: 480 } }
          : { audio: true, video: false };

        localStream = await navigator.mediaDevices.getUserMedia(constraints);
        localVideo.srcObject = localStream;
        localVideo.style.display = callType === 'audio' ? 'none' : 'block';

        activeCall = { chatId: activeChatId, callType, incoming: false };
        showCallModalWindow('Идёт вызов', chat.name, callType === 'video' ? 'Видеозвонок' : 'Аудиозвонок', false);

        await createPeerConnection();
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        sendServerMessage('call_offer', { chatId: activeChatId, sdp: peerConnection.localDescription, callType });
      } catch (e) {
        console.error('Ошибка начала звонка:', e);
        alert('Не удалось начать звонок: ' + e.message);
        cleanupCall();
        hideCallModalWindow();
      }
    }

    document.getElementById('audioCallBtn').addEventListener('click', () => startCall('audio'));
    document.getElementById('videoCallBtn').addEventListener('click', () => startCall('video'));

    callModalRejectBtn.addEventListener('click', () => {
      if (activeCall) {
        sendServerMessage('call_end', { chatId: activeCall.chatId });
        cleanupCall();
      }
      hideCallModalWindow();
    });

    function handleCallOffer(msg) {
      if (activeCall) {
        sendServerMessage('call_end', { chatId: msg.chatId });
        return;
      }
      activeCall = {
        chatId: msg.chatId,
        callType: msg.callType || 'video',
        incoming: true,
        from: msg.from,
        sdp: msg.sdp
      };
      const typeText = activeCall.callType === 'audio' ? 'Аудиозвонок' : 'Видеозвонок';
      showCallModalWindow('Входящий ' + typeText, msg.from, '', true);
    }

    callModalAcceptBtn.addEventListener('click', async () => {
      const callInfo = activeCall;
      if (!callInfo || !callInfo.incoming) return;
      hideCallModalWindow();

      try {
        const constraints = callInfo.callType === 'video'
          ? { audio: true, video: { width: 640, height: 480 } }
          : { audio: true, video: false };

        localStream = await navigator.mediaDevices.getUserMedia(constraints);
        localVideo.srcObject = localStream;
        localVideo.style.display = callInfo.callType === 'audio' ? 'none' : 'block';
        remoteVideo.style.display = callInfo.callType === 'audio' ? 'none' : 'block';

        currentCallUI.classList.add('active');

        await createPeerConnection();
        await peerConnection.setRemoteDescription(new RTCSessionDescription(callInfo.sdp));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        sendServerMessage('call_answer', { chatId: callInfo.chatId, sdp: peerConnection.localDescription });
      } catch (e) {
        console.error('Ошибка принятия звонка:', e);
        alert('Не удалось принять звонок: ' + e.message);
        cleanupCall();
        hideCallModalWindow();
      }
    });

    function handleCallAnswer(msg) {
      if (!activeCall || activeCall.incoming) return;
      hideCallModalWindow();
      currentCallUI.classList.add('active');
      remoteVideo.style.display = activeCall.callType === 'audio' ? 'none' : 'block';
      localVideo.style.display = activeCall.callType === 'audio' ? 'none' : 'block';
      if (peerConnection) {
        peerConnection.setRemoteDescription(new RTCSessionDescription(msg.sdp))
          .catch(e => console.error('setRemoteDescription error:', e));
      }
    }

    function handleICECandidate(msg) {
      if (peerConnection && msg.candidate) {
        peerConnection.addIceCandidate(new RTCIceCandidate(msg.candidate))
          .catch(e => console.error('addIceCandidate error:', e));
      }
    }

    endCallBtn.addEventListener('click', () => {
      if (activeCall) sendServerMessage('call_end', { chatId: activeCall.chatId });
      cleanupCall();
      hideCallModalWindow();
    });

    function handleCallEnded() {
      cleanupCall();
      hideCallModalWindow();
    }

    toggleMicBtn.addEventListener('click', () => {
      if (localStream) {
        const audioTrack = localStream.getAudioTracks()[0];
        if (audioTrack) audioTrack.enabled = !audioTrack.enabled;
      }
    });

    toggleCamBtn.addEventListener('click', () => {
      if (localStream) {
        const videoTrack = localStream.getVideoTracks()[0];
        if (videoTrack) {
          videoTrack.enabled = !videoTrack.enabled;
          localVideo.style.display = videoTrack.enabled ? 'block' : 'none';
        }
      }
    });

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
  </script>
</body>
</html>
